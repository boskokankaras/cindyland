<script>
/* ============ PWA / AŽURIRANJE (kao K-Sport Hub + version.json za brzu provjeru) ============ */
const PWA = { reg: null, needRefresh: false, lastCheck: 0, hadController: false, newVer: null };

/* version.json se NIKAD ne kešira - odgovor stiže za desetinku sekunde i odmah
   znamo da li na serveru stoji novija verzija (ne čeka se instalacija workera). */
async function serverVersion(){
  try {
    const r = await fetch('./version.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return null;
    const j = await r.json();
    return j && j.version ? j.version : null;
  } catch (e){ return null; }
}
function flagNeedRefresh(ver){
  if (ver) PWA.newVer = ver;
  if (PWA.needRefresh){ const b0 = $('#updBox'); if (b0) b0.classList.add('show'); return; }
  PWA.needRefresh = true;
  if (APP_SHOWN) renderTabbar();
  const row = $('#updCheckBtn'); if (row) row.classList.remove('checking');
  const box = $('#updBox'); if (box) box.classList.add('show');
  if (APP_SHOWN && (TAB === 'jos' || TAB === 'danas')) render();   // obavještenje na Danas + broj verzije u Profilu
}
function trackInstalling(sw){
  if (!sw) return;
  // "hadController" = stranicu je pri učitavanju već kontrolisala starija verzija,
  // pa je svaki novi worker UPDATE (a ne prva instalacija - tada nema obavještenja).
  const ready = () => (sw.state === 'installed' || sw.state === 'activated') && PWA.hadController;
  if (ready()){ flagNeedRefresh(); return; }
  sw.addEventListener('statechange', () => { if (ready()) flagNeedRefresh(); });
}
async function initPWA(){
  if (!('serviceWorker' in navigator)) return;
  try {
    PWA.hadController = !!navigator.serviceWorker.controller;
    const reg = await navigator.serviceWorker.register('./sw.js');
    PWA.reg = reg;
    if (reg.waiting && PWA.hadController) flagNeedRefresh();
    if (reg.installing) trackInstalling(reg.installing);
    reg.addEventListener('updatefound', () => trackInstalling(reg.installing));
  } catch (e){}
  /* odmah po ulasku tiho provjeri verziju na serveru (par stotina bajta) */
  if (PWA.hadController){
    const v = await serverVersion();
    if (v && v !== APP_VERSION) flagNeedRefresh(v);
  }
}
/* „Osvježi i ažuriraj": ako nova verzija čeka - preuzmi je odmah; ako ne (npr. worker
   se još instalira), obriši keš i učitaj iznova da korisnik ne čeka instalaciju. */
async function applyUpdate(){
  const reg = PWA.reg;
  let reloaded = false;
  const doReload = () => { if (reloaded) return; reloaded = true; window.location.reload(); };
  document.querySelectorAll('[data-act="upd-apply"]').forEach(b => { b.disabled = true; b.textContent = 'Osvježavam…'; });
  /* version.json javi novu verziju prije nego što se novi worker instalira (jezgro ~450 KB) - ako korisnik odmah
     dodirne, sačekaj do 8 s da worker završi; brisanje keša ispod njega ostavilo bi novu verziju bez jezgra
     (app bez interneta ne bi krenuo do sljedeće verzije) */
  if (reg && reg.installing && !reg.waiting){
    const sw = reg.installing;
    await new Promise(res => { const t = setTimeout(res, 8000); sw.addEventListener('statechange', () => { if (sw.state !== 'installing'){ clearTimeout(t); res(); } }); });
  }
  if (reg && reg.waiting){
    navigator.serviceWorker.addEventListener('controllerchange', doReload);
    reg.waiting.postMessage({ type: 'SKIP_WAITING' });
    setTimeout(doReload, 2500);
    return;
  }
  try {
    const keys = await caches.keys();
    await Promise.all(keys.filter(k => k !== KES_SLIKE).map(k => caches.delete(k)));   // slike ljubimaca ostaju
  } catch (e){}
  doReload();
}
async function autoCheckUpdate(){
  const now = Date.now();
  if (now - PWA.lastCheck < 60000) return;
  PWA.lastCheck = now;
  const v = await serverVersion();
  if (v && v !== APP_VERSION) flagNeedRefresh(v);
  try { PWA.reg && PWA.reg.update(); } catch (e){}
}
/* Ručna provjera: odgovor sa version.json (brzo), pa tek onda service worker. */
async function checkForUpdate(){
  const okBox = $('#verOk');
  const row = $('#updCheckBtn');
  if (okBox) okBox.classList.remove('show');
  if (PWA.needRefresh || (PWA.reg && PWA.reg.waiting)){ flagNeedRefresh(); return; }
  if (row) row.classList.add('checking');

  const v = await serverVersion();
  if (v && v !== APP_VERSION){
    if (row) row.classList.remove('checking');
    flagNeedRefresh(v);
    try { PWA.reg && PWA.reg.update(); } catch (e){}   // u pozadini povuci novu verziju
    return;
  }
  if (v === APP_VERSION){
    if (row) row.classList.remove('checking');
    if (okBox) okBox.classList.add('show');
    return;
  }
  /* version.json nedostupan (stara objava ili nema mreže) - stari način preko workera */
  if (!PWA.reg){ if (row) row.classList.remove('checking'); if (okBox) okBox.classList.add('show'); return; }
  const reg = PWA.reg;
  const result = await new Promise((resolve) => {
    let done = false;
    const finish = (res) => { if (done) return; done = true; reg.removeEventListener('updatefound', onFound); clearTimeout(to); resolve(res); };
    const track = (sw) => {
      if (!sw) return;
      const ready = () => (sw.state === 'installed' || sw.state === 'activated') && PWA.hadController;
      if (ready()){ finish('update'); return; }
      sw.addEventListener('statechange', () => { if (ready()) finish('update'); });
    };
    const onFound = () => track(reg.installing);
    reg.addEventListener('updatefound', onFound);
    if (reg.installing) track(reg.installing);
    const to = setTimeout(() => finish(reg.waiting ? 'update' : 'current'), 6000);
    Promise.resolve(reg.update()).then(() => {
      if (reg.waiting) finish('update');
    }).catch(() => finish('current'));
  });
  const r2 = $('#updCheckBtn'); if (r2) r2.classList.remove('checking');
  if (result === 'update') flagNeedRefresh();
  else { const ok = $('#verOk'); if (ok) ok.classList.add('show'); }
}

        const poslije = stayBoxes({ boxes: ostali, from: SF.from, to: to0, boxId: null });
        const pokriva = poslije.find(x => x.f <= s.f && s.f <= x.t);
        const nb = pokriva ? boxById(pokriva.b) : null;
        confirmModal('Ukloniti mjesto?',
          `<b>${esc(b.name || '?')}</b> · <span class="num">${s.f === s.t ? fmtD(s.f) : fmtD(s.f) + ' - ' + fmtD(s.t)}</span><br>` +
          (nb ? `Te dane preuzima <b>${esc(nb.name)}</b>${poslije.length === 1 ? ' (cijeli boravak)' : ''}.`
              : (poslije.length ? 'Ti dani ostaju bez boksa.' : 'Boravak ostaje bez boksa.')),
          'sf-box-del-yes', String(i), 'Ukloni', true);
      } break;
    case 'sf-box-del-yes': { const segs = sfSegs(); segs.splice(Number(id), 1); SF.boxes = segs; closeModal(); renderStayForm(); } break;
    case 'sf-plan-take': {
        sfSync();
        const to2 = SF.type === 'dnevni' ? SF.from : SF.to;
        const plan = autoBoxPlan(SF.from, to2, SF.id);
        if (!plan || !plan.segs.length){ toast('Nema slobodnih mjesta u ovom terminu.'); break; }
        SF.boxes = plan.segs;
        renderStayForm();
        toast(plan.segs.length === 1 ? 'Upisan boks.' : 'Raspoređeno u ' + plan.segs.length + ' boksa.');
      } break;
    case 'sf-plan-show': sfSync(); {
        const p = autoBoxPlan(SF.from, SF.type === 'dnevni' ? SF.from : SF.to, SF.id);
        if (!p){ toast('Za ovaj termin i vrstu nema šta da se kombinuje.'); break; }
      } SF.plan = true; renderStayForm(); break;
    case 'sf-box-move': sfSync(); MV = null; sfMoveModal(); break;
    case 'mv-pick': MV.date = id; MV.box = $('#mvBox') ? $('#mvBox').value : ''; sfMoveModal(); break;
    case 'mv-nav': MV.cur = ymShift(MV.cur, Number(id)); MV.box = $('#mvBox') ? $('#mvBox').value : ''; sfMoveModal(); break;
    case 'sf-box-move-do': {
        const d = MV ? MV.date : '', b = $('#mvBox').value;
        if (!b){ toast('Izaberi boks.'); break; }
        const to = SF.type === 'dnevni' ? SF.from : SF.to;
        if (!d || d < SF.from || d > to){ toast('Datum mora biti unutar boravka.'); break; }
        SF.boxes = sfSegs().concat([{ b, f: d, t: to }]);
        closeModal(); renderStayForm();
      } break;
    case 'sf-save': sfSave(); break;
    case 'sf-save-force': sfSave(true); break;
    case 'sf-charge': if (SF && SF.id){ if (!sfTrebaPitati('akcija', false, 'charge')) chargeStart(SF.id); } break;
    /* Otišao / Naplati rade nad SAČUVANIM boravkom; ako je nešto dirano, prvo Sačuvaj ili Odbaci */
    case 'sf-left': if (SF && SF.id){ if (!sfTrebaPitati('akcija', false, 'left')) chargeStart(SF.id, true); } break;
    case 'sf-otv': if (SF){ sfSync(); SF.otv = SF.otv || {}; SF.otv[id] = !SF.otv[id]; renderStayForm(); } break;
    case 'sf-otv-nap': if (SF){ sfSync(); SF.otv = SF.otv || {}; SF.otv.napomena = true; renderStayForm();
        const n = $('#sfNote'); if (n) n.scrollIntoView({ block: 'center' }); } break;
    case 'sf-odbaci': if (SF && SF.id){ const o = SF.otv; closeModal(); sfIzBoravka(SF.id); if (SF) SF.otv = o; renderStayForm(); } break;
    /* „Sačuvati izmjene?" pri zatvaranju boravka */
    case 'sf-izlaz-sacuvaj': { const k = SF_ZATVORI; SF_ZATVORI = null; closeModal();
        if (k === 'akcija' && SF) SF.ostani = true;
        sfSave(false, k === 'sve'); } break;
    case 'sf-izlaz-odbaci': { const k = SF_ZATVORI; SF_ZATVORI = null; closeModal();
        if (k === 'akcija'){
          /* odbaci izmjene pa nastavi sa onim što je pritisnuto (Otišao / Naplati) */
          if (SF && SF.id){ const o = SF.otv, posle = SF.posle, sid = SF.id; sfIzBoravka(sid); if (SF) SF.otv = o; renderStayForm(); if (posle) chargeStart(sid, posle === 'left'); }
        }
        else k === 'sve' ? sheetZatvoriSve(true) : sheetNazad(true); } break;
    case 'sf-izlaz-otkazi': SF_ZATVORI = null; sfOcistiNamjeru(); closeModal(); break;
    case 'sf-unpay': sfUnpayAsk(); break;
    case 'sf-unpay-yes': sfUnpay(id); break;
    /* klijenti */
    case 'client-open': if (SF) sfSync();
      /* „Upiši broj" iz potvrde koja stoji preko kartice: ista kartica vlasnika se samo vrati, a kartica
         ljubimca ustupa svoj korak kartici vlasnika (kao red Vlasnik) */
      if (CE && CE.clientId === id){ CE.pitanje = false; closeModal(); renderClientPop(); break; }
      if (PE) PE.pitanje = false;
      if (PE){ const cid = id; peDone(false, true); if (!PE) openClientPop(cid, false, true); break; }
      openClientPop(id, t.dataset.newpet === '1'); break;
    case 'kl-clear': {
        KL_Q = '';
        const inp = $('#klSearch'); if (inp) inp.value = '';
        const l = $('#klList'); if (l) l.innerHTML = klListHTML();
        const x = document.querySelector('.srch-x'); if (x) x.classList.remove('on');
        const r = $('#klRail'); if (r) r.innerHTML = azRailHTML();
        if (inp) inp.focus();
      } break;
    case 'kl-jump': klJump(id); break;
    /* brisanje iz kartice: potvrda pa nazad u karticu ako se odustane */
    case 'ce-del': cePopSync(); confirmModal('Obrisati klijenta?', 'Obrisaće se i svi njegovi ljubimci i boravci. Ovo se ne može poništiti.', 'client-del-yes', CE.clientId, 'Obriši', true, 'ce-back'); break;
    case 'client-del-yes': { const korak = !!(CE && CE.hist); CE = null; clientDelete(id); if (korak) popBack(); } break;
    case 'ce-pet-del': cePopSync(); confirmModal('Obrisati ljubimca?', 'Boravci ostaju sačuvani.', 'pet-del-yes', id, 'Obriši', true, 'ce-back'); break;
    case 'pet-del-yes': petDelete(id); break;
    case 'ce-back': if (CE) CE.pitanje = false; renderClientPop(); break;
    /* podešavanja */
    case 'prices-open': pricesSheet(); break;
    case 'prices-save': {
        const g = x => parseMoney($(x).value);
        const cat = k => ({ dan: g('#pr_' + k + '_dan'), par: g('#pr_' + k + '_par'), dan10: g('#pr_' + k + '_dan10'), par10: g('#pr_' + k + '_par10'), mj: g('#pr_' + k + '_mj'), parMj: g('#pr_' + k + '_parMj') });
        const np = { dnevni: g('#pr_dnevni'), mali: cat('mali'), veliki: cat('veliki'), macka: cat('macka') };
        const sve = [np.dnevni].concat(['mali', 'veliki', 'macka'].flatMap(k => Object.values(np[k])));
        if (sve.some(v => v == null)){ toast('Provjeri iznose.'); break; }
        D.prices = np; dbSavePrices(); closeSheet(); render(); toast('Cjenovnik sačuvan.');
      } break;
    case 'boxes-open': boxesSheet(); break;
    case 'bl-open': blSheet(); break;
    case 'box-toggle': { const b = boxById(id); b.active = !b.active; dbSave('boxes', b); boxesSheet(); } break;
    case 'box-add': {
        const name = $('#newBoxName').value.trim();
        if (!name){ toast('Upiši naziv.'); break; }
        const maxSort = Math.max(0, ...D.boxes.map(b => b.sort || 0));
        const b = { id: uid(), name, group: $('#newBoxGroup').value, active: true, sort: maxSort + 1 };
        D.boxes.push(b); dbSave('boxes', b); boxesSheet(); toast('Dodato.');
      } break;
    case 'install-help': installHelpSheet(); break;
    case 'pet-photo-pick': { const f = $('#petPhotoFile'); if (f) f.click(); } break;
    /* update */
    case 'upd-apply': applyUpdate(); break;
    case 'upd-check': checkForUpdate(); break;
    /* okvir */
    case 'sheet-close': sheetZatvoriSve(); break;
    case 'sheet-back': sheetNazad(); break;
    case 'modal-close':
      if (t.classList.contains('modal-overlay') && e.target.closest('.modal')) break;
      /* ako je preko kartice iskočila potvrda (brisanje), klik pored vraća u karticu - ne zatvara sve */
      if (PE && !$('#modalHost').querySelector('.modal-card')){ PE.pitanje = false; closeModal(); renderPetPop(); break; }
      if (CE && !$('#modalHost').querySelector('.modal-card')){ CE.pitanje = false; closeModal(); renderClientPop(); break; }
      if (PE){ peDone(); break; }     // kartica ljubimca nista ne upisuje tiho (pita ako je u izmjeni)
      if (CE){ ceDone(true); break; } // zatvaranje kartice klijenta i upisuje izmjene
      if (NM){ nmZatvori(); break; }
      SF_ZATVORI = null; sfOcistiNamjeru();
      closeModal(); break;
  }
});

document.addEventListener('input', (e) => {
  if (e.target.id === 'klSearch'){
    KL_Q = e.target.value;
    const l = $('#klList'); if (l) l.innerHTML = klListHTML();
    const x = document.querySelector('.srch-x'); if (x) x.classList.toggle('on', !!KL_Q);
    const r = $('#klRail'); if (r) r.innerHTML = azRailHTML();
  }
  if (e.target.id === 'sfClientQ' && SF){
    SF.clientQ = e.target.value;
    const l = $('#sfClientList'); if (l) l.innerHTML = sfClientListHTML();
  }
  /* kucanje u Ukupno/Avans odmah preračuna "za naplatu" (bez re-rendera - ne smije pojesti fokus) */
  if ((e.target.id === 'sfPrice' || e.target.id === 'sfAvans') && SF){
    sfSync();
    const d = $('#sfDue'); if (d) d.innerHTML = sfDueHTML();
  }
  if ((e.target.id === 'sfPrice' || e.target.id === 'sfAvans' || e.target.id === 'sfNote') && SF) sfSaveBar();
  /* prozor naplate: koliko ostaje poslije ukucanog iznosa (Duguje / Popust) */
  if (e.target.id === 'nmIznos' && NM){
    NM.rucno = true;
    const st = D.stays.find(s => s.id === NM.id);
    const o = $('#nmOstatak'); if (st && o) o.innerHTML = nmOstatakHTML(st);
  }
});
document.addEventListener('change', (e) => {
  if (e.target.id === 'sfBox' && SF){
    sfSync();
    const to = SF.type === 'dnevni' ? SF.from : SF.to;
    SF.boxes = e.target.value ? [{ b: e.target.value, f: SF.from, t: to || SF.from }] : [];
    renderStayForm();
  }
  if (e.target.id === 'mvBox' && MV) MV.box = e.target.value;
  if (e.target.id === 'petPhotoFile' && e.target.files[0]){ uploadPetPhoto(e.target.dataset.pet, e.target.files[0]); e.target.value = ''; }
});
/* mala slika za stare upise ne postoji dok je `dopuniMaleSlike` ne napravi: service worker tada sam podmetne
   veliku, a ako on još ne radi (prvo otvaranje, privatni režim) ovo je zamjena. `error` se ne penje do
   dokumenta, ali ga capture faza ipak hvata. */
document.addEventListener('error', (e) => {
  const t = e.target;
  if (!t || t.tagName !== 'IMG' || !t.dataset || !t.dataset.velika) return;
  const v = t.dataset.velika;
  delete t.dataset.velika;            // samo jedna zamjena, da se ne vrti u krug
  if (t.src !== v) t.src = v;
}, true);
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'loginPass' || (e.target.id === 'loginEmail' && LOGIN_MODE === 'login')) doLogin();
  else if (e.target.id === 'loginEmail' && LOGIN_MODE === 'forgot') sendReset();
  else if (e.target.id === 'npPass2') saveNewPass();
});

/* kad prođe ponoć (ili se app otvori u novom danu) - „Danas" se sam prebaci na novi dan */
let LAST_DAY = todayISO();
function dayTick(){
  if (todayISO() === LAST_DAY) return;
  LAST_DAY = todayISO();
  if (APP_SHOWN) render();
}
setInterval(dayTick, 60 * 1000);

document.addEventListener('visibilitychange', () => { if (!document.hidden){ dayTick(); autoCheckUpdate(); ponoviNesacuvano(); if (sb && APP_SHOWN) scheduleReload(); } });
window.addEventListener('focus', autoCheckUpdate);
/* kad se internet vrati, ono što nije stiglo na server ide ponovo */
window.addEventListener('online', () => { ponoviNesacuvano(); if (sb && APP_SHOWN) scheduleReload(); });
setInterval(autoCheckUpdate, 30 * 60 * 1000);

/* pokretanje */
(async function boot(){
  initPWA();
  cekaUcitaj();          // nepotvrđeni upisi od prošlog puta
  vratiNesacuvano();     // i odmah nazad na ekran, da ih Vesna vidi
  if (!sb){
    await maybeSeedDemo();
    showApp(); render();
    return;
  }
  const { data: { session } } = await sb.auth.getSession();
  if (session){
    sb._cindyEmail = session.user.email;
    sb._cindyName = (session.user.user_metadata || {}).full_name || '';
    showApp(); render(); ponoviNesacuvano(true); loadAll(); initRealtime();
  } else {
    showLogin();
  }
  sb.auth.onAuthStateChange((ev, sess) => {
    if (ev === 'PASSWORD_RECOVERY'){
      APP_SHOWN = false;
      LOGIN_MODE = 'recovery';
      showLogin();
      return;
    }
    if (ev === 'SIGNED_IN' && !APP_SHOWN && sess && LOGIN_MODE !== 'recovery'){
      sb._cindyEmail = sess.user.email;
      sb._cindyName = (sess.user.user_metadata || {}).full_name || '';
      showApp(); render(); ponoviNesacuvano(true); loadAll(); initRealtime();
    }
  });
})();
</script>
