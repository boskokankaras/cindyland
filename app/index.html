/* objedinjavanje: ljubimci, boravci i naplate selektovanih prelaze pod baznog klijenta */
async function mergeClients(baseId, ids){
  const base = clientById(baseId); if (!base) return false;
  for (const id of ids){
    if (id === baseId) continue;
    const c = clientById(id); if (!c) continue;
    if (sb){
      let r = await sb.from('pets').update({ client_id: baseId }).eq('client_id', id);
      if (r.error) return false;
      r = await sb.from('stays').update({ client_id: baseId }).eq('client_id', id);
      if (r.error) return false;
      r = await sb.from('clients').delete().eq('id', id);
      if (r.error) return false;
    }
    D.pets.forEach(p => { if (p.clientId === id) p.clientId = baseId; });
    D.stays.forEach(s => { if (s.clientId === id) s.clientId = baseId; });
    if (!base.phone && c.phone) base.phone = c.phone;
    if (c.note && c.note !== base.note) base.note = base.note ? base.note + ' · ' + c.note : c.note;
    if (c.blacklist) base.blacklist = true;
    D.clients = D.clients.filter(x => x.id !== id);
  }
  save();
  dbSave('clients', base);
  return true;
}

async function klMergeDo(){
  if (!KL_MERGE || !KL_MERGE.sel.size) return;
  const base = clientById(KL_MERGE.baseId); if (!base) return;
  const ids = [...KL_MERGE.sel];
  closeModal();
  const ok = await mergeClients(KL_MERGE.baseId, ids);
  if (!ok){ toast('Nije uspjelo - provjeri internet pa pokušaj ponovo.'); render(); return; }
  KL_MERGE = null;
  render();
  toast('Objedinjeno pod: ' + base.name);
  openClientPop(base.id);
}

/* ============ ZARADA ============ */
/* svaka naplata nosi svoj datum - dug boravak plaćen u više navrata ulazi u mjesec kad je plaćen */
function allPayments(){
  const out = [];
  D.stays.forEach(st => stayPayments(st).forEach(p => out.push({ st, a: p.a, d: p.d })));
  return out;
}
function unpaidStays(){
  const t = todayISO();
  /* završen = štriknut odlazak (odmah, isti dan) ILI prošao datum odlaska */
  return D.stays.filter(st => {
    if (st.paid || chargeDue(st) <= 0) return false;
    const kraj = st.leftAt && st.leftAt < st.to ? st.leftAt : st.to;
    return (st.leftAt || kraj < t) && kraj >= addDays(t, -45);
  });
}
function vZarada(){
  const pays = allPayments().filter(p => (p.d || '').slice(0, 7) === ZAR_YM).sort((a, b) => b.d.localeCompare(a.d));
  const total = pays.reduce((s, p) => s + p.a, 0);
  const unpaid = unpaidStays();
  const unpaidSum = unpaid.reduce((s, st) => s + chargeDue(st), 0);

  const year = ZAR_YM.slice(0, 4);
  const yearTotal = allPayments().filter(p => (p.d || '').slice(0, 4) === year).reduce((s, p) => s + p.a, 0);

  let html = `<div class="cal-head">
    <button class="iconbtn" data-act="zar-nav" data-id="-1" aria-label="Prethodni mjesec">${I.chevL}</button>
    <div class="cal-title">${monthLabel(ZAR_YM)}</div>
    <button class="iconbtn" data-act="zar-nav" data-id="1" aria-label="Sljedeći mjesec">${I.chevR}</button>
  </div>`;

  html += `<div class="card" style="text-align:center;padding:22px 16px">
    <div class="big-amount num" style="color:var(--ok)">${money(total)}</div>
    <div style="color:var(--muted);font-weight:600;margin-top:2px">naplaćeno · ${monthLabel(ZAR_YM)}</div>
    <div class="stat-grid">
      <div class="stat"><div class="s-val num">${pays.length}</div><div class="s-lbl">${plural(pays.length, 'naplata', 'naplate', 'naplata')}</div></div>
      <div class="stat"><div class="s-val num">${money(yearTotal)}</div><div class="s-lbl">ukupno u ${year}.</div></div>
    </div>
  </div>`;

<script>
/* ============ SHEET / MODAL okvir ============ */
let sheetOpen = false;
function openSheet(title, html, fab){
  $('#sheetTitle').textContent = title;
  $('#sheetBody').innerHTML = html;
  const f = $('#sheetFab');
  if (fab){
    f.innerHTML = I.plus + ' ' + esc(fab.label);
    f.dataset.act = fab.act;
    f.style.display = 'flex';
    $('#sheet').classList.add('has-fab');
  } else {
    f.style.display = 'none';
    $('#sheet').classList.remove('has-fab');
  }
  $('#sheet').classList.add('open');
  $('#sheetOverlay').classList.add('open');
  document.body.classList.add('noscroll');
  $('#sheetBody').scrollTop = 0;
  /* ako je korak u istoriji već zauzela kartica klijenta, sheet ga preuzme (bez dupliranja) */
  if (!sheetOpen){
    if (history.state && history.state.cePop) history.replaceState({ sheet: 1 }, '');
    else history.pushState({ sheet: 1 }, '');
    sheetOpen = true;
  }
}
function closeSheet(viaPop){
  if (!sheetOpen) return;
  $('#sheet').classList.remove('open');
  $('#sheetOverlay').classList.remove('open');
  document.body.classList.remove('noscroll');
  sheetOpen = false;
  SF = null;
  if (!viaPop && history.state && history.state.sheet) popBack();
}
/* kad app SAM vrati korak (zatvaranje kartice dugmetom), popstate koji stigne poslije
   nije korisnikov „nazad" - preskace se, inace bi zatvorio i sheet ispod kartice */
let POP_SKIP = false;
function popBack(){ POP_SKIP = true; history.back(); }
window.addEventListener('popstate', () => {
  if (POP_SKIP){ POP_SKIP = false; return; }
  if (PE){ peDone(true); return; }         // „nazad" prvo zatvara karticu ljubimca
  if (CE){ ceDone(true, true); return; }   // pa karticu klijenta
  if (sheetOpen) closeSheet(true);
});

function showModal(html, wide, cls){ $('#modalHost').innerHTML = `<div class="modal-overlay" data-act="modal-close"><div class="modal ${wide ? 'modal-wide' : ''} ${cls || ''}">${html}</div></div>`; }
function closeModal(){ $('#modalHost').innerHTML = ''; }
/* cancelAct = gdje se vraća na „Otkaži" (npr. nazad u karticu klijenta) */
function confirmModal(title, text, act, id, btnLabel, danger, cancelAct){
  showModal(`<div class="modal-title">${esc(title)}</div><div class="modal-text">${text}</div>
    <div class="modal-actions">
      <button class="btn btn-ghost" data-act="${cancelAct || 'modal-close'}">Otkaži</button>
      <button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-act="${act}" data-id="${id}">${esc(btnLabel)}</button>
    </div>`);
}

/* ============ NAPLATA ============ */
/* ostatak za naplatu = cijena - depozit - ono što je već plaćeno */
function chargeDue(st){ return Math.max(0, (stayAmount(st) || 0) - (st.deposit || 0) - stayPaidSum(st)); }

function chargeStart(stayId){
  const st = D.stays.find(s => s.id === stayId); if (!st) return;
  if (st.to !== todayISO() && !stayLeft(st)){
    const n = (st.petIds || []).length;
    showModal(`<div class="modal-title">Naplata</div>
      <div class="modal-text"><b>${esc(stayLabel(st))}</b> danas ne napušta${n > 1 ? 'ju' : ''} pansion (boravak traje do ${fmtDY(st.to)}).</div>
      <div class="modal-actions modal-stack">
        <button class="btn btn-primary" data-act="charge-force" data-id="${st.id}">Naplati i odjavi</button>
        <button class="btn btn-ghost" data-act="charge-stay" data-id="${st.id}">Samo naplata, ostaje u pansionu</button>
        <button class="btn btn-ghost" data-act="modal-close">Otkaži</button>
      </div>`);
    return;
  }
  chargeModal(stayId, true);
}

function chargeModal(stayId, andLeave){
  const st = D.stays.find(s => s.id === stayId); if (!st) return;
  const amount = stayAmount(st);
  const dep = st.deposit || 0;
  const before = stayPaidSum(st);
  const due = chargeDue(st);
  showModal(`<div class="modal-title">Naplata</div>
    <div class="modal-text">${esc(stayLabel(st))} · ${stayLenLabel(st)} (${fmtD(st.from)} - ${fmtD(st.to)})
      ${dep ? `<br>Cijena ${money(amount || 0)} · depozit ${money(dep)}` : ''}
      ${before ? `<br>Već naplaćeno: <b>${money(before)}</b>` : ''}</div>
    <div class="fld"><label class="lbl">${dep || before ? 'Za naplatu (€)' : 'Iznos (€)'}</label>
      <input type="text" inputmode="decimal" id="chargeAmount" value="${due || ''}" style="font-size:22px;font-weight:800;text-align:center">
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" data-act="modal-close">Otkaži</button>
      <button class="btn btn-ok" data-act="charge-confirm" data-id="${st.id}" data-leave="${andLeave ? 1 : 0}">${I.check} Naplaćeno</button>
    </div>`);
  setTimeout(() => { const i = $('#chargeAmount'); if (i){ i.focus(); i.select(); } }, 60);
}
function chargeConfirm(stayId, andLeave){
  const st = D.stays.find(s => s.id === stayId); if (!st) return;
  const val = parseMoney($('#chargeAmount').value);
  if (val == null){ toast('Upiši iznos.'); return; }
  const dep = st.deposit || 0;
  const pays = stayPayments(st);
  pays.push({ a: val, d: todayISO() });
  st.payments = pays;
  if (andLeave){
    /* boravak je zaključen: ukupna cijena = depozit + sve uplate, boks se oslobađa sjutradan */
    st.price = dep + pays.reduce((s, p) => s + p.a, 0);
    st.paid = true; st.paidAt = todayISO();
    if (!st.leftAt) st.leftAt = todayISO();
  } else {
    /* uplata usput - boravak i dalje traje */
    st.paid = false; st.paidAt = null;
  }
  dbSave('stays', st);
  closeModal(); if (sheetOpen) closeSheet(); render();
  toast(andLeave
    ? 'Naplaćeno ' + money(val) + (dep ? ' (ukupno ' + money(st.price) + ' sa depozitom)' : '')
    : 'Upisana uplata ' + money(val) + ' - boravak i dalje traje.');
}
</script>
<script>
/* ============ FORMA BORAVKA ============ */
let SF = null;

function openStayForm(opts){
  opts = opts || {};
  if (opts.stayId){
    const st = D.stays.find(s => s.id === opts.stayId); if (!st) return;
    SF = {
      id: st.id, clientId: st.clientId, clientQ: '', newClient: null,
      petIds: new Set(st.petIds || []), newPets: [], petForm: null,
      type: st.type, from: st.from, to: st.to, calCur: st.from.slice(0, 7),
      boxes: stayBoxes(st).map(s => ({ ...s })), price: st.price != null ? String(st.price) : '',
      deposit: st.deposit != null ? String(st.deposit) : '',
      paid: !!st.paid, paidAt: st.paidAt || null, note: st.note || '',
    };
  } else {
    const from = opts.from || opts.date || '';
    SF = {
      id: null, clientId: opts.clientId || null, clientQ: '', newClient: null,
      petIds: new Set(), newPets: [], petForm: null,
      type: 'pansion', from, to: opts.to || '', calCur: (from || todayISO()).slice(0, 7), vrsta: opts.vrsta || null,
      boxes: opts.boxId ? [{ b: opts.boxId, f: from, t: from }] : [],
      price: '', deposit: '', paid: false, paidAt: null, note: '',
    };
    if (SF.clientId){
      const pets = petsOfClient(SF.clientId);
      if (pets.length === 1) SF.petIds.add(pets[0].id);
    }
  }
  renderStayForm();
}

/* pokupi tekstualna polja iz DOM-a u draft (da re-render ne pojede unos) */
function sfSync(){
  if (!SF) return;
  const g = id => document.getElementById(id);
  if (g('sfPrice')) SF.price = g('sfPrice').value;
  if (g('sfDeposit')) SF.deposit = g('sfDeposit').value;
  if (g('sfNote')) SF.note = g('sfNote').value;
  if (SF.newClient){
    if (g('sfNcName')) SF.newClient.name = g('sfNcName').value;
    if (g('sfNcPhone')) SF.newClient.phone = g('sfNcPhone').value;
  }
  if (SF.petForm){
    if (g('sfPfName')) SF.petForm.name = g('sfPfName').value;
    if (g('sfPfBreed')) SF.petForm.breed = g('sfPfBreed').value;
  }
}
function sfDraftPets(){
  return [...SF.petIds].map(petById).filter(Boolean).concat(SF.newPets);
}

/* birač termina - jedan kalendar, klik od pa do (kao K-Sport).
   S = stanje sa poljima {from, to, calCur, type} - forma boravka (SF) ili provjera datuma (PD). */
function drCalHTML(S, acts){
  S = S || SF;
  const aNav = (acts && acts.nav) || 'dr-nav', aPick = (acts && acts.pick) || 'dr-pick';
  const [cy, cm] = S.calCur.split('-').map(Number);
  const od = S.from || '';
  const doo = S.type === 'dnevni' ? od : (S.to || '');
  const t = todayISO();
  const first = new Date(cy, cm - 1, 1);
  const start = new Date(first);
  start.setDate(1 - ((first.getDay() + 6) % 7));
  let days = '';
  for (let i = 0; i < 42; i++){
    const d = new Date(start); d.setDate(start.getDate() + i);
    const iso = isoFromDate(d);
    const inMonth = d.getMonth() === cm - 1;
    const isStart = iso === od, isEnd = iso === doo;
    const single = od && doo && od === doo;
    const isIn = od && doo && iso > od && iso < doo;
    days += `<button type="button" class="dr-day ${inMonth ? '' : 'other'} ${iso === t ? 'today' : ''}
      ${isStart || isEnd ? 'r-edge' : ''} ${isStart && doo && !single ? 'r-start' : ''} ${isEnd && !single ? 'r-end' : ''} ${isIn ? 'r-in' : ''}"
      data-act="${aPick}" data-id="${iso}"><span class="dr-num num">${d.getDate()}</span></button>`;
  }
  const dows = DOWS_S.map((x, i) => `<span class="dr-dow ${i === 6 ? 'ned' : ''}">${x}</span>`).join('');
  let foot;
  if (S.type === 'dnevni'){
    foot = od ? `Dan: <strong>${fmtDY(od)}</strong>` : 'Izaberi dan';
  } else if (od && doo){
    const n = diffDays(od, doo);
    foot = `Trajanje: <strong>${nightsLabel(n)}</strong> · ${fmtDY(od)} - ${fmtDY(doo)}`;
  } else if (od){
    foot = `Dolazak: <strong>${fmtDY(od)}</strong> - sad izaberi dan odlaska`;
  } else {
    foot = 'Izaberi datum dolaska i odlaska';
  }
  return `<div class="dr">
    <div class="dr-head">
      <button type="button" class="dr-nav" data-act="${aNav}" data-id="-12">«</button>
      <button type="button" class="dr-nav" data-act="${aNav}" data-id="-1">‹</button>
      <span class="dr-title">${monthLabel(S.calCur)}</span>
      <button type="button" class="dr-nav" data-act="${aNav}" data-id="1">›</button>
      <button type="button" class="dr-nav" data-act="${aNav}" data-id="12">»</button>
    </div>
    <div class="dr-grid">${dows}${days}</div>
    <div class="dr-foot">${foot}</div>
  </div>`;
}
function drPick(iso, S){
  S = S || SF;
  if (S.type === 'dnevni'){ S.from = iso; S.to = iso; return; }
  const od = S.from, doo = S.to;
  if (!od || (od && doo)){ S.from = iso; S.to = ''; }
  else if (iso < od){ S.from = iso; S.to = ''; }
  else { S.to = iso; }
}

/* popunjenost kapaciteta za izabrani termin: dani bez ijednog slobodnog boksa */
/* STROGO pravilo (Vesna i Novica, 31.7.): mali pas SAMO u male bokseve,
   veliki pas SAMO u velike, mačka SAMO u mačje - vrste se ne miješaju. */
function vrstaGrupa(v){ return v === 'macka' ? 'm' : (v === 'veliki' ? 'vb' : 'mb'); }
function sfRelevantGroups(){
  const pets = sfDraftPets();
  const g = new Set();
  for (const p of pets){
    if (p.species === 'macka') g.add('m');
    else g.add(p.size === 'veliki' ? 'vb' : 'mb');
  }
  /* dok ljubimac nije izabran, važi vrsta sa koje se došlo iz „Provjeri datume" */
  if (!g.size && SF && SF.vrsta) g.add(vrstaGrupa(SF.vrsta));
  if (!g.size){ g.add('mb'); g.add('vb'); g.add('m'); }
  return g;
}
/* popunjenost po danu za izabrani termin:
   `kavezi` = nema više slobodnog PRAVOG boksa (sljedeći ide u kavez),
   `puni`   = nema slobodnog baš ničega. */
function sfLoadDays(){
  const from = SF.from, to = SF.type === 'dnevni' ? SF.from : SF.to;
  const prazno = { puni: [], kavezi: [] };
  if (!from || !to || to < from || diffDays(from, to) > 400) return prazno;
  const groups = sfRelevantGroups();
  const boxes = D.boxes.filter(b => b.active && groups.has(b.group));
  if (!boxes.length) return prazno;
  const pravi = boxes.filter(b => !boxSpare(b));
  const use = boxUsage(from, to, SF.id);
  const zauzet = (b, iso) => !!(use[b.id] && use[b.id].days.has(iso));
  const puni = [], kavezi = [];
  for (let iso = from; iso <= to; iso = addDays(iso, 1)){
    if (!boxes.some(b => !zauzet(b, iso))) puni.push(iso);
    else if (pravi.length && !pravi.some(b => !zauzet(b, iso))) kavezi.push(iso);
  }
  return { puni, kavezi };
}
function sfFullDays(){ return sfLoadDays().puni; }
function dayRanges(days){
  const out = [];
  for (const d of days){
    const last = out[out.length - 1];
    if (last && addDays(last.to, 1) === d) last.to = d;
    else out.push({ from: d, to: d });
  }
  return out;
}
function fullDaysLabel(days){
  return dayRanges(days).map(r => r.from === r.to ? fmtD(r.from) : fmtD(r.from) + ' - ' + fmtD(r.to)).join(', ');
}
function sfPetsSuffix(){
  const pets = sfDraftPets();
  const dog = pets.some(p => p.species !== 'macka'), cat = pets.some(p => p.species === 'macka');
  return cat && !dog ? ' za mačke' : (dog && !cat ? ' za pse' : '');
}
/* Popunjeno NIJE zabrana: pitamo i upisujemo ako Vesna/Novica tako odluče. */
function sfCapacityAsk(next){
  const days = sfFullDays();
  if (!days.length) return false;
  const from = SF.from, to = SF.type === 'dnevni' ? SF.from : SF.to;
  const uk = diffDays(from, to) + 1;
  showModal(`<div class="modal-title">Preko kapaciteta</div>
    <div class="modal-text"><b class="num">${days.length}</b> od <b class="num">${uk}</b> ${plural(uk, 'dana', 'dana', 'dana')} ovog boravka je preko predviđenog kapaciteta${sfPetsSuffix()}:
      <br><b class="num">${fullDaysLabel(days)}</b>
      <br><span class="hint" style="display:block;margin-top:8px">Boravak se svejedno može upisati.</span></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" data-act="modal-close">Odustani</button>
      <button class="btn btn-primary" data-act="${next}">Upiši</button>
    </div>`);
  return true;
}

/* segmenti boksa u formi, poravnati na izabrani termin */
function sfSegs(){
  const from = SF.from, to = SF.type === 'dnevni' ? SF.from : SF.to;
  if (!from || !to || to < from) return (SF.boxes || []).filter(s => s && s.b);
  return stayBoxes({ boxes: SF.boxes, from, to, boxId: null });
}
/* dokle boravak koji se uređuje STVARNO drži boks: poslije štrika „Otišao" ga više ne drži,
   pa se ni sudar ne smije tražiti po punom terminu (inače lažno vikne „Boks je već zauzet"
   na boravak koji je odavno otišao a boks legalno dobio neko drugi) */
function sfLeftLimit(){
  const st0 = SF && SF.id ? D.stays.find(s => s.id === SF.id) : null;
  return st0 && st0.leftAt ? st0.leftAt : null;
}
/* padajući meni bokseva: koliko je koji slobodan u izabranom terminu */
function boxOptionsHTML(from, to, selected){
  const groups = sfRelevantGroups();
  const valid = from && to && to >= from;
  const use = valid ? boxUsage(from, to, SF ? SF.id : null) : {};
  let out = '<option value="">- izaberi boks -</option>';
  for (const g of ['mb', 'vb', 'm']){
    if (!groups.has(g)) continue;
    const items = sortedBoxes().filter(b => b.group === g && (b.active || b.id === selected));
    if (!items.length) continue;
    out += `<optgroup label="${GROUPS[g]}">`;
    out += items.map(b => {
      /* piše tačno OD KAD DO KAD je slobodan - ne više samo „djelimično slobodan" */
      let suffix = '';
      if (valid && use[b.id]){
        const lbl = freeRangesLabel(boxFreeRanges(b.id, from, to, use), from, to);
        if (lbl) suffix = ' - ' + lbl;
      }
      return `<option value="${b.id}" ${selected === b.id ? 'selected' : ''}>${esc(b.name + suffix)}</option>`;
    }).join('');
    out += '</optgroup>';
  }
  return out;
}
/* SAM RASPOREDI: složi mjesta za cijeli termin sa najmanje selidbi.
   PRVO pravi boksevi, kavez/transporter tek kad pravih nema - to je jedino što im je bitno. */
function autoBoxPlan(from, to, exceptId, grupe){
  if (!from || !to || to < from || diffDays(from, to) > 400) return null;
  const groups = grupe || sfRelevantGroups();
  const boxes = sortedBoxes().filter(b => b.active && groups.has(b.group));
  if (!boxes.length) return null;
  const use = boxUsage(from, to, exceptId);
  const dani = [];
  for (let iso = from; iso <= to; iso = addDays(iso, 1)) dani.push(iso);
  /* za svako mjesto: koliko dana zaredom je slobodno počev od svakog dana */
  const runs = {};
  for (const b of boxes){
    const arr = new Array(dani.length).fill(0);
    const busy = use[b.id] ? use[b.id].days : null;
    for (let i = dani.length - 1; i >= 0; i--){
      arr[i] = (busy && busy.has(dani[i])) ? 0 : 1 + (i + 1 < dani.length ? arr[i + 1] : 0);
    }
    runs[b.id] = arr;
  }
  const pravi = boxes.filter(b => !boxSpare(b)), kavezi = boxes.filter(boxSpare);
  /* koliko dana zaredom (počev od svakog dana) NIJEDAN pravi boks nije slobodan -
     toliko i najviše toliko ostaje u kavezu, pa nazad u pravi boks */
  const bezPravog = new Array(dani.length).fill(0);
  for (let i = dani.length - 1; i >= 0; i--){
    const ima = pravi.some(b => runs[b.id][i] > 0);
    bezPravog[i] = ima ? 0 : 1 + (i + 1 < dani.length ? bezPravog[i + 1] : 0);
  }
  const segs = [], full = [];
  let i = 0;
  while (i < dani.length){
    let best = null, bestRun = 0;
    for (const grupa of [pravi, kavezi]){
      for (const b of grupa){ if (runs[b.id][i] > bestRun){ bestRun = runs[b.id][i]; best = b; } }
      if (best){
        if (grupa === kavezi) bestRun = Math.max(1, Math.min(bestRun, bezPravog[i]));
        break;   // pravi boks ima prednost nad kavezom
      }
    }
    if (!best){ full.push(dani[i]); i++; continue; }
    const last = segs[segs.length - 1];
    if (last && last.b === best.id && addDays(last.t, 1) === dani[i]) last.t = dani[i + bestRun - 1];
    else segs.push({ b: best.id, f: dani[i], t: dani[i + bestRun - 1] });
    i += bestRun;
  }
  return { segs, full };
}
function autoPlanHTML(from, to, tarzi){
  const plan = autoBoxPlan(from, to, SF.id);
  if (!plan) return '';
  const jedan = plan.segs.length === 1 && !plan.full.length && plan.segs[0].f === from && plan.segs[0].t === to;
  /* kad jedan pravi boks pokriva cijeli termin nema šta da se kombinuje - osim ako su sami tražili */
  if (jedan && !boxSpare(boxById(plan.segs[0].b) || {}) && !tarzi) return '';
  /* hronološki: i mjesta i rupe kad nema ničeg slobodnog */
  const stavke = plan.segs.map(s => ({ f: s.f, t: s.t, b: s.b }))
    .concat(dayRanges(plan.full).map(r => ({ f: r.from, t: r.to, b: null })))
    .sort((a, b) => a.f.localeCompare(b.f));
  const redovi = stavke.map(s => {
    const kad = `<span class="num plan-kad">${s.f === s.t ? fmtD(s.f) : fmtD(s.f) + ' - ' + fmtD(s.t)}</span>`;
    /* isti redoslijed kao u „Provjeri datume": datum lijevo, mjesto desno */
    if (!s.b) return `<div class="plan-row plan-crveno">${kad}${I.warn}<span>nema mjesta</span></div>`;
    const b = boxById(s.b);
    const kavez = boxSpare(b);
    return `<div class="plan-row">${kad}
      <span class="badge ${kavez ? 'b-warn' : 'b-' + ((b && b.group) || 'line')}">${esc(boxFullName(b))}${kavez ? ' (rezerva)' : ''}</span>
    </div>`;
  }).join('');
  const imaKaveza = plan.segs.some(s => boxSpare(boxById(s.b) || {}));
  return `<div class="plan">
    <div class="plan-head">${I.swap} Prijedlog rasporeda · <span class="num">${fmtD(from)} - ${fmtD(to)}</span></div>
    ${redovi || '<p class="hint" style="margin:0">Nema nijednog slobodnog mjesta u ovom terminu.</p>'}
    ${imaKaveza ? `<div class="plan-note">U kavezu je onih dana kad su svi pravi boksevi puni.</div>` : ''}
    ${plan.segs.length ? `<button class="btn btn-primary btn-block btn-sm" data-act="sf-plan-take" style="margin-top:10px">Prihvati raspored</button>` : ''}
  </div>`;
}

/* premještanje u drugi boks usred boravka */
let MV = null;
function sfMoveModal(){
  const from = SF.from, to = SF.type === 'dnevni' ? SF.from : SF.to;
  if (!from || !to || to < from){ toast('Prvo izaberi termin.'); return; }
  const segs = sfSegs();
  const minD = segs.length ? addDays(segs[segs.length - 1].f, 1) : from;
  if (minD > to){ toast('Boravak je prekratak za premještanje.'); return; }
  const t = todayISO();
  if (!MV || MV.date < minD || MV.date > to) MV = { date: (t > minD && t <= to) ? t : minD, box: '' };
  if (!MV.cur) MV.cur = MV.date.slice(0, 7);
  showModal(`<div class="modal-title">Premještanje</div>
    <div class="fld"><label class="lbl">Od kog dana</label>${mvCalHTML(minD, to)}</div>
    <div class="fld"><label class="lbl">U koji boks od ${fmtDY(MV.date)}</label>
      <select id="mvBox">${boxOptionsHTML(MV.date, to, MV.box)}</select></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" data-act="modal-close">Otkaži</button>
      <button class="btn btn-primary" data-act="sf-box-move-do">Premjesti</button>
    </div>`);
}
/* mali kalendar u prozoru premještanja - isti izgled kao birač termina, bez engleskih datuma */
function mvCalHTML(minD, maxD){
  const [cy, cm] = MV.cur.split('-').map(Number);
  const first = new Date(cy, cm - 1, 1);
  const start = new Date(first);
  start.setDate(1 - ((first.getDay() + 6) % 7));
  let days = '';
  for (let i = 0; i < 42; i++){
    const d = new Date(start); d.setDate(start.getDate() + i);
    const iso = isoFromDate(d);
    const inMonth = d.getMonth() === cm - 1;
    const off = iso < minD || iso > maxD;
    days += `<button type="button" class="dr-day ${inMonth ? '' : 'other'} ${iso === MV.date ? 'r-edge' : ''} ${off ? 'mv-off' : ''}"
      ${off ? 'disabled' : `data-act="mv-pick" data-id="${iso}"`}><span class="dr-num num">${d.getDate()}</span></button>`;
  }
  const dows = DOWS_S.map((x, i) => `<span class="dr-dow ${i === 6 ? 'ned' : ''}">${x}</span>`).join('');
  const prevOff = MV.cur <= minD.slice(0, 7), nextOff = MV.cur >= maxD.slice(0, 7);
  return `<div class="dr">
    <div class="dr-head">
      <button type="button" class="dr-nav ${prevOff ? 'mv-off' : ''}" ${prevOff ? 'disabled' : 'data-act="mv-nav" data-id="-1"'}>‹</button>
      <span class="dr-title">${monthLabel(MV.cur)}</span>
      <button type="button" class="dr-nav ${nextOff ? 'mv-off' : ''}" ${nextOff ? 'disabled' : 'data-act="mv-nav" data-id="1"'}>›</button>
    </div>
    <div class="dr-grid">${dows}${days}</div>
    <div class="dr-foot">Premještaj od: <strong>${fmtDY(MV.date)}</strong></div>
  </div>`;
}

function sfSaveClient(){
  sfSync();
  const name = (SF.newClient.name || '').trim();
  if (!name){ toast('Upiši ime klijenta.'); return; }
  const pending = [...SF.newPets];
  if (SF.petForm && SF.petForm.name.trim()) pending.push({ ...SF.petForm });
  if (!pending.length){ toast('Dodaj bar jednog ljubimca.'); return; }
  const c = { id: uid(), name, phone: (SF.newClient.phone || '').trim(), note: '', blacklist: !!SF.newClient.blacklist };
  D.clients.push(c); dbSave('clients', c);
  for (const np of pending){
    const p = { id: uid(), clientId: c.id, name: np.name.trim(), species: np.species,
      size: np.species === 'macka' ? null : np.size, sex: np.sex || null, breed: (np.breed || '').trim(), note: '', photo: null };
    D.pets.push(p); dbSave('pets', p);
    SF.petIds.add(p.id);
  }
  SF.clientId = c.id; SF.newClient = null; SF.newPets = []; SF.petForm = null;
  render(); renderStayForm();
  toast('Klijent sačuvan.');
}

function sfPersist(){
  if (!SF) return null;
  sfSync();
  const clientId = SF.clientId;
  if (!clientId){ toast('Izaberi klijenta.'); return null; }
  const petIds = [...SF.petIds];
  if (!petIds.length){ toast('Izaberi bar jednog ljubimca.'); return null; }
  const from = SF.from;
  const to = SF.type === 'dnevni' ? SF.from : SF.to;
  if (!from){ toast('Izaberi datum dolaska.'); return null; }
  if (!to){ toast('Izaberi datum odlaska u kalendaru.'); return null; }
  if (to < from){ toast('Odlazak ne može biti prije dolaska.'); return null; }
  const price = parseMoney(SF.price);
  const deposit = parseMoney(SF.deposit);
  const boxes = sfSegs();
  const boxId = boxes.length ? boxes[0].b : null;

  if (SF.id){
    const st = D.stays.find(s => s.id === SF.id);
    Object.assign(st, { petIds, type: SF.type, from, to, boxes, boxId, price, deposit, paid: SF.paid, note: SF.note.trim() });
    if (SF.paid && !st.paidAt) st.paidAt = todayISO();
    if (!SF.paid) st.paidAt = null;
    dbSave('stays', st);
    return st;
  }
  const st = {
    id: uid(), clientId, petIds, type: SF.type, from, to,
    boxes, boxId, price, deposit, paid: SF.paid, paidAt: SF.paid ? todayISO() : null,
    arrivedAt: from === todayISO() ? null : (from < todayISO() ? from : null), leftAt: null,
    note: SF.note.trim(), createdAt: new Date().toISOString(),
  };
  D.stays.push(st);
  dbSave('stays', st);
  return st;
}

/* da li je izabrani boks u tom periodu već nečiji (dva psa u istom boksu = greška u tabeli) */
function sfBoxConflicts(){
  const from = SF.from, to = SF.type === 'dnevni' ? SF.from : SF.to;
  if (!from || !to || to < from) return [];
  const out = [];
  const lim = sfLeftLimit();
  sfSegs().forEach(s => {
    const kraj = lim && s.t > lim ? lim : s.t;
    if (kraj < s.f) return;
    boxStays(s.b, s.f, kraj, SF.id).forEach(st => {
      const b = boxById(s.b);
      out.push({ boks: GROUPS_1[b ? b.group : ''] ? GROUPS_1[b.group] + ' ' + b.name : (b ? b.name : '?'),
        ko: stayLabel(st),
        od: s.f > st.from ? s.f : st.from, do: kraj < st.to ? kraj : st.to });
    });
  });
  return out;
}
function sfSave(force){
  if (!SF) return;
  sfSync();
  /* popunjeno i zauzet boks = pitanje, ne zabrana; za završene boravke se i ne pita */
  const zavrsen = SF.id && SF.to && SF.to < todayISO();
  if (!force && !zavrsen){
    const konf = sfBoxConflicts();
    if (konf.length){
      showModal(`<div class="modal-title">Boks je već zauzet</div>
        <div class="modal-text">${konf.slice(0, 4).map(k => `<b>${esc(k.boks)}</b> drži <b>${esc(k.ko)}</b> <span class="num">${k.od === k.do ? fmtD(k.od) : fmtD(k.od) + ' - ' + fmtD(k.do)}</span>`).join('<br>')}
        ${konf.length > 4 ? '<br>…' : ''}
        <br><span class="hint" style="display:block;margin-top:8px">Ako upišeš, dva ljubimca će biti u istom boksu.</span></div>
        <div class="modal-actions">
          <button class="btn btn-ghost" data-act="modal-close">Odustani</button>
          <button class="btn btn-primary" data-act="sf-save-force">Upiši svejedno</button>
        </div>`);
      return;
    }
    if (sfCapacityAsk('sf-save-force')) return;
  }
  const edit = !!SF.id;
  const st = sfPersist(); if (!st) return;
  closeModal(); closeSheet(); render();
  toast(edit ? 'Boravak sačuvan.' : 'Boravak dodat.');
  /* nov boravak = rezervacija: odmah ponudi potvrdu klijentu porukom */
  if (!edit) ponudiPotvrdu(st.id);
}

/* ============ POTVRDA REZERVACIJE PORUKOM ============
   Otvori Poruke (SMS) sa brojem klijenta i već iskucanim tekstom - ostaje samo „pošalji".
   Šalje se sa njihovog telefona i njihovog broja, ništa se ne plaća. */
function smsPotvrdaURI(st){
  const c = clientById(st.clientId);
  if (!c || !c.phone) return null;
  const broj = c.phone.replace(/[^\d+]/g, '');
  if (!broj) return null;
  const iznos = stayAmount(st);
  /* depozit umanjuje cijenu - Vesna često traži dio unaprijed, pa klijent u poruci
     vidi i depozit i koliko mu ostaje */
  const dep = Number(st.deposit) || 0;
  const kad = st.from === st.to
    ? '📅 Datum: ' + fmtDY(st.from)
    : '📅 Dolazak: ' + fmtDY(st.from) + '\n📅 Odlazak: ' + fmtDY(st.to);
  const text = 'Poštovanje,\n\n' +
    'Vaša rezervacija u Cindyland pansionu za pse i mačke je uspješno evidentirana. 🐾\n\n' +
    kad + '\n' +
    (iznos ? '💶 Ukupan iznos boravka: ' + money(iznos) + '\n' : '') +
    (iznos && dep ? '💰 Depozit: ' + money(dep) + '\n💶 Ostatak za uplatu: ' + money(Math.max(0, iznos - dep)) + '\n' : '') +
    '\n🍽️ Molimo da ponesete samo njegovu hranu za period boravka. Sve ostalo je obezbijeđeno u pansionu.\n\n' +
    '🕘 Prijem i preuzimanje ljubimaca obavljamo u terminima:\n• 08:00 - 20:00h\n\n' +
    'Hvala na ukazanom povjerenju. Radujemo se druženju sa vašim ljubimcem!';
  /* iPhone hoće &body=, ostali ?body= */
  const sep = /iPad|iPhone|iPod/.test(navigator.userAgent) ? '&' : '?';
  return 'sms:' + broj + sep + 'body=' + encodeURIComponent(text);
}
function ponudiPotvrdu(stayId){
  const st = D.stays.find(s => s.id === stayId); if (!st) return;
  const uri = smsPotvrdaURI(st); if (!uri) return;
  const c = clientById(st.clientId);
  showModal(`<div class="modal-title">Boravak je upisan</div>
    <div class="modal-text">Poslati potvrdu porukom? Otvoriće se Poruke sa gotovim tekstom za <b>${esc(c.name)}</b> (<span class="num">${esc(c.phone)}</span>).</div>
    <div class="modal-actions">
      <button class="btn btn-ghost" data-act="modal-close">Ne sad</button>
      <a class="btn btn-primary" data-act="modal-close" href="${esc(uri)}">${I.sms} Pošalji</a>
    </div>`);
}

/* veliko Naplati na dnu boravka: prvo tiho sačuva izmjene iz forme, pa naplata */
function sfCharge(){
  const st = sfPersist(); if (!st) return;
  render();
  chargeStart(st.id);
}
/* štrik Došao / Otišao */
function stayMark(id, field){
  const st = D.stays.find(s => s.id === id); if (!st) return;
  const t = todayISO();
  if (field === 'arrived'){
    st.arrivedAt = t;
    if (st.leftAt && st.leftAt < t) st.leftAt = null;
  } else {
    st.leftAt = t;
    if (!st.arrivedAt) st.arrivedAt = st.from;
  }
  dbSave('stays', st);
  render();
  if (SF && SF.id === id) renderStayForm();
  if (field === 'arrived'){ toast(stayLabel(st) + ' je u pansionu.'); return; }
  /* odlazak je pravi trenutak za naplatu - pitamo, ne naplaćujemo sami */
  if (!st.paid && chargeDue(st) > 0){ askCharge(st.id); return; }
  toast(stayLabel(st) + ' je otišao. Boks je slobodan od sjutra.');
}
function askCharge(stayId){
  const st = D.stays.find(s => s.id === stayId); if (!st) return;
  const prije = stayPaidSum(st);
  showModal(`<div class="modal-title">Je li naplaćeno?</div>
    <div class="modal-text"><b>${esc(stayLabel(st))}</b> je otišao. Boks je slobodan od sjutra.
      <br>${stayLenLabel(st)} · ${fmtD(st.from)} - ${fmtD(st.to)}
      ${prije ? `<br>Već uplaćeno: <b>${money(prije)}</b>` : ''}
      <br>Po cjenovniku: <b class="num">${money(chargeDue(st))}</b></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" data-act="charge-later" data-id="${st.id}">Nije naplaćeno</button>
      <button class="btn btn-ok" data-act="charge-force" data-id="${st.id}">${I.check} Naplaćeno</button>
    </div>`);
}
/* poslije "Nije naplaćeno" - jasno reci gdje ga čeka */
function chargeLaterInfo(stayId){
  const st = D.stays.find(s => s.id === stayId); if (!st) return;
  showModal(`<div class="modal-title">Ostaje za naplatu</div>
    <div class="modal-text"><b>${esc(stayLabel(st))}</b> je otišao. Boks je slobodan od sjutra.
      <br><br>Iznos <b class="num">${money(chargeDue(st))}</b> čeka u <b>Finansije → Nenaplaćeno</b>, sa dugmetom Naplati.</div>
    <div class="modal-actions"><button class="btn btn-primary" data-act="modal-close">U redu</button></div>`);
}
function stayUnmark(id, field){
  const st = D.stays.find(s => s.id === id); if (!st) return;
  if (field === 'arrived'){ st.arrivedAt = null; st.leftAt = null; } else st.leftAt = null;
  dbSave('stays', st);
  render(); if (SF && SF.id === id) renderStayForm();
}

function sfUnpay(){
  if (!SF) return;
  sfSync();
  const st = D.stays.find(s => s.id === SF.id); if (!st) return;
  st.paid = false; st.paidAt = null;
  SF.paid = false; SF.paidAt = null;
  dbSave('stays', st);
  render(); renderStayForm();
  toast('Naplata poništena.');
}

function stayDelete(id){
  D.stays = D.stays.filter(s => s.id !== id);
  dbKill('stays', id);
  closeModal(); closeSheet(); render();
  toast('Boravak obrisan.');
}

<script>
/* ============ PROVJERI DATUME ============
   Zovu i pitaju „ima li mjesta od-do?". Ovdje se ukuca termin i vrsta ljubimca,
   a app odmah kaže gdje sve može da ga smjesti - ili da nema mjesta.
   Račun je isti kao u formi boravka (autoBoxPlan), da se odgovori ne razilaze. */
let PD = null;
const PD_VRSTE = [
  { id: 'mali', lbl: 'Mali pas' },
  { id: 'veliki', lbl: 'Veliki pas' },
  { id: 'macka', lbl: 'Mačka' },
];
function datesCheckSheet(){
  /* svaki poziv je novo pitanje - datumi se brišu, vrsta ostaje kako je zadnji put bila */
  PD = { from: '', to: '', calCur: todayISO().slice(0, 7), type: 'pansion', vrsta: (PD && PD.vrsta) || 'mali' };
  renderDatesCheck();
}
/* strogo po vrsti: mali pas samo mali boksevi, veliki samo veliki, mačka samo mačji */
function pdGroups(){ return new Set([vrstaGrupa(PD.vrsta)]); }
function renderDatesCheck(){
  const spreman = !!(PD.from && PD.to && PD.to >= PD.from);
  const keep = $('#sheetBody') && sheetOpen ? $('#sheetBody').scrollTop : 0;
  openSheet('Provjeri datume', `
    <div class="fld"><label class="lbl">Kakav ljubimac</label>
      <div class="pd-vrste">${PD_VRSTE.map(v => `<button class="chip ${PD.vrsta === v.id ? 'on' : ''}" data-act="pd-vrsta" data-id="${v.id}">${v.lbl}</button>`).join('')}</div>
    </div>
    <div class="fld"><label class="lbl">Termin</label>${drCalHTML(PD, { nav: 'pd-nav', pick: 'pd-pick' })}</div>
    ${spreman ? pdResultHTML(PD.from, PD.to)
      : PD.from ? '' /* podnožje kalendara već traži dan odlaska - druga poruka bi mu protivrječila */
      : `<div class="card"><div class="empty">${I.cal}Izaberi datum dolaska pa datum odlaska.</div></div>`}
  `);
  if (keep) $('#sheetBody').scrollTop = keep;
}
function pdResultHTML(from, to){
  const plan = autoBoxPlan(from, to, null, pdGroups());
  const vrsta = (PD_VRSTE.find(v => v.id === PD.vrsta) || {}).lbl.toLowerCase();
  /* godina se piše samo kad termin prelazi iz godine u godinu - inače je samo šum */
  const dat = from.slice(0, 4) === to.slice(0, 4) ? fmtD : fmtDY;
  const podnaslov = from === to
    ? `${dat(from)} · ${vrsta} · dnevno čuvanje`
    : `${dat(from)} - ${dat(to)} · ${vrsta} · ${nightsLabel(diffDays(from, to))}`;
  /* plan === null nije isto što i „nema mjesta": ili je termin predug, ili za tu vrstu
     nema nijednog upisanog boksa - to se mora reći drugačije da ne obmane */
  if (!plan){
    const imaBokseva = sortedBoxes().some(b => b.active && pdGroups().has(b.group));
    return `<div class="card"><div class="empty">${I.warn}${imaBokseva
      ? 'Termin je predug za provjeru - probaj kraći period.'
      : 'U Podešavanjima nema nijednog boksa za ' + vrsta + '.'}</div></div>`;
  }
  if (!plan.segs.length){
    return `<div class="pd-res pd-no">
      <div class="pd-res-t">NEMA MJESTA</div>
      <div class="pd-res-s">${podnaslov}</div>
    </div>`;
  }
  /* hronološki: gdje može, i rupe kad nema baš ničeg slobodnog */
  const stavke = plan.segs.map(s => ({ f: s.f, t: s.t, b: s.b }))
    .concat(dayRanges(plan.full).map(r => ({ f: r.from, t: r.to, b: null })))
    .sort((a, b) => a.f.localeCompare(b.f));
  const rupa = plan.full.length > 0;
  const redovi = stavke.map(s => {
    const raspon = s.f === s.t ? dat(s.f) : dat(s.f) + ' - ' + dat(s.t);
    if (!s.b) return `<div class="pd-row"><span class="pd-kad num" style="color:var(--danger)">${raspon}</span><span class="badge b-danger">nema mjesta</span></div>`;
    const b = boxById(s.b);
    const kavez = boxSpare(b);
    return `<div class="pd-row"><span class="pd-kad num">${raspon}</span>
      <span class="badge ${kavez ? 'b-warn' : 'b-' + ((b && b.group) || 'line')}">${esc(boxFullName(b))}${kavez ? ' (rezerva)' : ''}</span></div>`;
  }).join('');
  const imaKaveza = plan.segs.some(s => boxSpare(boxById(s.b)));
  const selidbe = plan.segs.length - 1;
  /* naslov mora reći ono što im je jedino bitno: pravi boks, ili kavez, ili fali dana */
  const stanje = rupa ? { cls: 'pd-warn', t: plan.full.length === 1 ? 'NEMA SAMO ' + fmtD(plan.full[0]) : 'FALI ' + plan.full.length + ' ' + plural(plan.full.length, 'DAN', 'DANA', 'DANA') }
    : imaKaveza ? { cls: 'pd-warn', t: 'IMA, ALI U KAVEZU' }
    : { cls: 'pd-ok', t: 'IMA MJESTA' };
  /* boravci bez upisanog boksa se ne broje u zauzetost - moraju se pomenuti da odgovor ne bude lažan */
  const bezBoksa = D.stays.filter(st => overlap(st, from, to) && !stayBoxes(st).length).length;
  return `<div class="pd-res ${stanje.cls}">
      <div class="pd-res-t">${stanje.t}</div>
      <div class="pd-res-s">${podnaslov}</div>
    </div>
    <div class="lbl" style="margin:0 2px 6px">${selidbe > 0 ? 'Selio bi se ' + selidbe + ' ' + plural(selidbe, 'put', 'puta', 'puta') : 'Cijelo vrijeme na istom mjestu'}</div>
    <div class="card">${redovi}
      ${imaKaveza ? '<p class="hint" style="margin-top:10px">Kavez je rezervno mjesto - tu ide samo onih dana kad su svi boksevi puni.</p>' : ''}
    </div>
    <p class="hint" style="margin:-4px 2px 12px">Odgovor važi za jedno mjesto (jedan boks).${bezBoksa ? ` U ovom terminu ima ${bezBoksa} ${plural(bezBoksa, 'boravak', 'boravka', 'boravaka')} bez upisanog boksa - oni se ne broje u zauzetost.` : ''}</p>
    <button class="btn btn-primary btn-block" data-act="pd-upisi">${I.plus} Upiši boravak za ovaj termin</button>`;
}

function cePfSave(){
  cePopSync();
  const pf = CE.petForm;
  if (!pf.name.trim()){ toast('Upiši ime ljubimca.'); return; }
  const common = { name: pf.name.trim(), species: pf.species, size: pf.species === 'macka' ? null : pf.size,
    sex: pf.sex, breed: (pf.breed || '').trim(), note: (pf.note || '').trim() };
  if (pf.id){
    const p = petById(pf.id);
    if (!p){ toast('Ljubimac je u međuvremenu obrisan.'); CE.petForm = null; renderClientPop(); return; }
    Object.assign(p, common);
    dbSave('pets', p);
  } else {
    const p = Object.assign({ id: uid(), clientId: CE.clientId, photo: null }, common);
    p.sex = p.sex || null;
    D.pets.push(p); dbSave('pets', p);
    CE.added.push(p.id);
  }
  CE.petForm = null;
  renderClientPop();
  render();
}
/* upis podataka o vlasniku; vraća false ako ime fali.
   „blago" (zatvaranje krstićem ili klikom pored) ne gubi ostale izmjene - samo zadrži staro ime. */
function ceSaveClient(blago){
  cePopSync();
  const c = clientById(CE.clientId);
  if (!c) return true;   // klijent je u međuvremenu obrisan drugdje - nema šta da se upiše, ali kartica mora moći da se zatvori
  const name = CE.name.trim();
  if (!name && !blago){ toast('Ime je obavezno.'); return false; }
  if (name) c.name = name;
  c.phone = CE.phone.trim(); c.note = (CE.note || '').trim(); c.blacklist = !!CE.black;
  dbSave('clients', c);
  return true;
}
/* zadrziKorak = poslije ovoga se odmah otvara sheet, pa se korak u istoriji ne vraća (preuzme ga openSheet) */
function ceDone(blago, viaPop, zadrziKorak){
  if (!CE) return closeModal();
  if (!ceSaveClient(blago)) return;
  const added = CE.added, cid = CE.clientId, hist = CE.hist;
  CE = null;
  closeModal();
  if (hist && !viaPop && !zadrziKorak) popBack();
  if (SF && SF.clientId === cid){ added.forEach(id => SF.petIds.add(id)); renderStayForm(); }
  render();
}

/* ============ KLIJENT / LJUBIMAC forme ============ */
function clientDelete(cid){
  const n = D.stays.filter(st => st.clientId === cid).length;
  D.stays = D.stays.filter(st => st.clientId !== cid);
  D.pets = D.pets.filter(p => p.clientId !== cid);
  D.clients = D.clients.filter(c => c.id !== cid);
  dbKill('clients', cid); // na serveru kaskadno briše i ljubimce i boravke
  closeModal(); closeSheet(); render();
  toast('Klijent obrisan' + (n ? ` (i ${n} borav${n === 1 ? 'ak' : 'aka'})` : '') + '.');
}

function petDelete(petId){
  const p = petById(petId); if (!p) return;
  D.pets = D.pets.filter(x => x.id !== petId);
  const touched = D.stays.filter(st => (st.petIds || []).includes(petId));
  touched.forEach(st => { st.petIds = st.petIds.filter(id => id !== petId); });
  dbKill('pets', petId);
  touched.forEach(st => dbSave('stays', st));
  if (SF) SF.petIds.delete(petId);

<script>
/* ============ SLIKA LJUBIMCA ============ */
async function uploadPetPhoto(petId, file){
  const p = petById(petId); if (!p || !sb) return;
  toast('Slika se šalje…');
  try {
    let bmp;
    try { bmp = await createImageBitmap(file); }
    catch (e){
      bmp = await new Promise((res, rej) => {
        const im = new Image();
        im.onload = () => res(im); im.onerror = rej;
        im.src = URL.createObjectURL(file);
      });
    }
    const w = bmp.width || bmp.naturalWidth, h = bmp.height || bmp.naturalHeight;
    const scale = Math.min(1, 700 / Math.max(w, h));
    const cv = document.createElement('canvas');
    cv.width = Math.round(w * scale); cv.height = Math.round(h * scale);
    cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
    const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.84));
    if (!blob) throw new Error('konverzija');
    const path = 'pets/' + petId + '.jpg';
    const { error } = await sb.storage.from('slike').upload(path, blob, { upsert: true, contentType: 'image/jpeg' });
    if (error) throw error;
    p.photo = CFG.url + '/storage/v1/object/public/slike/' + path + '?v=' + Date.now();
    await dbSave('pets', p);
    if (PE){ pePopSync(); renderPetPop(); }     // isto i za karticu ljubimca
    if (CE){ cePopSync(); renderClientPop(); }   // bez sync-a bi se izgubilo ono što je u međuvremenu ukucano
    render();
    toast('Slika sačuvana.');
  } catch (e){
    toast('Slika nije poslata - pokušaj drugu ili provjeri internet.');
  }
}

async function fetchAll(table){

  for (let from = 0;; from += CH){
    const { data, error } = await sb.from(table).select('*').range(from, from + CH - 1);
    if (error) throw error;
    out.push(...data);
    if (data.length < CH) break;
  }
  return out;
}

<script>
/* ============ PWA / AŽURIRANJE (kao K-Sport Hub + version.json za brzu provjeru) ============ */
const PWA = { reg: null, needRefresh: false, lastCheck: 0, hadController: false, newVer: null };

/* version.json se NIKAD ne kešira - odgovor stiže za desetinku sekunde i odmah
   znamo da li na serveru stoji novija verzija (ne čeka se instalacija workera). */
async function serverVersion(){
  try {
    const r = await fetch('./version.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return null;
    const j = await r.json();
    return j && j.version ? j.version : null;
  } catch (e){ return null; }
}
function flagNeedRefresh(ver){
  if (ver) PWA.newVer = ver;
  if (PWA.needRefresh){ const b0 = $('#updBox'); if (b0) b0.classList.add('show'); return; }
  PWA.needRefresh = true;
  if (APP_SHOWN) renderTabbar();
  const row = $('#updCheckBtn'); if (row) row.classList.remove('checking');
  const box = $('#updBox'); if (box) box.classList.add('show');
  if (APP_SHOWN && (TAB === 'jos' || TAB === 'danas')) render();   // obavještenje na Danas + broj verzije u Profilu
}
function trackInstalling(sw){
  if (!sw) return;
  // "hadController" = stranicu je pri učitavanju već kontrolisala starija verzija,
  // pa je svaki novi worker UPDATE (a ne prva instalacija - tada nema obavještenja).
  const ready = () => (sw.state === 'installed' || sw.state === 'activated') && PWA.hadController;
  if (ready()){ flagNeedRefresh(); return; }
  sw.addEventListener('statechange', () => { if (ready()) flagNeedRefresh(); });
}
async function initPWA(){
  if (!('serviceWorker' in navigator)) return;
  try {
    PWA.hadController = !!navigator.serviceWorker.controller;
    const reg = await navigator.serviceWorker.register('./sw.js');
    PWA.reg = reg;
    if (reg.waiting && PWA.hadController) flagNeedRefresh();
    if (reg.installing) trackInstalling(reg.installing);
    reg.addEventListener('updatefound', () => trackInstalling(reg.installing));
  } catch (e){}
  /* odmah po ulasku tiho provjeri verziju na serveru (par stotina bajta) */
  if (PWA.hadController){
    const v = await serverVersion();
    if (v && v !== APP_VERSION) flagNeedRefresh(v);
  }
}
/* „Osvježi i ažuriraj": ako nova verzija čeka - preuzmi je odmah; ako ne (npr. worker
   se još instalira), obriši keš i učitaj iznova da korisnik ne čeka instalaciju. */
async function applyUpdate(){
  const reg = PWA.reg;
  let reloaded = false;
  const doReload = () => { if (reloaded) return; reloaded = true; window.location.reload(); };
  if (reg && reg.waiting){
    navigator.serviceWorker.addEventListener('controllerchange', doReload);
    reg.waiting.postMessage({ type: 'SKIP_WAITING' });
    setTimeout(doReload, 2500);
    return;
  }
  try {
    const keys = await caches.keys();
    await Promise.all(keys.map(k => caches.delete(k)));
  } catch (e){}
  doReload();
}
async function autoCheckUpdate(){
  const now = Date.now();
  if (now - PWA.lastCheck < 60000) return;
  PWA.lastCheck = now;
  const v = await serverVersion();
  if (v && v !== APP_VERSION) flagNeedRefresh(v);
  try { PWA.reg && PWA.reg.update(); } catch (e){}
}
/* Ručna provjera: odgovor sa version.json (brzo), pa tek onda service worker. */
async function checkForUpdate(){
  const okBox = $('#verOk');
  const row = $('#updCheckBtn');
  if (okBox) okBox.classList.remove('show');
  if (PWA.needRefresh || (PWA.reg && PWA.reg.waiting)){ flagNeedRefresh(); return; }
  if (row) row.classList.add('checking');

  const v = await serverVersion();
  if (v && v !== APP_VERSION){
    if (row) row.classList.remove('checking');
    flagNeedRefresh(v);
    try { PWA.reg && PWA.reg.update(); } catch (e){}   // u pozadini povuci novu verziju
    return;
  }
  if (v === APP_VERSION){
    if (row) row.classList.remove('checking');
    if (okBox) okBox.classList.add('show');
    return;
  }
  /* version.json nedostupan (stara objava ili nema mreže) - stari način preko workera */
  if (!PWA.reg){ if (row) row.classList.remove('checking'); if (okBox) okBox.classList.add('show'); return; }
  const reg = PWA.reg;
  const result = await new Promise((resolve) => {
    let done = false;
    const finish = (res) => { if (done) return; done = true; reg.removeEventListener('updatefound', onFound); clearTimeout(to); resolve(res); };
    const track = (sw) => {
      if (!sw) return;
      const ready = () => (sw.state === 'installed' || sw.state === 'activated') && PWA.hadController;
      if (ready()){ finish('update'); return; }
      sw.addEventListener('statechange', () => { if (ready()) finish('update'); });
    };
    const onFound = () => track(reg.installing);
    reg.addEventListener('updatefound', onFound);
    if (reg.installing) track(reg.installing);
    const to = setTimeout(() => finish(reg.waiting ? 'update' : 'current'), 6000);
    Promise.resolve(reg.update()).then(() => {
      if (reg.waiting) finish('update');
    }).catch(() => finish('current'));
  });
  const r2 = $('#updCheckBtn'); if (r2) r2.classList.remove('checking');
  if (result === 'update') flagNeedRefresh();
  else { const ok = $('#verOk'); if (ok) ok.classList.add('show'); }
}
</script>

['pointerup', 'pointercancel'].forEach(ev => document.addEventListener(ev, () => {

    case 'kl-merge-cancel': KL_MERGE = null; render(); break;
    case 'kl-merge-do': {
        if (!KL_MERGE || !KL_MERGE.sel.size) break;
        const base = clientById(KL_MERGE.baseId);
        confirmModal('Objediniti klijente?', `<b>${KL_MERGE.sel.size}</b> ${plural(KL_MERGE.sel.size, 'klijent prelazi', 'klijenta prelaze', 'klijenata prelazi')} pod <b>${esc(base.name)}</b> - sa svim ljubimcima, boravcima i naplatama. Ovo se ne može poništiti.`, 'kl-merge-yes', '', 'Objedini');
      } break;
    case 'kl-merge-yes': klMergeDo(); break;
    /* boravci */
    case 'stay-new': openStayForm({ date: t.dataset.date || null, clientId: t.dataset.client || null }); break;
    case 'grid-new': openStayForm({ date: t.dataset.date, boxId: t.dataset.box }); break;
    case 'stay-edit': openStayForm({ stayId: id }); break;
    case 'stay-del': confirmModal('Obrisati boravak?', 'Ovo se ne može poništiti.', 'stay-del-yes', id, 'Obriši', true); break;
    case 'stay-del-yes': stayDelete(id); break;
    case 'charge': chargeStart(id); break;
    case 'charge-force': closeModal(); chargeModal(id, true); break;
    case 'charge-stay': closeModal(); chargeModal(id, false); break;
    case 'charge-later': closeModal(); chargeLaterInfo(id); break;
    case 'charge-confirm': chargeConfirm(id, t.dataset.leave === '1'); break;
    /* štrik dolaska i odlaska */
    case 'stay-arrived': stayMark(id, 'arrived'); break;
    case 'stay-left': stayMark(id, 'left'); break;
    case 'sf-undo-arrived': stayUnmark(SF.id, 'arrived'); break;
    case 'sf-undo-left': stayUnmark(SF.id, 'left'); break;
    /* forma boravka */
    case 'sf-client-pick': sfSync(); SF.clientId = id; SF.newClient = null; SF.petIds = new Set(); {
        const pets = petsOfClient(id);
        if (pets.length === 1) SF.petIds.add(pets[0].id);
      } renderStayForm(); break;
    case 'sf-client-new': sfSync(); SF.newClient = { name: SF.clientQ.trim(), phone: '', blacklist: false }; SF.petForm = null; renderStayForm(); break;
    case 'sf-client-clear': sfSync(); SF.clientId = null; SF.newClient = null; SF.petIds = new Set(); SF.newPets = []; SF.petForm = null; renderStayForm(); break;
    case 'sf-save-client': sfSaveClient(); break;
    case 'nc-black': sfSync(); SF.newClient.blacklist = !SF.newClient.blacklist; renderStayForm(); break;
    /* kartica klijenta */
    case 'ce-black': t.classList.toggle('on'); CE.black = t.classList.contains('on'); break;
    case 'ce-pet-new': cePopSync(); CE.petForm = { name: '', species: 'pas', size: 'mali', sex: null, breed: '', note: '' }; renderClientPop(); break;
    case 'ce-pet-edit': cePopSync(); { const p = petById(id);
        if (!p){ toast('Ljubimac je u međuvremenu obrisan.'); renderClientPop(); break; }
        CE.petForm = { id: p.id, name: p.name, species: p.species, size: p.size || 'mali', sex: p.sex, breed: p.breed || '', note: p.note || '' };
      } renderClientPop(); break;
    case 'ce-pf-species': cePopSync(); CE.petForm.species = id; renderClientPop(); break;
    case 'ce-pf-size': cePopSync(); CE.petForm.size = id; renderClientPop(); break;
    case 'ce-pf-sex': cePopSync(); CE.petForm.sex = CE.petForm.sex === id ? null : id; renderClientPop(); break;
    case 'ce-pf-cancel': cePopSync(); CE.petForm = null; renderClientPop(); break;
    case 'ce-pf-save': cePfSave(); break;
    case 'ce-done': ceDone(); break;
    /* kartica ljubimca: iz boravka, iz tabele Boksevi (kroz boravak) i iz kartice klijenta */
    case 'pet-open': { const pid = id;
        if (SF) sfSync();                       // bez ovoga se gubi ukucana cijena/depozit/napomena
        if (CE){ ceDone(false, false, true); if (CE) break; openPetPop(pid, true); }
        else openPetPop(pid);
      } break;
    case 'pe-done': peDone(); break;
    case 'pe-stay-toggle': if (SF){ pePopSync(); SF.petIds.has(id) ? SF.petIds.delete(id) : SF.petIds.add(id); renderPetPop(); } break;
    case 'pe-client': { const cid = id; peDone(false, true); if (!PE) openClientPop(cid, false, true); } break;
    case 'pe-edit': { const pid = id, p = petById(pid);
        if (!p) break;
        peDone(false, true);
        openClientPop(p.clientId, false, true);
        CE.petForm = { id: p.id, name: p.name, species: p.species, size: p.size || 'mali',
          sex: p.sex, breed: p.breed || '', note: p.note || '' };
        renderClientPop();
      } break;
    case 'ce-new-stay': { const cid = CE.clientId; ceDone(false, false, true); if (!CE) openStayForm({ clientId: cid }); } break;
    case 'ce-stay-open': { const sid = id; ceDone(false, false, true); if (!CE) openStayForm({ stayId: sid }); } break;
    case 'sf-pet-toggle': sfSync(); SF.petIds.has(id) ? SF.petIds.delete(id) : SF.petIds.add(id); renderStayForm(); break;
    case 'sf-newpet-del': sfSync(); SF.newPets.splice(Number(id), 1); renderStayForm(); break;
    case 'sf-pet-form': sfSync(); SF.petForm = { name: '', species: 'pas', size: 'mali', sex: null, breed: '' }; renderStayForm(); break;
    case 'sf-pf-species': sfSync(); SF.petForm.species = id; renderStayForm(); break;
    case 'sf-pf-size': sfSync(); SF.petForm.size = id; renderStayForm(); break;
    case 'sf-pf-sex': sfSync(); SF.petForm.sex = SF.petForm.sex === id ? null : id; renderStayForm(); break;
    case 'sf-pf-cancel': sfSync(); SF.petForm = null; renderStayForm(); break;
    case 'sf-pf-add': sfSync(); {
        if (!SF.petForm.name.trim()){ toast('Upiši ime ljubimca.'); break; }
        SF.newPets.push({ ...SF.petForm }); SF.petForm = null; renderStayForm();
      } break;
    case 'sf-type': sfSync(); SF.type = id; if (id === 'dnevni' && SF.from) SF.to = SF.from; renderStayForm(); break;
    case 'dr-nav': sfSync(); SF.calCur = ymShift(SF.calCur, Number(id)); renderStayForm(); break;
    case 'dr-pick': sfSync(); drPick(id); renderStayForm(); break;
    /* mjesto (boks) */
    /* uklanjanje mjesta pita, jer susjedni period preuzme te dane (tako se nehotice zauzme tuđi boks) */
    case 'sf-box-del': {
        sfSync();
        const segs = sfSegs(), i = Number(id), s = segs[i];
        if (!s) break;
        const b = boxById(s.b) || {};
        const ostali = segs.filter((_, j) => j !== i);
        /* stvarni ishod: ko poslije uklanjanja pokriva te dane (ili ostaju bez boksa) */
        const to0 = SF.type === 'dnevni' ? SF.from : SF.to;
        const poslije = stayBoxes({ boxes: ostali, from: SF.from, to: to0, boxId: null });
        const pokriva = poslije.find(x => x.f <= s.f && s.f <= x.t);
        const nb = pokriva ? boxById(pokriva.b) : null;
        confirmModal('Ukloniti mjesto?',
          `<b>${esc(b.name || '?')}</b> · <span class="num">${s.f === s.t ? fmtD(s.f) : fmtD(s.f) + ' - ' + fmtD(s.t)}</span><br>` +
          (nb ? `Te dane preuzima <b>${esc(nb.name)}</b>${poslije.length === 1 ? ' (cijeli boravak)' : ''}.`
              : (poslije.length ? 'Ti dani ostaju bez boksa.' : 'Boravak ostaje bez boksa.')),
          'sf-box-del-yes', String(i), 'Ukloni', true);
      } break;
    case 'sf-box-del-yes': { const segs = sfSegs(); segs.splice(Number(id), 1); SF.boxes = segs; closeModal(); renderStayForm(); } break;
    case 'sf-plan-take': {
        sfSync();
        const to2 = SF.type === 'dnevni' ? SF.from : SF.to;
        const plan = autoBoxPlan(SF.from, to2, SF.id);
        if (!plan || !plan.segs.length){ toast('Nema slobodnih mjesta u ovom terminu.'); break; }
        SF.boxes = plan.segs;
        renderStayForm();
        toast(plan.segs.length === 1 ? 'Upisan boks.' : 'Raspoređeno u ' + plan.segs.length + ' boksa.');
      } break;
    case 'sf-plan-show': sfSync(); {
        const p = autoBoxPlan(SF.from, SF.type === 'dnevni' ? SF.from : SF.to, SF.id);
        if (!p){ toast('Za ovaj termin i vrstu nema šta da se kombinuje.'); break; }
      } SF.plan = true; renderStayForm(); break;
    case 'sf-box-move': sfSync(); MV = null; sfMoveModal(); break;
    case 'mv-pick': MV.date = id; MV.box = $('#mvBox') ? $('#mvBox').value : ''; sfMoveModal(); break;
    case 'mv-nav': MV.cur = ymShift(MV.cur, Number(id)); MV.box = $('#mvBox') ? $('#mvBox').value : ''; sfMoveModal(); break;
    case 'sf-box-move-do': {
        const d = MV ? MV.date : '', b = $('#mvBox').value;
        if (!b){ toast('Izaberi boks.'); break; }
        const to = SF.type === 'dnevni' ? SF.from : SF.to;
        if (!d || d < SF.from || d > to){ toast('Datum mora biti unutar boravka.'); break; }
        SF.boxes = sfSegs().concat([{ b, f: d, t: to }]);
        closeModal(); renderStayForm();
      } break;
    case 'sf-save': sfSave(); break;
    case 'sf-save-force': sfSave(true); break;
    case 'sf-charge': sfCharge(); break;
    case 'sf-unpay': sfUnpay(); break;
    /* klijenti */
    case 'client-open': if (SF) sfSync(); openClientPop(id, t.dataset.newpet === '1'); break;
    case 'kl-clear': {
        KL_Q = '';
        const inp = $('#klSearch'); if (inp) inp.value = '';
        const l = $('#klList'); if (l) l.innerHTML = klListHTML();
        const x = document.querySelector('.srch-x'); if (x) x.classList.remove('on');
        const r = $('#klRail'); if (r) r.innerHTML = azRailHTML();
        if (inp) inp.focus();
      } break;
    case 'kl-jump': klJump(id); break;
    /* brisanje iz kartice: potvrda pa nazad u karticu ako se odustane */
    case 'ce-del': cePopSync(); confirmModal('Obrisati klijenta?', 'Obrisaće se i svi njegovi ljubimci i boravci. Ovo se ne može poništiti.', 'client-del-yes', CE.clientId, 'Obriši', true, 'ce-back'); break;
    case 'client-del-yes': { const korak = !!(CE && CE.hist); CE = null; clientDelete(id); if (korak) popBack(); } break;
    case 'ce-pet-del': cePopSync(); confirmModal('Obrisati ljubimca?', 'Boravci ostaju sačuvani.', 'pet-del-yes', id, 'Obriši', true, 'ce-back'); break;
    case 'pet-del-yes': petDelete(id); break;
    case 'ce-back': renderClientPop(); break;
    /* podešavanja */
    case 'prices-open': pricesSheet(); break;
    case 'prices-save': {
        const g = x => parseMoney($(x).value);
        const cat = k => ({ dan: g('#pr_' + k + '_dan'), par: g('#pr_' + k + '_par'), dan10: g('#pr_' + k + '_dan10'), par10: g('#pr_' + k + '_par10'), mj: g('#pr_' + k + '_mj'), parMj: g('#pr_' + k + '_parMj') });
        const np = { dnevni: g('#pr_dnevni'), mali: cat('mali'), veliki: cat('veliki'), macka: cat('macka') };
        const sve = [np.dnevni].concat(['mali', 'veliki', 'macka'].flatMap(k => Object.values(np[k])));
        if (sve.some(v => v == null)){ toast('Provjeri iznose.'); break; }
        D.prices = np; dbSavePrices(); closeSheet(); render(); toast('Cjenovnik sačuvan.');
      } break;
    case 'boxes-open': boxesSheet(); break;
    case 'bl-open': blSheet(); break;
    case 'box-toggle': { const b = boxById(id); b.active = !b.active; dbSave('boxes', b); boxesSheet(); } break;
    case 'box-add': {
        const name = $('#newBoxName').value.trim();
        if (!name){ toast('Upiši naziv.'); break; }
        const maxSort = Math.max(0, ...D.boxes.map(b => b.sort || 0));
        const b = { id: uid(), name, group: $('#newBoxGroup').value, active: true, sort: maxSort + 1 };
        D.boxes.push(b); dbSave('boxes', b); boxesSheet(); toast('Dodato.');
      } break;
    case 'install-help': installHelpSheet(); break;
    case 'pet-photo-pick': { const f = $('#petPhotoFile'); if (f) f.click(); } break;
    /* update */
    case 'upd-apply': applyUpdate(); break;
    case 'upd-check': checkForUpdate(); break;
    /* okvir */
    case 'sheet-close': closeSheet(); break;
    case 'modal-close':
      if (t.classList.contains('modal-overlay') && e.target.closest('.modal')) break;
      /* ako je preko kartice iskočila potvrda (brisanje), klik pored vraća u karticu - ne zatvara sve */
      if (CE && !$('#modalHost').querySelector('.modal-card')){ closeModal(); renderClientPop(); break; }
      if (PE){ peDone(); break; }     // zatvaranje kartice ljubimca upisuje navike
      if (CE){ ceDone(true); break; } // zatvaranje kartice klijenta i upisuje izmjene
      closeModal(); break;
  }
});

document.addEventListener('input', (e) => {
  if (e.target.id === 'klSearch'){
    KL_Q = e.target.value;
    const l = $('#klList'); if (l) l.innerHTML = klListHTML();
    const x = document.querySelector('.srch-x'); if (x) x.classList.toggle('on', !!KL_Q);
    const r = $('#klRail'); if (r) r.innerHTML = azRailHTML();
  }
  if (e.target.id === 'sfClientQ' && SF){
    SF.clientQ = e.target.value;
    const l = $('#sfClientList'); if (l) l.innerHTML = sfClientListHTML();
  }
});
document.addEventListener('change', (e) => {
  if (e.target.id === 'sfBox' && SF){
    sfSync();
    const to = SF.type === 'dnevni' ? SF.from : SF.to;
    SF.boxes = e.target.value ? [{ b: e.target.value, f: SF.from, t: to || SF.from }] : [];
    renderStayForm();
  }
  if (e.target.id === 'mvBox' && MV) MV.box = e.target.value;
  if (e.target.id === 'petPhotoFile' && e.target.files[0]){ uploadPetPhoto(e.target.dataset.pet, e.target.files[0]); e.target.value = ''; }
});
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'loginPass' || (e.target.id === 'loginEmail' && LOGIN_MODE === 'login')) doLogin();
  else if (e.target.id === 'loginEmail' && LOGIN_MODE === 'forgot') sendReset();
  else if (e.target.id === 'npPass2') saveNewPass();
});

/* kad prođe ponoć (ili se app otvori u novom danu) - „Danas" se sam prebaci na novi dan */
let LAST_DAY = todayISO();
function dayTick(){
  if (todayISO() === LAST_DAY) return;
  LAST_DAY = todayISO();
  if (APP_SHOWN) render();
}
setInterval(dayTick, 60 * 1000);

document.addEventListener('visibilitychange', () => { if (!document.hidden){ dayTick(); autoCheckUpdate(); if (sb && APP_SHOWN) scheduleReload(); } });
window.addEventListener('focus', autoCheckUpdate);
setInterval(autoCheckUpdate, 30 * 60 * 1000);

/* pokretanje */
(async function boot(){
  initPWA();
  if (!sb){
    await maybeSeedDemo();
    showApp(); render();
    return;
  }
  const { data: { session } } = await sb.auth.getSession();
  if (session){
    sb._cindyEmail = session.user.email;
    sb._cindyName = (session.user.user_metadata || {}).full_name || '';
    showApp(); render(); loadAll(); initRealtime();
  } else {
    showLogin();
  }
  sb.auth.onAuthStateChange((ev, sess) => {
    if (ev === 'PASSWORD_RECOVERY'){
      APP_SHOWN = false;
      LOGIN_MODE = 'recovery';
      showLogin();
      return;
    }
    if (ev === 'SIGNED_IN' && !APP_SHOWN && sess && LOGIN_MODE !== 'recovery'){
      sb._cindyEmail = sess.user.email;
      sb._cindyName = (sess.user.user_metadata || {}).full_name || '';
      showApp(); render(); loadAll(); initRealtime();
    }
  });
})();
</script>
</body>
