  </div>`;

  /* napomene: ljubimci (navike) + ovaj boravak */
  const napHTML = napomeneHTML([...SF.petIds].map(petById), st0.note);

  /* novac - po SAČUVANOM boravku; dugmad po stanju */
  const pays = stayPayments(st0);
  const ostale = pays.filter(p => !p.av);
  let dugmad = '';
  if (st0.paid) dugmad = `<div class="sf-nv-red"><span style="color:var(--ok)">${I.check} Naplaćeno${st0.paidAt ? ' · ' + fmtD(st0.paidAt) : ''}</span>
      <button class="sf-undo" data-act="sf-unpay">poništi</button></div>`;
  else if (otisao && n.naplaceno) dugmad = `<div class="sf-nv-red"><span style="color:var(--ok)">${I.check} Sve je plaćeno</span></div>`;
  else if (dolaziDanas) dugmad = `<div class="sf-novac-btns"><button class="btn btn-ok" data-act="stay-arrived" data-id="${st0.id}">${I.in} Došao</button></div>`;
  else if (tu || otisao) dugmad = `<div class="sf-novac-btns">
      ${tu ? `<button class="btn btn-ghost" data-act="sf-left">${I.out} Otišao</button>` : ''}
      ${n.ostalo > 0 ? `<button class="btn btn-ok" data-act="sf-charge">Naplati ${money(n.ostalo)}</button>` : ''}
    </div>`;
  const novacHTML = `<div class="card sf-novac">
    <div class="sf-nv">
      <div><span>ukupno</span><b class="num">${money(n.ukupno)}</b>${st0.price == null && n.ukupno ? '<small>po cjenovniku</small>' : ''}</div>
      <div><span>avans</span><b class="num">${money(n.avans)}</b>${n.avans && stayAvansDatum(st0) ? `<small class="num">${fmtD(stayAvansDatum(st0))}</small>` : ''}</div>
      <div><span>${n.ostalo > 0 ? 'za naplatu' : 'plaćeno'}</span><b class="num" style="color:var(${n.ostalo > 0 ? '--warn' : '--ok'})">${n.ostalo > 0 ? money(n.ostalo) : I.check}</b></div>
    </div>
    ${ostale.length ? `<div class="pay-list">
      ${pays.map(p => `<div class="pay-row"><span class="num">${fmtDY(p.d)}${p.av ? ' · avans' : ''}</span><b class="num">${money(p.a)}</b></div>`).join('')}
    </div>` : ''}
    ${dugmad}
  </div>`;

  /* redovi za izmjenu (vrijednost iz forme, pa se vidi i nesačuvano) */
  const dirano = new Set(sfIzmjene(SF).map(k => ({ t: 'termin', f: 'termin', to: 'termin', b: 'boks', pr: 'novac', av: 'novac', n: 'napomena' })[k]));
  const red = (id, naziv, vrijednost, tijelo, uvijek) => `<button class="sf-red ${otv[id] ? 'otv' : ''}" data-act="sf-otv" data-id="${id}">
      <span class="sf-red-l">${naziv}</span><span class="sf-red-v${dirano.has(id) ? ' dirano' : ''}">${dirano.has(id) || uvijek ? vrijednost : ''}</span><span class="chev">${I.chev}</span></button>
    ${otv[id] ? `<div class="sf-red-t">${tijelo}</div>` : ''}`;
  const dTo = SF.type === 'dnevni' ? SF.from : SF.to;
  const vTermin = SF.from && dTo ? (SF.from === dTo ? fmtD(SF.from) : fmtD(SF.from) + ' – ' + fmtD(dTo)) + (SF.type === 'dnevni' ? ' · dnevno' : '') : 'izaberi';
  const vBoks = segs.length ? segs.map(s => { const b = boxById(s.b); return b ? GROUPS_1[b.group] + ' ' + boxShort(b) : '?'; }).join(', ') : '<span style="color:var(--warn)">bez boksa</span>';
  const pDraft = parseMoney(SF.price), avDraft = parseMoney(SF.avans) || 0;
  const vNovac = money(pDraft != null ? pDraft : (est || 0)) + (avDraft ? ' · avans ' + money(avDraft) : '');
  const vNap = SF.note.trim() ? esc(SF.note.trim().split('\n')[0]) : 'nema';
  const detaljiHTML = `<div class="sec-title">Izmjena</div>
    <div class="card sf-det">
      ${red('termin', 'Termin', vTermin, datesHTML)}
      ${red('boks', 'Boks', vBoks, boxHTML, !segs.length)}
      ${red('novac', 'Cijena i avans', vNovac, priceHTML)}
      ${red('napomena', 'Napomena', SF.note.trim() ? vNap : 'dodaj', noteHTML, !SF.note.trim())}
    </div>
    <button class="sf-obrisi" data-act="stay-del" data-id="${SF.id}">${I.trash} Obriši boravak</button>`;

  openSheet(stayLabel(st0), stanjeHTML + napHTML + novacHTML + detaljiHTML, null, { k: 'boravak' });
  sheetFoot(`<button class="btn btn-ghost" data-act="sf-odbaci">Odbaci</button>
    <button class="btn btn-primary" data-act="sf-save">Sačuvaj izmjene</button>`, sfDirty());
  if (keep) $('#sheetBody').scrollTop = keep;   // re-render ne vraća formu na vrh

/* segmenti boksa u formi, poravnati na izabrani termin */
function sfSegs(){
  const from = SF.from, to = SF.type === 'dnevni' ? SF.from : SF.to;
  if (!from || !to || to < from) return (SF.boxes || []).filter(s => s && s.b);
  return stayBoxes({ boxes: SF.boxes, from, to, boxId: null });
}
/* dokle boravak koji se uređuje STVARNO drži boks: poslije štrika „Otišao" ga više ne drži,
   pa se ni sudar ne smije tražiti po punom terminu (inače lažno vikne „Boks je već zauzet"
   na boravak koji je odavno otišao a boks legalno dobio neko drugi) */
function sfLeftLimit(){
  const st0 = SF && SF.id ? D.stays.find(s => s.id === SF.id) : null;
  return st0 && st0.leftAt ? st0.leftAt : null;
}
/* padajući meni bokseva: koliko je koji slobodan u izabranom terminu */
function boxOptionsHTML(from, to, selected){
  const groups = sfRelevantGroups();
  const valid = from && to && to >= from;
  const use = valid ? boxUsage(from, to, SF ? SF.id : null) : {};
  let out = '<option value="">- izaberi boks -</option>';
  for (const g of ['mb', 'vb', 'm']){
    if (!groups.has(g)) continue;
    const items = sortedBoxes().filter(b => b.group === g && (b.active || b.id === selected));
    if (!items.length) continue;
    out += `<optgroup label="${GROUPS[g]}">`;
    out += items.map(b => {
      /* piše tačno OD KAD DO KAD je slobodan - ne više samo „djelimično slobodan" */
      let suffix = '';
      if (valid && use[b.id]){
        const lbl = freeRangesLabel(boxFreeRanges(b.id, from, to, use), from, to);
        if (lbl) suffix = ' - ' + lbl;
      }
      return `<option value="${b.id}" ${selected === b.id ? 'selected' : ''}>${esc(b.name + suffix)}</option>`;
    }).join('');
    out += '</optgroup>';
  }
  return out;
}
/* SAM RASPOREDI: složi mjesta za cijeli termin sa najmanje selidbi.
   PRVO pravi boksevi, kavez/transporter tek kad pravih nema - to je jedino što im je bitno. */
function autoBoxPlan(from, to, exceptId, grupe){
  if (!from || !to || to < from || diffDays(from, to) > 400) return null;
  const groups = grupe || sfRelevantGroups();
  const boxes = sortedBoxes().filter(b => b.active && groups.has(b.group));
  if (!boxes.length) return null;
  const use = boxUsage(from, to, exceptId);
  const dani = [];
  for (let iso = from; iso <= to; iso = addDays(iso, 1)) dani.push(iso);
  /* za svako mjesto: koliko dana zaredom je slobodno počev od svakog dana */
  const runs = {};
  for (const b of boxes){
    const arr = new Array(dani.length).fill(0);
    const busy = use[b.id] ? use[b.id].days : null;
    for (let i = dani.length - 1; i >= 0; i--){
      arr[i] = (busy && busy.has(dani[i])) ? 0 : 1 + (i + 1 < dani.length ? arr[i + 1] : 0);
    }
    runs[b.id] = arr;
  }
  const pravi = boxes.filter(b => !boxSpare(b)), kavezi = boxes.filter(boxSpare);
  /* koliko dana zaredom (počev od svakog dana) NIJEDAN pravi boks nije slobodan -
     toliko i najviše toliko ostaje u kavezu, pa nazad u pravi boks */
  const bezPravog = new Array(dani.length).fill(0);
  for (let i = dani.length - 1; i >= 0; i--){
    const ima = pravi.some(b => runs[b.id][i] > 0);
    bezPravog[i] = ima ? 0 : 1 + (i + 1 < dani.length ? bezPravog[i + 1] : 0);
  }
  const segs = [], full = [];
  let i = 0;
  while (i < dani.length){
    let best = null, bestRun = 0;
    for (const grupa of [pravi, kavezi]){
      for (const b of grupa){ if (runs[b.id][i] > bestRun){ bestRun = runs[b.id][i]; best = b; } }
      if (best){
        if (grupa === kavezi) bestRun = Math.max(1, Math.min(bestRun, bezPravog[i]));
        break;   // pravi boks ima prednost nad kavezom
      }
    }
    if (!best){ full.push(dani[i]); i++; continue; }
    const last = segs[segs.length - 1];
    if (last && last.b === best.id && addDays(last.t, 1) === dani[i]) last.t = dani[i + bestRun - 1];
    else segs.push({ b: best.id, f: dani[i], t: dani[i + bestRun - 1] });
    i += bestRun;
  }
  return { segs, full };
}
function autoPlanHTML(from, to, tarzi){
  const plan = autoBoxPlan(from, to, SF.id);
  if (!plan) return '';
  const jedan = plan.segs.length === 1 && !plan.full.length && plan.segs[0].f === from && plan.segs[0].t === to;
  /* kad jedan pravi boks pokriva cijeli termin nema šta da se kombinuje - osim ako su sami tražili */
  if (jedan && !boxSpare(boxById(plan.segs[0].b) || {}) && !tarzi) return '';
  /* hronološki: i mjesta i rupe kad nema ničeg slobodnog */
  const stavke = plan.segs.map(s => ({ f: s.f, t: s.t, b: s.b }))
    .concat(dayRanges(plan.full).map(r => ({ f: r.from, t: r.to, b: null })))
    .sort((a, b) => a.f.localeCompare(b.f));
  const redovi = stavke.map(s => {
    const kad = `<span class="num plan-kad">${s.f === s.t ? fmtD(s.f) : fmtD(s.f) + ' - ' + fmtD(s.t)}</span>`;
    /* isti redoslijed kao u „Provjeri datume": datum lijevo, mjesto desno */
    if (!s.b) return `<div class="plan-row plan-crveno">${kad}${I.warn}<span>nema mjesta</span></div>`;
    const b = boxById(s.b);
    const kavez = boxSpare(b);
    return `<div class="plan-row">${kad}
      <span class="badge ${kavez ? 'b-warn' : 'b-' + ((b && b.group) || 'line')}">${esc(boxFullName(b))}${kavez ? ' (rezerva)' : ''}</span>
    </div>`;
  }).join('');
  const imaKaveza = plan.segs.some(s => boxSpare(boxById(s.b) || {}));
  return `<div class="plan">
    <div class="plan-head">${I.swap} Prijedlog rasporeda · <span class="num">${fmtD(from)} - ${fmtD(to)}</span></div>
    ${redovi || '<p class="hint" style="margin:0">Nema nijednog slobodnog mjesta u ovom terminu.</p>'}
    ${imaKaveza ? `<div class="plan-note">U kavezu je onih dana kad su svi pravi boksevi puni.</div>` : ''}
    ${plan.segs.length ? `<button class="btn btn-primary btn-block btn-sm" data-act="sf-plan-take" style="margin-top:10px">Prihvati raspored</button>` : ''}
  </div>`;
}

/* premještanje u drugi boks usred boravka */
let MV = null;
function sfMoveModal(){
  const from = SF.from, to = SF.type === 'dnevni' ? SF.from : SF.to;
  if (!from || !to || to < from){ toast('Prvo izaberi termin.'); return; }
  const segs = sfSegs();
  const minD = segs.length ? addDays(segs[segs.length - 1].f, 1) : from;
  if (minD > to){ toast('Boravak je prekratak za premještanje.'); return; }
  const t = todayISO();
  if (!MV || MV.date < minD || MV.date > to) MV = { date: (t > minD && t <= to) ? t : minD, box: '' };
  if (!MV.cur) MV.cur = MV.date.slice(0, 7);
  showModal(`<div class="modal-title">Premještanje</div>
    <div class="fld"><label class="lbl">Od kog dana</label>${mvCalHTML(minD, to)}</div>
    <div class="fld"><label class="lbl">U koji boks od ${fmtDY(MV.date)}</label>
      <select id="mvBox">${boxOptionsHTML(MV.date, to, MV.box)}</select></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" data-act="modal-close">Otkaži</button>
      <button class="btn btn-primary" data-act="sf-box-move-do">Premjesti</button>
    </div>`);
}
/* mali kalendar u prozoru premještanja - isti izgled kao birač termina, bez engleskih datuma */
function mvCalHTML(minD, maxD){
  const [cy, cm] = MV.cur.split('-').map(Number);
  const first = new Date(cy, cm - 1, 1);
  const start = new Date(first);
  start.setDate(1 - ((first.getDay() + 6) % 7));
  let days = '';
  for (let i = 0; i < 42; i++){
    const d = new Date(start); d.setDate(start.getDate() + i);
    const iso = isoFromDate(d);
    const inMonth = d.getMonth() === cm - 1;
    const off = iso < minD || iso > maxD;
    days += `<button type="button" class="dr-day ${inMonth ? '' : 'other'} ${iso === MV.date ? 'r-edge' : ''} ${off ? 'mv-off' : ''}"
      ${off ? 'disabled' : `data-act="mv-pick" data-id="${iso}"`}><span class="dr-num num">${d.getDate()}</span></button>`;
  }
  const dows = DOWS_S.map((x, i) => `<span class="dr-dow ${i === 6 ? 'ned' : ''}">${x}</span>`).join('');
  const prevOff = MV.cur <= minD.slice(0, 7), nextOff = MV.cur >= maxD.slice(0, 7);
  return `<div class="dr">
    <div class="dr-head">
      <button type="button" class="dr-nav ${prevOff ? 'mv-off' : ''}" ${prevOff ? 'disabled' : 'data-act="mv-nav" data-id="-1"'}>‹</button>
      <span class="dr-title">${monthLabel(MV.cur)}</span>
      <button type="button" class="dr-nav ${nextOff ? 'mv-off' : ''}" ${nextOff ? 'disabled' : 'data-act="mv-nav" data-id="1"'}>›</button>
    </div>
    <div class="dr-grid">${dows}${days}</div>
    <div class="dr-foot">Premještaj od: <strong>${fmtDY(MV.date)}</strong></div>
  </div>`;
}

function sfSaveClient(){
  sfSync();
  const name = (SF.newClient.name || '').trim();
  if (!name){ toast('Upiši ime klijenta.'); return; }
  const pending = [...SF.newPets];
  if (SF.petForm && SF.petForm.name.trim()) pending.push({ ...SF.petForm });
  if (!pending.length){ toast('Dodaj bar jednog ljubimca.'); return; }
  const c = { id: uid(), name, phone: (SF.newClient.phone || '').trim(), note: '', blacklist: !!SF.newClient.blacklist };
  D.clients.push(c); dbSave('clients', c);
  for (const np of pending){
    const p = { id: uid(), clientId: c.id, name: np.name.trim(), species: np.species,
      size: np.species === 'macka' ? null : np.size, sex: np.sex || null, breed: (np.breed || '').trim(), note: '', photo: null };
    D.pets.push(p); dbSave('pets', p);
    /* isto pravilo kao kod postojećeg klijenta (sf-client-pick): app sam uključi SAMO kad je jedan.
       Sa dva ljubimca se bira dodirom na ljubimca pa „Dodaj na ovaj boravak". */
    if (pending.length === 1) SF.petIds.add(p.id);
  }
  SF.clientId = c.id; SF.newClient = null; SF.newPets = []; SF.petForm = null;
  render(); renderStayForm();
  toast('Klijent sačuvan.');
}

function sfPersist(){
  if (!SF) return null;
  sfSync();
  const clientId = SF.clientId;
  if (!clientId){ toast('Izaberi klijenta.'); return null; }
  const petIds = [...SF.petIds];
  if (!petIds.length){ toast('Izaberi bar jednog ljubimca.'); return null; }
  const from = SF.from;
  const to = SF.type === 'dnevni' ? SF.from : SF.to;
  if (!from){ toast('Izaberi datum dolaska.'); return null; }
  if (!to){ toast('Izaberi datum odlaska u kalendaru.'); return null; }
  if (to < from){ toast('Odlazak ne može biti prije dolaska.'); return null; }
  const price = parseMoney(SF.price);
  const avans = parseMoney(SF.avans) || 0;
  const boxes = sfSegs();
  const boxId = boxes.length ? boxes[0].b : null;

  if (SF.id){
    const st = D.stays.find(s => s.id === SF.id);
    if (!st){ toast('Boravak je u međuvremenu obrisan.'); sheetNazad(true); return null; }
    const dir = new Set(sfIzmjene(SF));
    if (dir.has('p')) st.petIds = petIds;
    if (dir.has('t') || dir.has('f') || dir.has('to')) Object.assign(st, { type: SF.type, from, to });
    if (dir.has('t') || dir.has('f') || dir.has('to') || dir.has('b')) Object.assign(st, { boxes, boxId });
    if (dir.has('pr')) st.price = price;
    if (dir.has('av')) st.payments = sfUpisiAvans(stayPayments(st), avans);
    if (dir.has('n')) st.note = SF.note.trim();
    st.deposit = null;
    dbSave('stays', st);
    return st;
  }
  const st = {
    id: uid(), clientId, petIds, type: SF.type, from, to,
    boxes, boxId, price, deposit: null, payments: sfUpisiAvans([], avans), paid: false, paidAt: null,
    arrivedAt: from === todayISO() ? null : (from < todayISO() ? from : null), leftAt: null,
    note: SF.note.trim(), createdAt: new Date().toISOString(),
  };
  D.stays.push(st);
  dbSave('stays', st);
  return st;
}

/* avans je uplata sa oznakom i datumom kad je primljen: polje pokazuje ZBIR avansa. Povećanje = nova uplata
   avansa današnjeg datuma (doplata ide u svoj mjesec), smanjenje skida od najnovijih, prazno polje briše sve. */
function sfUpisiAvans(pays, iznos){
  let av = pays.filter(p => p.av).sort((a, b) => (a.d || '').localeCompare(b.d || ''));
  const ostale = pays.filter(p => !p.av);
  const bilo = av.reduce((s, p) => s + p.a, 0);
  if (!(iznos > 0)) av = [];
  else if (iznos > bilo + 0.004) av.push({ a: Math.round((iznos - bilo) * 100) / 100, d: todayISO(), av: 1 });
  else {
    let visak = Math.round((bilo - iznos) * 100) / 100;
    while (visak > 0.004 && av.length){
      const z = av[av.length - 1];
      if (z.a <= visak + 0.004){ visak = Math.round((visak - z.a) * 100) / 100; av.pop(); }
      else { z.a = Math.round((z.a - visak) * 100) / 100; visak = 0; }
    }
  }
  const out = av.concat(ostale);
  return out.length ? out : null;
}

/* da li je izabrani boks u tom periodu već nečiji (dva psa u istom boksu = greška u tabeli) */
function sfBoxConflicts(){
  const from = SF.from, to = SF.type === 'dnevni' ? SF.from : SF.to;
  if (!from || !to || to < from) return [];
  const out = [];
  const lim = sfLeftLimit();
  sfSegs().forEach(s => {
    const kraj = lim && s.t > lim ? lim : s.t;
    if (kraj < s.f) return;
    boxStays(s.b, s.f, kraj, SF.id).forEach(st => {
      const b = boxById(s.b);
      out.push({ boks: GROUPS_1[b ? b.group : ''] ? GROUPS_1[b.group] + ' ' + b.name : (b ? b.name : '?'),
        ko: stayLabel(st),
        od: s.f > st.from ? s.f : st.from, do: kraj < st.to ? kraj : st.to });
    });
  });
  return out;
}
/* namjera čuvanja (ostani u boravku pa nastavi sa Otišao/Naplati, ili zatvori sve) preživljava pitanja
   „Boks je već zauzet" / „Preko kapaciteta" i briše se kad se čuvanje završi ili se odustane */
function sfOcistiNamjeru(){ if (SF){ SF.ostani = false; SF.posle = null; SF.sve = false; } }
function sfSave(force, sve){
  if (!SF) return;
  if (sve) SF.sve = true;
  sfSync();
  /* popunjeno i zauzet boks = pitanje, ne zabrana; za završene boravke se i ne pita */
  const zavrsen = SF.id && SF.to && SF.to < todayISO();
  if (!force && !zavrsen){
    const konf = sfBoxConflicts();
    if (konf.length){
      showModal(`<div class="modal-title">Boks je već zauzet</div>
        <div class="modal-text">${konf.slice(0, 4).map(k => `<b>${esc(k.boks)}</b> drži <b>${esc(k.ko)}</b> <span class="num">${k.od === k.do ? fmtD(k.od) : fmtD(k.od) + ' - ' + fmtD(k.do)}</span>`).join('<br>')}
        ${konf.length > 4 ? '<br>…' : ''}
        <br><span class="hint" style="display:block;margin-top:8px">Ako upišeš, dva ljubimca će biti u istom boksu.</span></div>
        <div class="modal-actions">
          <button class="btn btn-ghost" data-act="modal-close">Odustani</button>
          <button class="btn btn-primary" data-act="sf-save-force">Upiši svejedno</button>
        </div>`);
      return;
    }
    if (sfCapacityAsk('sf-save-force')) return;
  }
  const edit = !!SF.id;
  const ostani = edit && SF.ostani, posle = SF.posle;
  sve = SF.sve;
  const st = sfPersist(); if (!st) return;
  sfOcistiNamjeru();
  if (ostani){
    /* čuvanje prije Otišao/Naplati: forma ostaje, pa se odmah nastavlja */
    closeModal(); sfIzBoravka(st.id, SF && SF.otv); renderStayForm(); render();
    if (posle) chargeStart(st.id, posle === 'left'); else toast('Boravak sačuvan.');
    return;
  }
  closeModal(); sve ? sheetZatvoriSve(true) : sheetNazad(true); render();
  toast(edit ? 'Boravak sačuvan.' : 'Boravak dodat.');
  /* nov boravak = rezervacija: odmah ponudi potvrdu klijentu porukom */
  if (!edit) ponudiPotvrdu(st.id);
}

/* ============ POTVRDA REZERVACIJE PORUKOM ============
   Otvori Poruke (SMS) sa brojem klijenta i već iskucanim tekstom - ostaje samo „pošalji".
   Šalje se sa njihovog telefona i njihovog broja, ništa se ne plaća. */
function smsPotvrdaURI(st){
  const c = clientById(st.clientId);
  if (!c || !c.phone) return null;
  const broj = c.phone.replace(/[^\d+]/g, '');
  if (!broj) return null;
  const iznos = stayAmount(st);
  /* avans umanjuje cijenu - Vesna često traži dio unaprijed, pa klijent u poruci
     vidi i avans i koliko mu ostaje; oduzimaju se i uplate upisane u međuvremenu */
  const dep = stayAvans(st);
  const uplate = stayPaidSum(st) - dep;
  const kad = st.from === st.to
    ? '📅 Datum: ' + fmtDY(st.from)
    : '📅 Dolazak: ' + fmtDY(st.from) + '\n📅 Odlazak: ' + fmtDY(st.to);
  const text = 'Poštovanje,\n\n' +
    'Vaša rezervacija u Cindyland pansionu za pse i mačke je uspješno evidentirana. 🐾\n\n' +
    kad + '\n' +
    (iznos ? '💶 Ukupan iznos boravka: ' + money(iznos) + '\n' : '') +
    (iznos && dep ? '💰 Avans: ' + money(dep) + '\n' : '') +
    (iznos && (dep || uplate) ? '💶 Ostatak za uplatu: ' + money(Math.max(0, iznos - dep - uplate)) + '\n' : '') +
    '\n🍽️ Molimo da ponesete samo njegovu hranu za period boravka. Sve ostalo je obezbijeđeno u pansionu.\n\n' +
    '🕘 Prijem i preuzimanje ljubimaca obavljamo u terminima:\n• 08:00 - 20:00h\n\n' +
    'Hvala na ukazanom povjerenju. Radujemo se druženju sa vašim ljubimcem!';
  /* iPhone hoće &body=, ostali ?body= */
  const sep = /iPad|iPhone|iPod/.test(navigator.userAgent) ? '&' : '?';
  return 'sms:' + broj + sep + 'body=' + encodeURIComponent(text);
}
function ponudiPotvrdu(stayId){
  const st = D.stays.find(s => s.id === stayId); if (!st) return;
  const c = clientById(st.clientId); if (!c) return;
  const uri = smsPotvrdaURI(st);
  /* bez broja se ranije nije desavalo NISTA - ni prozor ni poruka, pa je izgledalo
     kao da je slanje potvrde nestalo. Od 5.8.2026. se uvijek javi. */
  if (!uri){ nemaBrojaModal(c.id); return; }
  if (CE) CE.pitanje = true; else if (PE) PE.pitanje = true;
  showModal(`<div class="modal-title">Boravak je upisan</div>
    <div class="modal-text">Poslati potvrdu porukom? Otvoriće se Poruke sa gotovim tekstom za <b>${esc(c.name)}</b> (<span class="num">${esc(c.phone)}</span>).</div>
    <div class="modal-actions">
      <button class="btn btn-ghost" data-act="modal-close">Ne sad</button>
      <a class="btn btn-primary" data-act="sms-salji" href="${esc(uri)}">${I.sms} Pošalji</a>
    </div>`);
}

/* isti prozor iz dva mjesta: sa oblačića u boravku i poslije upisa novog boravka */
function nemaBrojaModal(cid){
  const c = clientById(cid); if (!c) return;
  if (CE) CE.pitanje = true; else if (PE) PE.pitanje = true;
  showModal(`<div class="modal-title">Nema broja telefona</div>
    <div class="modal-text"><b>${esc(c.name)}</b> nema upisan broj, pa se potvrda ne može poslati.
      Upiši broj pa pošalji poruku iz boravka.</div>
    <div class="modal-actions">
      <button class="btn btn-ghost" data-act="modal-close">Ne sad</button>
      <button class="btn btn-primary" data-act="client-open" data-id="${c.id}">Upiši broj</button>
    </div>`);
}

/* štrik Došao / Otišao. „Otišao" NE upisuje ništa sam - otvara prozor odlaska sa obračunom (avans, uplate,
   za naplatu), a odlazak se upisuje tek na potvrdu, zajedno sa naplatom ili sa „plaća kasnije". */
function stayMark(id, field){
  const st = D.stays.find(s => s.id === id); if (!st) return;
  if (field === 'left'){ chargeStart(id, true); return; }
  const t = todayISO();
  st.arrivedAt = t;
  if (st.leftAt && st.leftAt < t) st.leftAt = null;
  dbSave('stays', st);
  render();
  osvjeziSheet();
  if (SF && SF.id === id) renderStayForm();
  toast(stayLabel(st) + ' je u pansionu.', { lbl: 'Poništi', act: 'dosao-ponisti', id });
}
function stayUnmark(id, field){
  const st = D.stays.find(s => s.id === id); if (!st) return;
  if (SF && SF.id === id) sfSync();          // bez ovoga bi poništavanje pojelo ukucan avans/cijenu/napomenu
  if (field === 'arrived'){ st.arrivedAt = null; st.leftAt = null; } else st.leftAt = null;
  dbSave('stays', st);
  render(); if (SF && SF.id === id) renderStayForm();
}

/* „Poništi" naplatu briše i UPLATU kojom je boravak zatvoren (upisana na dan zatvaranja) - ranije je ostajala u
   Finansijama, pa je isti novac mogao biti naplaćen dva puta. Ranije uplate i avans ostaju: one su stvarno primljene. */
function sfZatvarajucaUplata(st){
  const pays = stayPayments(st);
  for (let i = pays.length - 1; i >= 0; i--) if (pays[i].z) return i;
  return -1;   // zatvoren bez nove uplate (ili stariji zapis): poništava se samo oznaka naplaćeno
}
function sfUnpayAsk(){
  if (!SF) return;
  sfSync();
  const st = D.stays.find(s => s.id === SF.id); if (!st) return;
  const i = sfZatvarajucaUplata(st);
  const p = i >= 0 ? stayPayments(st)[i] : null;
  confirmModal('Poništiti naplatu?', p
      ? `Briše se uplata od <b class="num">${money(p.a)}</b> (${fmtD(p.d)}) i iz Finansija.`
      : 'Boravak će opet stajati kao nenaplaćen.',
    'sf-unpay-yes', st.id, 'Poništi naplatu', true);
}
function sfUnpay(id){
  if (!SF || SF.id !== id){ closeModal(); return; }
  const st = D.stays.find(s => s.id === id); if (!st){ closeModal(); return; }
  const pays = stayPayments(st);
  const i = sfZatvarajucaUplata(st);
  if (i >= 0) pays.splice(i, 1);
  st.payments = pays.length ? pays : null;
  st.paid = false; st.paidAt = null;
  SF.paid = false; SF.paidAt = null;
  sfBazaPolje('paid', false);
  dbSave('stays', st);
  closeModal();
  render(); renderStayForm();
  toast('Naplata poništena.');
}

function stayDelete(id){
  D.stays = D.stays.filter(s => s.id !== id);
  dbKill('stays', id);
  closeModal(); sheetNazad(true); render();
  toast('Boravak obrisan.');
}
</script>
<script>
/* ============ PROVJERI DATUME ============
   Zovu i pitaju „ima li mjesta od-do?". Ovdje se ukuca termin i vrsta ljubimca,
   a app odmah kaže gdje sve može da ga smjesti - ili da nema mjesta.
   Račun je isti kao u formi boravka (autoBoxPlan), da se odgovori ne razilaze. */
let PD = null;
const PD_VRSTE = [
  { id: 'mali', lbl: 'Mali pas' },
  { id: 'veliki', lbl: 'Veliki pas' },
  { id: 'macka', lbl: 'Mačka' },
];
function datesCheckSheet(){
  /* svaki poziv je novo pitanje - datumi se brišu, vrsta ostaje kako je zadnji put bila */
  PD = { from: '', to: '', calCur: todayISO().slice(0, 7), type: 'pansion', vrsta: (PD && PD.vrsta) || 'mali' };
  renderDatesCheck();
}
/* strogo po vrsti: mali pas samo mali boksevi, veliki samo veliki, mačka samo mačji */
function pdGroups(){ return new Set([vrstaGrupa(PD.vrsta)]); }
function renderDatesCheck(){
  const spreman = !!(PD.from && PD.to && PD.to >= PD.from);
  const keep = $('#sheetBody') && sheetOpen ? $('#sheetBody').scrollTop : 0;
  openSheet('Provjeri datume', `
    <div class="fld"><label class="lbl">Kakav ljubimac</label>
      <div class="pd-vrste">${PD_VRSTE.map(v => `<button class="chip ${PD.vrsta === v.id ? 'on' : ''}" data-act="pd-vrsta" data-id="${v.id}">${v.lbl}</button>`).join('')}</div>
    </div>
    <div class="fld"><label class="lbl">Termin</label>${drCalHTML(PD, { nav: 'pd-nav', pick: 'pd-pick' })}</div>
    ${spreman ? pdResultHTML(PD.from, PD.to)
      : PD.from ? '' /* podnožje kalendara već traži dan odlaska - druga poruka bi mu protivrječila */
      : ''}
  `);
  if (keep) $('#sheetBody').scrollTop = keep;
}
function pdResultHTML(from, to){
  const plan = autoBoxPlan(from, to, null, pdGroups());
  const vrsta = (PD_VRSTE.find(v => v.id === PD.vrsta) || {}).lbl.toLowerCase();
  /* godina se piše samo kad termin prelazi iz godine u godinu - inače je samo šum */
  const dat = from.slice(0, 4) === to.slice(0, 4) ? fmtD : fmtDY;
  const podnaslov = from === to
    ? `${dat(from)} · ${vrsta} · dnevno čuvanje`
    : `${dat(from)} - ${dat(to)} · ${vrsta} · ${nightsLabel(diffDays(from, to))}`;
  /* plan === null nije isto što i „nema mjesta": ili je termin predug, ili za tu vrstu
     nema nijednog upisanog boksa - to se mora reći drugačije da ne obmane */
  if (!plan){
    const imaBokseva = sortedBoxes().some(b => b.active && pdGroups().has(b.group));
    return `<div class="card"><div class="empty">${I.warn}${imaBokseva
      ? 'Termin je predug za provjeru - probaj kraći period.'
      : 'U Podešavanjima nema nijednog boksa za ' + vrsta + '.'}</div></div>`;
  }
  if (!plan.segs.length){
    return `<div class="pd-res pd-no">
      <div class="pd-res-t">NEMA MJESTA</div>
      <div class="pd-res-s">${podnaslov}</div>
    </div>`;
  }
  /* hronološki: gdje može, i rupe kad nema baš ničeg slobodnog */
  const stavke = plan.segs.map(s => ({ f: s.f, t: s.t, b: s.b }))
    .concat(dayRanges(plan.full).map(r => ({ f: r.from, t: r.to, b: null })))
    .sort((a, b) => a.f.localeCompare(b.f));
  const rupa = plan.full.length > 0;
  const redovi = stavke.map(s => {
    const raspon = s.f === s.t ? dat(s.f) : dat(s.f) + ' - ' + dat(s.t);
    if (!s.b) return `<div class="pd-row"><span class="pd-kad num" style="color:var(--danger)">${raspon}</span><span class="badge b-danger">nema mjesta</span></div>`;
    const b = boxById(s.b);
    const kavez = boxSpare(b);
    return `<div class="pd-row"><span class="pd-kad num">${raspon}</span>
      <span class="badge ${kavez ? 'b-warn' : 'b-' + ((b && b.group) || 'line')}">${esc(boxFullName(b))}${kavez ? ' (rezerva)' : ''}</span></div>`;
  }).join('');
  const imaKaveza = plan.segs.some(s => boxSpare(boxById(s.b)));
  const selidbe = plan.segs.length - 1;
  /* naslov mora reći ono što im je jedino bitno: pravi boks, ili kavez, ili fali dana */
  const stanje = rupa ? { cls: 'pd-warn', t: plan.full.length === 1 ? 'NEMA SAMO ' + fmtD(plan.full[0]) : 'FALI ' + plan.full.length + ' ' + plural(plan.full.length, 'DAN', 'DANA', 'DANA') }
    : imaKaveza ? { cls: 'pd-warn', t: 'IMA, ALI U KAVEZU' }
    : { cls: 'pd-ok', t: 'IMA MJESTA' };
  /* boravci bez upisanog boksa se ne broje u zauzetost - moraju se pomenuti da odgovor ne bude lažan */
  const bezBoksa = D.stays.filter(st => overlap(st, from, to) && !stayBoxes(st).length).length;
  return `<div class="pd-res ${stanje.cls}">
      <div class="pd-res-t">${stanje.t}</div>
      <div class="pd-res-s">${podnaslov}</div>
    </div>
    <div class="lbl" style="margin:0 2px 6px">${selidbe > 0 ? 'Selio bi se ' + selidbe + ' ' + plural(selidbe, 'put', 'puta', 'puta') : 'Cijelo vrijeme na istom mjestu'}</div>
    <div class="card">${redovi}
      ${imaKaveza ? '<p class="hint" style="margin-top:10px">Kavez je rezervno mjesto - tu ide samo onih dana kad su svi boksevi puni.</p>' : ''}
    </div>
    <p class="hint" style="margin:-4px 2px 12px">Odgovor važi za jedno mjesto (jedan boks).${bezBoksa ? ` U ovom terminu ima ${bezBoksa} ${plural(bezBoksa, 'boravak', 'boravka', 'boravaka')} bez upisanog boksa - oni se ne broje u zauzetost.` : ''}</p>
    <button class="btn btn-primary btn-block" data-act="pd-upisi">${I.plus} Upiši boravak za ovaj termin</button>`;
}

/* ============ KARTICA KLIJENTA (popup) ============ */
/* Jedno isto mjesto za sve o klijentu - otvara se i klikom na klijenta u spisku
   i klikom na vlasnika iz boravka: podaci, ljubimci (uređivanje + slika) i boravci. */
let CE = null; // {clientId, name, phone, note, black, petForm, added[], fromStay}

/* ============ UVEĆANA SLIKA ============
   Klik na sliku u kartici ljubimca je uveća u krug na sredini ekrana, pa je vrati nazad u avatar.
   Radi se FLIP-om: slika se nacrta na KONAČNOM mjestu, transformom vrati tačno na avatar, pa pusti
   u identitet. Animira se samo `transform`, pa je glatko i na starijem telefonu (ne width/height).
   „Nazad" na telefonu prvo zatvara sliku, tek onda karticu - zato svoj korak u istoriji. */
let ZOOM = null;
const KADR = { duration: 300, easing: 'cubic-bezier(.22,1,.36,1)', fill: 'both' };
function zoomPhoto(url, odEl){
  if (!url || ZOOM || !odEl) return;
  const r = odEl.getBoundingClientRect();
  if (!r.width) return;
  const host = document.createElement('div');
  host.className = 'zoom-host';
  host.dataset.act = 'zoom-close';
  /* prvo mala slika (već je na ekranu, stiže odmah), velika se podmetne kad stigne */
  const mala = fotoMala(url);
  host.innerHTML = `<img class="zoom-img" src="${esc(mala)}"${mala !== url ? ` data-velika="${esc(url)}"` : ''} alt="">`;
  document.body.appendChild(host);
  const img = host.firstElementChild;
  if (mala !== url){
    const velika = new Image();
    velika.onload = () => {
      const podmetni = () => { if (ZOOM && ZOOM.img === img) img.src = url; };
      (velika.decode ? velika.decode().catch(() => {}) : Promise.resolve()).then(podmetni);
    };
    velika.src = url;
  }
  const k = img.getBoundingClientRect();
  host.classList.add('on');
  /* animate() umjesto CSS prelaza: sam kreće od zadatog kadra, ne traži trikove sa reflow-om
     i ne zavisi od toga kad browser stigne da iscrta sljedeći kadar */
  img.animate([{ transform: naAvatar(k, r) }, { transform: 'none' }], KADR);
  history.pushState({ zoom: 1 }, '');
  ZOOM = { host, img, kraj: k, el: odEl };
}
/* transform koji uvećanu sliku (pravougaonik `k`, bez transformacije) poklopi sa avatarom `r` */
function naAvatar(k, r){
  const s = r.width / k.width;
  const dx = (r.left + r.width / 2) - (k.left + k.width / 2);
  const dy = (r.top + r.height / 2) - (k.top + k.height / 2);
  return `translate(${dx}px, ${dy}px) scale(${s})`;
}
function zoomClose(viaPop){
  if (!ZOOM) return;
  const { host, img, kraj, el } = ZOOM;
  ZOOM = null;
  /* avatar se u međuvremenu mogao pomjeriti (kartica se prescrolovala) - računa se iznova,
     a ako ga više nema na ekranu slika se samo stopi umjesto da odleti nekud */
  const r = el && el.isConnected ? el.getBoundingClientRect() : null;
  host.classList.remove('on');
  const a = r && r.width
    ? img.animate([{ transform: 'none' }, { transform: naAvatar(kraj, r) }], KADR)
    : img.animate([{ opacity: 1 }, { opacity: 0 }], KADR);   // avatar više nije na ekranu
  a.onfinish = () => host.remove();
  setTimeout(() => host.remove(), 600);   // pojas i tregeri, ako animacija ne javi kraj
  if (!viaPop) popBack();
}

/* ============ KARTICA LJUBIMCA ============
   Traženje Vesne i Novice (5.8.2026): iz boravka im treba ŠTA PAS TRAŽI (kad jede, navike,
   ujeda li), a ne vlasnički karton. Zato ljubimac ima svoju karticu, a vlasnik je jedan klik dalje.
   Navike se drže u postojećem polju `pets.note` - tu su ih i do sad upisivali.
   Prekidač „Na ovom boravku" je ono što je ranije radio klik na avatar (biranje ko je na boravku).
   Vidi se SAMO kad je kartica otvorena iz boravka I kad klijent ima više od jednog ljubimca -
   kod jednog ljubimca ga app sam uključi pa bi prekidač bio samo smetnja. */
let PE = null;   /* { petId, clientId, novi, fromStay, hist, form, base, top, pitanje }
                    form === null -> kartica SAMO PRIKAZUJE; novi -> prazna kartica za novog ljubimca */
function openPetPop(petId, preuzmiKorak){
  const p = petById(petId); if (!p) return;
  PE = { petId, clientId: p.clientId, novi: false, fromStay: !!SF, hist: true, form: null, base: null };
  /* „nazad" na telefonu zatvara SAMO karticu; kad je preuzet korak od kartice klijenta se ne gura novi */
  if (!preuzmiKorak) history.pushState({ pePop: 1 }, '');
  renderPetPop();
}
/* NOVI ljubimac dobija istu karticu, samo praznu - dodavanje se nikad ne radi na
   ekranu sa poljima vlasnika (Novica 15.9.) */
function openPetNew(clientId, preuzmiKorak){
  if (!clientById(clientId)) return;
  const f = { name: '', species: 'pas', size: 'mali', sex: null, breed: '', note: '' };
  PE = { petId: null, clientId, novi: true, fromStay: !!SF, hist: true, form: f, base: { ...f }, top: true };
  if (!preuzmiKorak) history.pushState({ pePop: 1 }, '');
  renderPetPop();
}
/* polja postoje SAMO u izmjeni - u prikazu nema sta da se sinhronizuje */
function pePopSync(){
  if (!PE || !PE.form) return;
  const g = id => document.getElementById(id);
  if (g('peName')) PE.form.name = g('peName').value;
  if (g('peBreed')) PE.form.breed = g('peBreed').value;
  if (g('peNote')) PE.form.note = g('peNote').value;
}
const PE_POLJA = ['name', 'species', 'size', 'sex', 'breed', 'note'];
const peIsto = (a, b) => ((a === undefined ? null : a) || null) === ((b === undefined ? null : b) || null);
function peSnap(p){
  return { name: p.name || '', species: p.species || 'pas',
    size: p.species === 'macka' ? null : (p.size || 'mali'),
    sex: p.sex || null, breed: p.breed || '', note: p.note || '' };
}
function peFormOpen(){
  const p = petById(PE.petId); if (!p) return;
  PE.base = peSnap(p);
  PE.form = Object.assign({}, PE.base, { size: PE.base.size || 'mali' });
  PE.top = true;
  renderPetPop();
}
function peFormValues(){
  pePopSync();
  const f = PE.form;
  return { name: (f.name || '').trim(), species: f.species,
    size: f.species === 'macka' ? null : f.size, sex: f.sex || null,
    breed: (f.breed || '').trim(), note: (f.note || '').trim() };
}
/* „dirano" se mjeri prema stanju u trenutku ulaska u izmjenu (PE.base), NE prema trenutnom
   zapisu - inace bi tudji upis sa drugog telefona lazno prijavio izmjenu */
function peFormDirty(){
  if (!PE || !PE.form) return false;
  const b = PE.base || {}, v = peFormValues();
  return PE_POLJA.some(k => !peIsto(v[k], b[k]));
}
function peFormSave(){
  const v = peFormValues();
  if (!v.name){ toast('Upiši ime ljubimca.'); return; }

  /* novi ljubimac */
  if (PE.novi){
    if (!clientById(PE.clientId)){ toast('Klijent je u međuvremenu obrisan.'); PE.form = null; peDone(); return; }
    const p = Object.assign({ id: uid(), clientId: PE.clientId, photo: null }, v);
    D.pets.push(p); dbSave('pets', p);
    const naBoravak = SF && SF.clientId === PE.clientId;
    if (naBoravak){
      SF.petIds.add(p.id);
      /* UPISAN boravak se mijenja odmah (kao štrik Došao/Otišao) - inače bi poruka rekla da je
         urađeno, a zatvaranje forme tiho poništilo */
      if (SF.id){
        const st = D.stays.find(s => s.id === SF.id);
        if (st){ st.petIds = [...SF.petIds]; dbSave('stays', st); sfBazaPolje('p', JSON.stringify([...SF.petIds].sort())); }
      }
    }
    PE.form = null;
    peDone();
    toast(petLabel(p) + (naBoravak ? ' je na ovom boravku.' : ' je dodat.'));
    return;
  }

  const p = petById(PE.petId);
  if (!p){ toast('Ljubimac je u međuvremenu obrisan.'); PE.form = null; renderPetPop(); return; }
  /* upisuju se SAMO polja koja je korisnik dirao - ako je druga osoba u međuvremenu dopisala
     navike, njen upis se ne gazi zastarjelim draftom */
  const b = PE.base || {}, izmjene = {};
  PE_POLJA.forEach(k => { if (!peIsto(v[k], b[k])) izmjene[k] = v[k]; });
  if (izmjene.species !== undefined) izmjene.size = v.size;   // vrsta i veličina idu u paru
  PE.form = null; PE.base = null; PE.top = true;
  if (!Object.keys(izmjene).length){ renderPetPop(); return; }
  Object.assign(p, izmjene);
  dbSave('pets', p);
  renderPetPop();
  render();
  toast('Sačuvano.');
}
/* Novica (15.9.): podaci o ljubimcu se mijenjaju SAMO kroz „Izmijeni" pa „Sačuvaj" -
   zatvaranje kartice nista ne upisuje tiho, a ako je u izmjeni nesto dirano, pita. */
function peDone(viaPop, zadrziKorak){
  if (!PE) return closeModal();
  /* dok preko kartice stoji potvrda, „nazad" znaci Otkaži - vrati u karticu, ne zatvaraj sve */
  if (PE.pitanje){
    PE.pitanje = false;
    if (viaPop) history.pushState({ pePop: 1 }, '');
    renderPetPop();
    return;
  }
  if (PE.form && peFormDirty()){
    /* „nazad" je korak iz istorije već potrošio - vrati ga da kartica ostane svoj korak */
    if (viaPop) history.pushState({ pePop: 1 }, '');
    PE.pitanje = true;
    confirmModal(PE.novi ? 'Odbaciti novog ljubimca?' : 'Odbaciti izmjene?',
      PE.novi ? 'Ljubimac još nije dodat.' : 'Izmjene na ljubimcu nisu sačuvane.',
      'pe-discard', '', 'Odbaci', true, 'pe-back');
    return;
  }
  const hist = PE.hist;
  PE = null;
  closeModal();
  if (hist && !viaPop && !zadrziKorak) popBack();
  if (SF) renderStayForm();
  render();
}

function renderPetPop(){
  const p = PE.novi ? null : petById(PE.petId);
  if (!PE.novi && !p){ const h = PE.hist; PE = null; closeModal(); if (h) popBack(); if (SF) renderStayForm(); toast('Ljubimac je u međuvremenu obrisan.'); return; }
  const stara = $('#modalHost') ? $('#modalHost').querySelector('.modal-card') : null;
  const skrol = (PE.top || !stara) ? 0 : stara.scrollTop;   // prelaz prikaz<->izmjena počinje od vrha
  PE.top = false;
  const f = PE.form;
  /* avatar prati ONO ŠTO JE ODABRANO u formi; znački u izmjeni NEMA - forma ispod je jedina
     istina, inače bi značka pokazivala staru vrstu/pol i izgledalo bi da dodir nije primljen */
  const vrsta = f ? f.species : p.species;
  const vel = f ? (f.species === 'macka' ? null : f.size) : (p.species === 'macka' ? null : p.size);
  const cls = vrsta === 'macka' ? 'av-m' : (vel === 'veliki' ? 'av-vb' : 'av-mb');
  const av = (p && p.photo) ? fotoImg(p.photo) : (vrsta === 'macka' ? I.cat : I.dog);
  const znacke = f ? [] : [p.species === 'macka' ? 'Mačka' : (p.size === 'veliki' ? 'Veliki pas' : 'Mali pas'),
    p.breed || '', p.sex === 'muzjak' ? 'mužjak' : (p.sex === 'zenka' ? 'ženka' : '')].filter(Boolean);
  const naslov = PE.novi ? 'Novi ljubimac' : esc(petLabel(p));
  const GLAVA = `<div class="ce-head">
      <div class="pe-title">
        ${p && p.photo && !f ? `<button class="pe-av ${cls}" data-act="pe-photo-zoom" aria-label="Uvećaj sliku">${av}</button>`
                  : `<span class="pe-av ${cls}">${av}</span>`}
        <span class="pe-txt"><span class="modal-title">${naslov}</span>
        ${znacke.length ? `<span class="pe-sub">${znacke.map(z => `<span class="badge b-line">${esc(z)}</span>`).join('')}</span>` : ''}</span>
      </div>
      <button class="sheet-x" data-act="modal-close" aria-label="Zatvori">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>`;

  /* ---------- IZMJENA (i novi ljubimac): samo polja ljubimca ---------- */
  if (f){
    showModal(GLAVA + pePetFormHTML(f, p), true, 'modal-card');
    if (skrol){ const m = $('#modalHost').querySelector('.modal-card'); if (m) m.scrollTop = skrol; }
    return;
  }

  /* ---------- PRIKAZ: sve stoji kao tekst ---------- */
  const c = clientById(p.clientId);
  const t = todayISO();
  const stays = D.stays.filter(st => (st.petIds || []).includes(p.id)).sort((a, b) => b.from.localeCompare(a.from));
  const sada = stays.find(st => stayHereOn(st, t));
  /* radnja zbog koje su i ušli u karticu iz boravka: da li ovaj ljubimac ide na taj boravak */
  const NA_BORAVKU = PE.fromStay && SF && SF.clientId === p.clientId
      && (petsOfClient(p.clientId).length > 1 || !SF.petIds.has(p.id))
    ? (SF.petIds.has(p.id)
      ? `<button class="btn btn-ghost btn-block" data-act="pe-stay-toggle" data-id="${p.id}" style="margin-top:4px">Skloni sa ovog boravka</button>`
      : `<button class="btn btn-primary btn-block" data-act="pe-stay-toggle" data-id="${p.id}" style="margin-top:4px">${I.plus} Dodaj na ovaj boravak</button>`)
    : '';
  const SHOW = PE.sve ? stays.length : 6;
  /* redovi otvaraju boravak, a „nazad" vraća u ovu karticu */
  const rows = stays.slice(0, SHOW).map(st => {
    const status = stayStatus(st);
    const boks = boxById(stayBoxId(st));
    return `<div class="row tappable" data-act="pe-stay-open" data-id="${st.id}">
      <div class="row-main">
        <div class="row-name num">${fmtRaspon(st.from, st.to)}</div>
        <div class="row-meta">${stayLenLabel(st)}${boks ? ' · ' + esc(GROUPS_1[boks.group] + ' ' + boxShort(boks)) : ''}</div>
      </div>
      <div class="row-side">${status === 'in' && st !== sada ? '<span class="badge b-ok">u pansionu</span>'
        : status === 'rez' ? '<span class="badge b-line">rezervacija</span>' : ''}</div>
    </div>`;
  }).join('');

  showModal(GLAVA + `
    ${sada ? `<button class="banner ban-ok pe-sada" data-act="pe-stay-open" data-id="${sada.id}">${I.paw}<span style="flex:1;text-align:left">U pansionu do <b class="num">${fmtD(sada.to)}</b></span><span class="chev" style="width:16px;height:16px;color:var(--ok)">${I.chev}</span></button>` : ''}
    ${NA_BORAVKU}
    <div class="fld" style="margin-top:10px">

    <input type="file" id="petPhotoFile" accept="image/*" data-pet="${p.id}" style="display:none">` : ''}
    ${c ? `<div class="lbl" style="margin:14px 2px 2px">Vlasnik</div>
    <div class="row" style="border:none">
      <div class="row-tap tappable" data-act="pe-client" data-id="${c.id}">
        <div class="row-av av-p">${esc((c.name || '?')[0].toUpperCase())}</div>
        <div class="row-main"><div class="row-name">${esc(c.name)}</div>
          <div class="row-meta">${c.phone ? `<span class="num">${esc(c.phone)}</span>` : 'bez telefona'}</div></div>

      </div>
      ${c.phone ? `<a class="iconbtn" href="tel:${esc(c.phone)}" aria-label="Pozovi">${I.phone}</a>` : ''}
    </div>` : ''}

    <div class="ce-stays">${rows || '<div class="empty" style="padding:16px 12px">Još nema boravaka.</div>'}</div>
    ${stays.length > SHOW ? `<button class="btn btn-ghost btn-sm btn-block" data-act="pe-sve" style="margin-top:8px">Prikaži sve (${stays.length})</button>` : ''}
    <div class="ce-akcije" style="margin-top:14px">
      <button class="btn btn-ghost" data-act="pe-edit">${I.edit} Izmijeni</button>
      <button class="btn ${NA_BORAVKU && SF && !SF.petIds.has(p.id) ? 'btn-ghost' : 'btn-primary'}" data-act="pe-new-stay">${I.plus} Novi boravak</button>
    </div>
  `, true, 'modal-card');
  if (skrol){ const m = $('#modalHost').querySelector('.modal-card'); if (m) m.scrollTop = skrol; }
}

/* KARTICA VLASNIKA (redizajn 25.10.2026): kao kartica ljubimca - PRIKAZ, a polja (ime, telefon, napomena,
   crna lista) tek na „Izmijeni", sa Sačuvaj/Otkaži. Ranije su polja bila stalno otvorena i svako zatvaranje
   (krstić, Gotovo, nazad, klik pored) ih je TIHO upisivalo - isti kvar koji je Novica 15.9. prijavio za
   karticu ljubimca. Zatvaranje sada ništa ne upisuje; ako je u izmjeni nešto dirano, pita „Odbaciti izmjene?". */
function openClientPop(cid, newPet, preuzmiKorak){
  const c = clientById(cid); if (!c) return;
  CE = { clientId: cid, form: null, base: null, petForm: null, added: [], fromStay: !!SF, sve: false };
  if (newPet) CE.petForm = { name: '', species: 'pas', size: 'mali', sex: null, breed: '', note: '' };
  /* dugme „nazad" na telefonu zatvara SAMO karticu (i kad je otvorena preko forme boravka).
     Kad se dolazi iz kartice ljubimca, korak je vec njen - preuzima se, ne gura se novi. */
  if (preuzmiKorak) history.replaceState({ cePop: 1 }, '');
  else history.pushState({ cePop: 1 }, '');
  CE.hist = true;
  renderClientPop();
}
function cePopSync(){
  if (!CE) return;
  const g = id => document.getElementById(id);
  if (CE.form){
    if (g('ceName')) CE.form.name = g('ceName').value;
    if (g('cePhone')) CE.form.phone = g('cePhone').value;
    if (g('ceNote')) CE.form.note = g('ceNote').value;
    if (g('ceBlack')) CE.form.black = g('ceBlack').classList.contains('on');
  }
  if (CE.petForm){
    if (g('cePfName')) CE.petForm.name = g('cePfName').value;
    if (g('cePfBreed')) CE.petForm.breed = g('cePfBreed').value;
    if (g('cePfNote')) CE.petForm.note = g('cePfNote').value;
  }
}
function ceFormOpen(){
  const c = clientById(CE.clientId); if (!c) return;
  CE.form = { name: c.name || '', phone: c.phone || '', note: c.note || '', black: !!c.blacklist };
  CE.base = { ...CE.form };
  CE.petForm = null;
  renderClientPop(true);
}
function ceFormDirty(){
  if (!CE || !CE.form) return false;
  cePopSync();
  return ['name', 'phone', 'note', 'black'].some(k => String(CE.form[k]).trim() !== String(CE.base[k]).trim());
}
/* upisuju se samo dirana polja (druga osoba je možda u međuvremenu dopisala telefon) */
function ceFormSave(){
  cePopSync();
  const c = clientById(CE.clientId);
  if (!c){ ceDone(true); return; }
  const f = CE.form, b = CE.base;
  if (!f.name.trim()){ toast('Ime je obavezno.'); return; }
  if (f.name.trim() !== b.name.trim()) c.name = f.name.trim();
  if (f.phone.trim() !== b.phone.trim()) c.phone = f.phone.trim();
  if (f.note.trim() !== b.note.trim()) c.note = f.note.trim();
  if (f.black !== b.black) c.blacklist = !!f.black;
  dbSave('clients', c);
  CE.form = null; CE.base = null;
  renderClientPop(true);
  if (SF) renderStayForm();
  render();
  toast('Sačuvano.');
}

/* kratak raspon datuma: godina samo kad nije tekuća */
function fmtRaspon(a, b){
  const god = todayISO().slice(0, 4);
  if (!b || a === b) return a.slice(0, 4) === god ? fmtD(a) : fmtDY(a);
  if (a.slice(0, 4) !== b.slice(0, 4)) return fmtDY(a) + ' – ' + fmtDY(b);
  return fmtD(a) + ' – ' + (b.slice(0, 4) === god ? fmtD(b) : fmtDY(b));
}
function renderClientPop(odVrha){
  const c = clientById(CE.clientId);
  if (!c){ CE.form = null; ceDone(true); toast('Klijent je u međuvremenu obrisan.'); return; }
  const stara = $('#modalHost') ? $('#modalHost').querySelector('.modal-card') : null;
  const skrol = odVrha || !stara ? 0 : stara.scrollTop;
  const X = `<button class="sheet-x" data-act="modal-close" aria-label="Zatvori">${I.x}</button>`;

  /* ---------- IZMJENA: samo podaci o vlasniku ---------- */
  if (CE.form){

    ${duguje > 0 ? `<div class="banner ban-warn" style="margin:2px 0 12px">${I.euro}<span>Duguje ukupno <b class="num">${money(duguje)}</b></span></div>` : ''}

    <div class="fld" style="margin-bottom:6px"><label class="lbl">Ljubimci</label>

function clientDelete(cid){
  const n = D.stays.filter(st => st.clientId === cid).length;
  /* server kaskadno briše i ljubimce i boravke - njihovi nepotvrđeni upisi nikad ne bi prošli */
  cekaZaboravi(D.stays.filter(st => st.clientId === cid).map(st => 'stays:' + st.id)
    .concat(D.pets.filter(p => p.clientId === cid).map(p => 'pets:' + p.id)));
  D.stays = D.stays.filter(st => st.clientId !== cid);
  D.pets = D.pets.filter(p => p.clientId !== cid);
  D.clients = D.clients.filter(c => c.id !== cid);
  dbKill('clients', cid); // na serveru kaskadno briše i ljubimce i boravke
  closeModal(); sheetZatvoriSve(true); render();
  toast('Klijent obrisan' + (n ? ` (i ${n} borav${n === 1 ? 'ak' : 'aka'})` : '') + '.');
}

function petDelete(petId){
  const p = petById(petId);
  /* obrisan sa drugog uređaja dok je potvrda stajala - zatvori, ne ostavljaj mrtav prozor */
  if (!p){
    if (PE && PE.petId === petId){
      const hist = PE.hist;
      PE = null; closeModal();
      if (hist) popBack();
      if (SF) renderStayForm();
    } else closeModal();
    render();
    toast('Ljubimac je već obrisan.');
    return;
  }
  D.pets = D.pets.filter(x => x.id !== petId);
  const touched = D.stays.filter(st => (st.petIds || []).includes(petId));
  touched.forEach(st => { st.petIds = st.petIds.filter(id => id !== petId); });
  dbKill('pets', petId);
  touched.forEach(st => dbSave('stays', st));
  if (SF){ SF.petIds.delete(petId); if (SF.id) sfBazaPolje('p', JSON.stringify([...SF.petIds].sort())); }
  if (PE && PE.petId === petId){
    const hist = PE.hist;
    PE = null;
    closeModal();
    if (hist) popBack();
    if (SF) renderStayForm();
  } else if (CE){
    CE.petForm = null;
    CE.added = CE.added.filter(x => x !== petId);
    renderClientPop();
  } else closeModal();
  render();
  toast('Ljubimac obrisan.');
}

<script>
/* ============ SLIKA LJUBIMCA ============
   Pravimo DVIJE slike: veliku (do 700 px) za uvećan prikaz i malu (240×240, isječak sredine - isto što
   pokazuje i avatar sa object-fit: cover) za liste. Obje idu u storage sa keš-zaglavljem od godinu dana i
   odmah u keš telefona, da se ono što je upravo poslato ne skida nazad.
   SVAKA nova slika ide na NOVU putanju (pets/<id>-<vrijeme>.jpg): CDN ispred storage-a kešira po putanji i
   NE gleda ?v= (provjereno 24.9.2026 - nasumičan ?v= daje cf-cache-status: HIT), pa bi zamjena na istoj
   putanji drugom telefonu stizala stara - a uz keš „zauvijek" tako bi i ostala. Stara putanja se briše
   tek kad je nova adresa potvrđena u bazi. */
const MALA_PX = 240;                        // avatar od 68 px na najgušćim ekranima (×3) = 204
const KES_SLIKE = 'cindyland-slike';        // isti keš puni i service worker; preživljava nove verzije app-a
const SLIKA_OPCIJE = { upsert: true, contentType: 'image/jpeg', cacheControl: '31536000' };
const SLIKA_URL = path => CFG.url + '/storage/v1/object/public/slike/' + path;
const putanjaSlike = url => { const m = String(url || '').match(/\/public\/slike\/([^?]+)/); return m ? m[1] : null; };
async function slikaBitmapa(src){
  try { return await createImageBitmap(src); }
  catch (e){
    const u = URL.createObjectURL(src);
    try {
      return await new Promise((res, rej) => {
        const im = new Image();
        im.onload = () => res(im); im.onerror = rej;
        im.src = u;
      });
    } finally { setTimeout(() => URL.revokeObjectURL(u), 2000); }
  }
}
/* smanji na najviše `px` po dužoj strani; `kvadrat` = isječi sredinu u kvadrat (kao object-fit: cover) */
function slikaUJpeg(bmp, px, kvalitet, kvadrat){
  const w = bmp.width || bmp.naturalWidth, h = bmp.height || bmp.naturalHeight;
  const cv = document.createElement('canvas');
  if (kvadrat){
    const s = Math.min(w, h);
    cv.width = cv.height = Math.max(1, Math.min(px, s));
    cv.getContext('2d').drawImage(bmp, (w - s) / 2, (h - s) / 2, s, s, 0, 0, cv.width, cv.height);
  } else {
    const k = Math.min(1, px / Math.max(w, h));
    cv.width = Math.max(1, Math.round(w * k)); cv.height = Math.max(1, Math.round(h * k));
    cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
  }
  return new Promise(r => cv.toBlob(r, 'image/jpeg', kvalitet));
}
/* slika koja je upravo napravljena ide odmah u keš telefona (isti koji koristi service worker) */
async function kesSlikaUpisi(url, blob){
  if (!window.caches || !blob) return;
  try {
    const c = await caches.open(KES_SLIKE);
    await c.put(url, new Response(blob, { headers: { 'Content-Type': 'image/jpeg' } }));
  } catch (e){}
}
async function uploadPetPhoto(petId, file){
  const p = petById(petId); if (!p || !sb) return;
  toast('Slika se šalje…');
  try {
    let bmp = null, velika, mala;
    try {
      bmp = await slikaBitmapa(file);
      velika = await slikaUJpeg(bmp, 700, 0.84, false);
      mala = await slikaUJpeg(bmp, MALA_PX, 0.82, true);
    } finally { if (bmp && bmp.close) bmp.close(); }
    if (!velika || !mala) throw new Error('konverzija');
    const stara = putanjaSlike(p.photo);                       // briše se poslije potvrđenog upisa nove adrese
    const path = 'pets/' + petId + '-' + Date.now() + '.jpg';  // nova putanja - CDN ne gleda ?v= (vidi gore)
    const { error } = await sb.storage.from('slike').upload(path, velika, SLIKA_OPCIJE);
    if (error) throw error;
    /* mala je dodatak: ako ne prođe, `dopuniMaleSlike` je napravi kasnije, a do tada se crta velika */
    const m = await sb.storage.from('slike').upload(fotoMala(path), mala, SLIKA_OPCIJE);
    p.photo = SLIKA_URL(path) + '?v=' + Date.now();
    kesSlikaUpisi(p.photo, velika);
    if (!m.error){ kesSlikaUpisi(fotoMala(p.photo), mala); MALE_OK.add(p.photo); maleOkSnimi(); }
    const upisano = await dbSave('pets', p);
    /* stara slika više nikom ne treba (drugi telefon iz baze dobija novu adresu) - ali samo kad je upis PROŠAO */
    if (upisano && stara && stara !== path) sb.storage.from('slike').remove([stara, fotoMala(stara)]).catch(() => {});
    if (PE){ pePopSync(); renderPetPop(); }     // isto i za karticu ljubimca
    if (CE){ cePopSync(); renderClientPop(); }   // bez sync-a bi se izgubilo ono što je u međuvremenu ukucano
    render();
    toast(upisano ? 'Slika sačuvana.' : 'Slika je poslata, ali upis još nije prošao - pokušaću ponovo.');
  } catch (e){
    toast('Slika nije poslata - pokušaj drugu ili provjeri internet.');
  }
}

/* ============ MALE SLIKE ZA STARE UPISE ============
   Do v1.17 je postojala samo velika slika i ona se crtala i u kvadratu od 42 px - liste su se punile
   sporo, a poslije sata (toliko je trajao keš) sve se skidalo iznova. Novi upload pravi i malu; za stare
   ovo u pozadini provjeri (HEAD) ima li male i, ako nema, povuče veliku, smanji je na telefonu i pošalje
   pod istim imenom + „_s". Ide jedna po jedna, samo dok je app na ekranu i ima mreže; šta je potvrđeno
   pamti se na telefonu po adresi slike (nova slika = nova adresa = nova provjera).
   NIŠTA NE PIŠE U BAZU i nikad ne dira veliku sliku. Dva telefona mogu raditi istovremeno - redoslijed
   je izmiješan da se ne sudaraju, a i sudar je bezopasan (ista slika, upsert). */
const MALE_KLJUC = 'cindyland-male-slike';
let MALE_OK = new Set();
try { MALE_OK = new Set(JSON.parse(localStorage.getItem(MALE_KLJUC) || '[]')); } catch (e){}
function maleOkSnimi(){ try { localStorage.setItem(MALE_KLJUC, JSON.stringify([...MALE_OK])); } catch (e){} }
const pauza = ms => new Promise(r => setTimeout(r, ms));
let maleRadi = false, maleTimer = null;
let MALE_ODGODA = 0;                 // poslije serverske greške (token, kvota, 5xx) dopuna miruje 10 min - ne lupa 117× po zidu
const MALE_PRESKOCI = new Set();     // slike koje se ne mogu obraditi (nema velike, oštećen fajl) - do sljedećeg paljenja app-a
function dopuniMaleSlikeUskoro(){ clearTimeout(maleTimer); maleTimer = setTimeout(dopuniMaleSlike, 4000); }
async function dopuniMaleSlike(){
  if (!sb || maleRadi || OFFLINE || document.hidden || navigator.onLine === false || Date.now() < MALE_ODGODA) return;
  const zive = new Set(D.pets.map(p => p.photo).filter(u => u && putanjaSlike(u) && fotoMala(u) !== u));
  for (const u of [...MALE_OK]) if (!zive.has(u)) MALE_OK.delete(u);   // zamijenjene/obrisane slike
  /* prvo ljubimci koji su danas u pansionu (njihovi avatari su na ekranu i velika im je već u kešu), ostalo izmiješano */
  const danas = new Set();
  try { staysOnDate(todayISO()).forEach(st => (st.petIds || []).forEach(id => danas.add(id))); } catch (e){}
  const prvo = new Set(D.pets.filter(p => danas.has(p.id) && p.photo).map(p => p.photo));
  const red = [...zive].filter(u => !MALE_OK.has(u) && !MALE_PRESKOCI.has(u))
    .sort(() => Math.random() - 0.5).sort((a, b) => (prvo.has(b) ? 1 : 0) - (prvo.has(a) ? 1 : 0));
  maleOkSnimi();
  if (!red.length) return;
  maleRadi = true;
  try {
    for (const u of red){
      if (!sb || document.hidden || navigator.onLine === false) break;
      let stanje = await malaPostoji(u);                        // 'ima' | 'nema' | 'greska'
      if (stanje === 'nema') stanje = await napraviMalu(u);     // 'ima' | 'preskoci' | 'greska'
      if (stanje === 'greska'){ MALE_ODGODA = Date.now() + 10 * 60 * 1000; break; }
      if (stanje === 'preskoci') MALE_PRESKOCI.add(u);
      else { MALE_OK.add(u); maleOkSnimi(); }
      await pauza(300);
    }
  } finally { maleRadi = false; }
}
/* HEAD ne ide kroz service worker (on gleda samo GET), pa je odgovor uvijek sa servera */
async function malaPostoji(u){
  try {
    const r = await fetch(fotoMala(u), { method: 'HEAD', mode: 'cors', cache: 'no-store' });
    if (r.ok) return 'ima';
    return (r.status === 400 || r.status === 404) ? 'nema' : 'greska';   // storage za nepostojeći fajl vraća 400 + not_found
  } catch (e){ return 'greska'; }
}
async function napraviMalu(u){
  let r;
  try { r = await fetch(u, { mode: 'cors' }); } catch (e){ return 'greska'; }   // velika - iz keša ako je već tu
  if (!r.ok) return (r.status === 400 || r.status === 404) ? 'preskoci' : 'greska';   // velike nema - nema šta da se smanji
  let bmp = null, mala = null;
  try { bmp = await slikaBitmapa(await r.blob()); mala = await slikaUJpeg(bmp, MALA_PX, 0.82, true); }
  catch (e){ return 'preskoci'; }
  finally { if (bmp && bmp.close) bmp.close(); }
  if (!mala) return 'preskoci';
  /* upsert: false - dopuna samo PRAVI malu koje nema. Ako ju je u međuvremenu napravio drugi telefon (409),
     ne prepisujemo je: nikad starija verzija preko novije. */
  let rez;
  try { rez = await sb.storage.from('slike').upload(fotoMala(putanjaSlike(u)), mala, { ...SLIKA_OPCIJE, upsert: false }); }
  catch (e){ return 'greska'; }
  if (rez && rez.error){
    if (String(rez.error.statusCode) === '409' || /exist/i.test(rez.error.message || '')) return 'ima';   // već postoji
    return 'greska';
  }
  kesSlikaUpisi(fotoMala(u), mala);
  return 'ima';
}
/* jednom dnevno iz keša izlaze slike kojih više nema (zamijenjena slika, obrisan ljubimac) */
async function ocistiKesSlika(){
  if (!window.caches || !sb || OFFLINE) return;
  const KLJUC = 'cindyland-kes-slike-ciscen';
  let zadnje = 0; try { zadnje = +localStorage.getItem(KLJUC) || 0; } catch (e){}
  if (Date.now() - zadnje < 24 * 3600 * 1000) return;
  try {
    const zive = new Set();
    D.pets.forEach(p => { if (p.photo){ zive.add(p.photo); zive.add(fotoMala(p.photo)); } });
    const c = await caches.open(KES_SLIKE);
    for (const req of await c.keys()) if (!zive.has(req.url)) await c.delete(req);
    localStorage.setItem(KLJUC, String(Date.now()));
  } catch (e){}
}

/* ============ REZERVNA KOPIJA ============ */
</script>
<script>
/* ============ SUPABASE sloj (baza na serveru) ============ */
const DB_MAP = {
  clients: r => ({ id: r.id, name: r.name, phone: r.phone || '', note: r.note || '', blacklist: !!r.blacklist }),
  pets: r => ({ id: r.id, client_id: r.clientId, name: r.name, species: r.species, size: r.size, sex: r.sex, breed: r.breed || '', note: r.note || '', photo: r.photo || null }),
  stays: r => ({ id: r.id, client_id: r.clientId, pet_ids: r.petIds || [], type: r.type, from_date: r.from, to_date: r.to, box_id: r.boxId || null, boxes: r.boxes || null, payments: r.payments || null, arrived_at: r.arrivedAt || null, left_at: r.leftAt || null, price: r.price, deposit: r.deposit == null ? null : r.deposit, paid: !!r.paid, paid_at: r.paidAt, note: r.note || '', created_at: r.createdAt || new Date().toISOString() }),
  boxes: r => ({ id: r.id, name: r.name, grp: r.group, active: !!r.active, sort: r.sort || 0 }),
};
const DB_UNMAP = {
  clients: r => ({ id: r.id, name: r.name, phone: r.phone || '', note: r.note || '', blacklist: !!r.blacklist }),
  pets: r => ({ id: r.id, clientId: r.client_id, name: r.name, species: r.species, size: r.size, sex: r.sex, breed: r.breed || '', note: r.note || '', photo: r.photo || null }),
  /* oznaka avansa (`av`) mora preživjeti put tamo-nazad; stari `deposit` se ovdje prebacuje u uplate (stayIzDepozita) */
  stays: r => stayIzDepozita({ id: r.id, clientId: r.client_id, petIds: r.pet_ids || [], type: r.type, from: r.from_date, to: r.to_date, boxId: r.box_id, boxes: r.boxes || null, payments: (r.payments || null) && r.payments.map(p => p.av ? { a: Number(p.a) || 0, d: p.d, av: 1 } : p.z ? { a: Number(p.a) || 0, d: p.d, z: 1 } : { a: Number(p.a) || 0, d: p.d }), arrivedAt: r.arrived_at || null, leftAt: r.left_at || null, price: r.price == null ? null : Number(r.price), deposit: r.deposit == null ? null : Number(r.deposit), paid: !!r.paid, paidAt: r.paid_at, note: r.note || '', createdAt: r.created_at }),
  boxes: r => ({ id: r.id, name: r.name, group: r.grp, active: !!r.active, sort: r.sort || 0 }),
};

/* ============ UPIS NA SERVER IDE U REDU, JEDAN PO JEDAN ============
   Do v1.15.0 je svaki upis kretao odmah, pa su išli PARALELNO. Kod novog klijenta
   vlasnik i njegov ljubimac kreću u istoj hiljaditinki sekunde (izmjereno: razmak 4-5 ms),
   pa je ljubimac znao stići u bazu PRIJE svog vlasnika. Baza tada odbija ljubimca
   (svaki ljubimac mora imati postojećeg vlasnika), a app je tu grešku samo prećutao -
   ljubimac je ostajao na ekranu dok ga prvo osvježavanje sa servera ne obriše.
   Izmjereno na živim podacima 30.8.2026: 16 od 33 nova klijenta (48%) ostalo je bez
   ljubimca koji je upisan u istom koraku; nijedan ljubimac dodat KASNIJE nije se izgubio.
   Zato sada svi upisi idu jedan za drugim, tačno onim redom kojim su nastali. */
let DB_RED = Promise.resolve();          // red čekanja za upise
const DB_CEKA = new Map();               // 'tabela:id' -> {table, obj/id, del, pao, pokusaja}
const CEKA_KLJUC = 'cindyland-ceka';     // nepotvrđeni upisi preživljavaju gašenje app-a
const CEKA_SAM = 5;                      // poslije toliko neuspjeha app ne pokušava sam - čeka dugme „Pošalji"
const TABELA_1 = { clients: 'Klijent', pets: 'Ljubimac', stays: 'Boravak', boxes: 'Boks', settings: 'Cjenovnik' };
const DB_NIZ = { clients: 'clients', pets: 'pets', stays: 'stays', boxes: 'boxes' };

function dbRed(fn){
  const bez = async () => { try { return await fn(); } catch (e){ return false; } };
  DB_RED = DB_RED.then(bez, bez);
  return DB_RED;
}

/* nepotvrđeni upisi se pamte na telefonu - ako se app ugasi prije nego što upis prođe,
   poslije paljenja ide ponovo (traka na ekranu to i obećava) */
function cekaSnimi(){ try { localStorage.setItem(CEKA_KLJUC, JSON.stringify([...DB_CEKA])); } catch (e){} }
function cekaUcitaj(){
  try {
    const raw = localStorage.getItem(CEKA_KLJUC); if (!raw) return;
    JSON.parse(raw).forEach(([k, u]) => {
      if (!u || !u.table || !(u.obj || u.id)) return;
      /* poslije paljenja app-a nijedan od njih sigurno nije stigao na server -
         svi se broje kao pali, da ih ponoviNesacuvano zaista pošalje */
      u.pao = true; u.pokusaja = 0;
      /* boravak sačuvan u staroj verziji nosi depozit - u novi oblik (avans je uplata) prije ponovnog slanja */
      if (u.table === 'stays' && u.obj && !u.del) stayIzDepozita(u.obj);
      DB_CEKA.set(k, u);
    });
  } catch (e){}
}

/* jedan upis: tri pokušaja (mreža na telefonu ume da zakaže na sekund-dva) + prekid ako zaglavi,
   da jedan zaglavljen upis ne zaustavi cio red */
async function dbPokusaj(napravi){
  let zadnja = null;
  for (let i = 0; i < 3; i++){
    /* ako telefon kaže da nema interneta, ne troši vrijeme na ponavljanje -
       upis ostaje u redu i kreće sam kad se veza vrati */
    if (i && navigator.onLine === false) break;
    if (i) await new Promise(r => setTimeout(r, i === 1 ? 700 : 2000));
    const ctrl = new AbortController();
    const tajmer = setTimeout(() => ctrl.abort(), 20000);
    try {
      const { error } = await napravi(ctrl.signal);
      if (!error) return null;
      zadnja = error;
    } catch (e){ zadnja = e; }
    finally { clearTimeout(tajmer); }
  }
  return zadnja || new Error('neuspjeh');
}

/* upis prošao: skini oznaku SAMO ako je i dalje naša (u međuvremenu je mogao stići noviji upis
   ili brisanje istog reda - njegovu oznaku ne smijemo obrisati) */
function dbUspjeh(unos, key){
  if (DB_CEKA.get(key) === unos){ DB_CEKA.delete(key); cekaSnimi(); }
  return true;
}
/* upis nije prošao: NE brišemo ga iz aplikacije - ostaje u DB_CEKA pa ga
   osvježavanje sa servera ne može obrisati sa ekrana, i pokušavamo ponovo */
function dbNeuspjeh(unos, key, table, brisanje){
  if (DB_CEKA.get(key) === unos){
    unos.pao = true;
    unos.pokusaja = (unos.pokusaja || 0) + 1;
    cekaSnimi();
  }
  const kome = TABELA_1[table] || 'Podatak';
  toast(brisanje ? 'Brisanje nije stiglo na server - pokušaću ponovo.' : kome + ' nije sačuvan na server - pokušaću ponovo.');
  render();
  return false;
}
/* koliko upisa je stvarno palo (ono što je tek krenulo se ne broji, da traka ne treperi) */
function nesacuvanoBroj(){ let n = 0; DB_CEKA.forEach(u => { if (u.pao) n++; }); return n; }

function dbSave(table, obj){
  save();
  if (!sb) return Promise.resolve(true);
  const key = table + ':' + obj.id;
  const unos = { table, obj, del: false };
  DB_CEKA.set(key, unos); cekaSnimi();
  return dbRed(async () => {
    if (!DB_CEKA.has(key)) return true;   // oznaka je u međuvremenu sklonjena (obrisan klijent, spajanje)
    const row = DB_MAP[table] ? DB_MAP[table](obj) : obj;   // uzmi najsvježije stanje
    const err = await dbPokusaj(sig => sb.from(table).upsert(row).abortSignal(sig));
    return err ? dbNeuspjeh(unos, key, table, false) : dbUspjeh(unos, key);
  });
}
function dbKill(table, id){
  save();
  if (!sb) return Promise.resolve(true);
  const key = table + ':' + id;
  const unos = { table, id, del: true };
  DB_CEKA.set(key, unos); cekaSnimi();
  return dbRed(async () => {
    if (!DB_CEKA.has(key)) return true;   // oznaka je u međuvremenu sklonjena (obrisan klijent, spajanje)
    const err = await dbPokusaj(sig => sb.from(table).delete().eq('id', id).abortSignal(sig));
    return err ? dbNeuspjeh(unos, key, table, true) : dbUspjeh(unos, key);
  });
}
/* cjenovnik nema kolonu id - i pamti se SNIMAK cijena, da ponovni pokušaj ne pošalje
   ono što je u međuvremenu stiglo sa servera */
function dbSavePrices(){
  save();
  if (!sb) return Promise.resolve(true);
  return dbSaveCjenovnik(JSON.parse(JSON.stringify(D.prices)));
}
function dbSaveCjenovnik(vrijednost){
  const key = 'settings:prices';
  const unos = { table: 'settings', obj: { id: 'prices', value: vrijednost }, del: false };
  DB_CEKA.set(key, unos); cekaSnimi();
  return dbRed(async () => {
    if (!DB_CEKA.has(key)) return true;   // oznaka je u međuvremenu sklonjena (obrisan klijent, spajanje)
    const err = await dbPokusaj(sig => sb.from('settings').upsert({ key: 'prices', value: vrijednost }).abortSignal(sig));
    return err ? dbNeuspjeh(unos, key, 'settings', false) : dbUspjeh(unos, key);
  });
}

/* ono što još nije potvrđeno sa servera vraćamo u D poslije svakog čitanja -
   inače bi svježe stanje sa servera obrisalo sa ekrana upravo ono što nije stiglo */
function vratiNesacuvano(){
  DB_CEKA.forEach(u => {
    if (u.table === 'settings'){ if (u.obj && u.obj.value) D.prices = normalizePrices(u.obj.value); return; }
    const ime = DB_NIZ[u.table]; if (!ime) return;
    const niz = D[ime];
    if (u.del){ const i = niz.findIndex(x => x.id === u.id); if (i >= 0) niz.splice(i, 1); return; }
    const i = niz.findIndex(x => x.id === u.obj.id);
    if (i >= 0) niz[i] = u.obj; else niz.push(u.obj);
  });
}
/* nov pokušaj za ono što je PALO (ne i za ono što je još u letu - inače bi se red umnožavao).
   rucno = Vesna je pritisnula „Pošalji", tada se broj pokušaja poništava. */
function ponoviNesacuvano(rucno){
  if (!sb || !DB_CEKA.size) return;
  [...DB_CEKA].forEach(([k, u]) => {
    if (!u.pao) return;
    const dosad = u.pokusaja || 0;
    if (!rucno && dosad >= CEKA_SAM) return;
    if (u.table === 'settings') dbSaveCjenovnik(u.obj.value);
    else if (u.del) dbKill(u.table, u.id);
    else dbSave(u.table, u.obj);
    const nov = DB_CEKA.get(k);
    if (nov && nov !== u) nov.pokusaja = rucno ? 0 : dosad;   // brojač pokušaja se prenosi
  });
  cekaSnimi();
}
/* zapisi koje je server već obrisao (kaskadno ili spajanjem) ne smiju ostati u redu -
   nikad ne bi prošli, a traka bi zauvijek stajala */
function cekaZaboravi(kljucevi){
  let dirnuto = false;
  kljucevi.forEach(k => { if (DB_CEKA.delete(k)) dirnuto = true; });
  if (dirnuto) cekaSnimi();
}

let loadTimer = null;
/* Supabase vraća najviše 1000 redova po upitu - čitaj u serijama dok ne stigne sve */
async function fetchAll(table){
  const out = [];
  const CH = 1000;
  for (let from = 0;; from += CH){
    /* .order: bez njega red na granici stranice (1000) može da ispadne ili se udvoji dok drugi telefon upisuje */
    const { data, error } = await sb.from(table).select('*').order(table === 'settings' ? 'key' : 'id').range(from, from + CH - 1);
    if (error) throw error;
    out.push(...data);
    if (data.length < CH) break;
  }
  return out;
}
/* snimak podataka za poređenje „ima li išta novo": po id-u (server redove vraća bilo kojim redom) i u OBLIKU REDA
   SA SERVERA (kroz DB_MAP pa DB_UNMAP: isti redoslijed ključeva, '' umjesto null, brojevi; createdAt kao vrijeme,
   jer lokalno stoji „…Z" a sa servera „…+00:00") - inače bi tek upisan boravak ili ljubimac izgledao drugačije od
   svog odjeka sa servera i izazvao jedno precrtavanje viška sekundu poslije svakog upisa */
function snimakPodataka(){
  const kanon = t => D[DB_NIZ[t]].map(x => {
    const k = DB_UNMAP[t](DB_MAP[t](x));
    if ('createdAt' in k) k.createdAt = x.createdAt ? (Date.parse(x.createdAt) || x.createdAt) : null;
    for (const key in k) if (k[key] === undefined) k[key] = null;
    return k;
  }).sort((a, b) => (a.id < b.id ? -1 : a.id > b.id ? 1 : 0));
  return JSON.stringify([kanon('clients'), kanon('pets'), kanon('stays'), kanon('boxes'), D.prices]);
}
async function loadAll(ponovo){
  if (!sb) return;
  try {
    /* sačekaj da se slegne ono što se upisuje, ali najviše 3 s -
       jedan zaglavljen upis ne smije da zaustavi osvježavanje (nesačuvano čuva vratiNesacuvano) */
    await Promise.race([DB_RED.catch(() => {}), new Promise(r => setTimeout(r, 3000))]);
    const [c, p, s, b, st] = await Promise.all([
      fetchAll('clients'), fetchAll('pets'), fetchAll('stays'), fetchAll('boxes'), fetchAll('settings'),
    ]);
    /* snimak prije/poslije: ako je sa servera stiglo TAČNO ono što već imamo, ekran se ne precrtava.
       Ovo se dešava na svaki povratak u app i poslije svakog sopstvenog upisa (realtime odjek) - precrtavanje
       je slike i ikonice tjeralo da „trepnu", pa je izgledalo kao da se app sam osvježava (Novica, 24.9.2026). */
    const prije = snimakPodataka();
    D.clients = c.map(DB_UNMAP.clients);
    D.pets = p.map(DB_UNMAP.pets);
    D.stays = s.map(DB_UNMAP.stays);
    if (b.length) D.boxes = b.map(DB_UNMAP.boxes);
    const pr = st.find(x => x.key === 'prices');
    if (pr && pr.value) D.prices = normalizePrices(pr.value);
    vratiNesacuvano();
    const bioOffline = OFFLINE;
    OFFLINE = false;
    if (bioOffline || nesacuvanoBroj() !== NES_CRTANO || snimakPodataka() !== prije){   // i traka „X unosa nije stiglo" mora da nestane
      save(); render();
      /* otvorena kartica klijenta i provjera datuma moraju da se preračunaju sa svježim podacima -
         inače bi pokazivale staro stanje dok druga osoba upisuje boravke */
      if (CE && !CE.pitanje){ cePopSync(); renderClientPop(); }
      /* kartica ljubimca se osvježava SAMO u prikazu - u izmjeni bi re-crtanje pojelo kucanje,
         a draft je ionako jači od servera (upisuje se na „Sačuvaj") */
      if (PE && !PE.form) renderPetPop();
      if (PD && sheetOpen && $('#sheetTitle').textContent === 'Provjeri datume') renderDatesCheck();
      /* spisak (grupa, dan, Nenaplaćeno) i pregled upisanog boravka pokazuju svježe stanje; forma se ne dira
         dok se u njoj kuca, a dirana polja ostaju (čuvanje ionako upisuje samo njih) */
      if (sheetOpen && !$('#modalHost').firstChild){
        osvjeziSheet();
        const fokus = document.activeElement && $('#sheetBody').contains(document.activeElement) && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
        if (SF && SF.id && SHEET_CUR && SHEET_CUR.k === 'boravak' && !fokus){
          if (!D.stays.some(x => x.id === SF.id)){ toast('Boravak je u međuvremenu obrisan.'); sheetNazad(true); }
          else if (!sfDirty()){ const o = SF.otv; sfIzBoravka(SF.id, o); renderStayForm(); }
          else renderStayForm();
        }
      }
      if (NM && $('#nmIznos') && !NM.rucno) renderNaplata();
    }
    try { dopuniMaleSlikeUskoro(); ocistiKesSlika(); } catch (e){}   // održavanje slika ne smije da upali traku „nema veze"
  } catch (e){
    /* prvi neuspjeh poslije buđenja je često radio koji se još nije probudio - jedan tihi pokušaj za 2,5 s prije
       trake „nema veze" (koja bi odmah zatim i nestala: još jedno „samo se osvježava") */
    if (!ponovo && navigator.onLine !== false){ clearTimeout(loadTimer); loadTimer = setTimeout(() => loadAll(true), 2500); return; }
    OFFLINE = true; render();
  }
}
function scheduleReload(){
  clearTimeout(loadTimer);
  loadTimer = setTimeout(loadAll, 600);
}
function initRealtime(){
  if (!sb) return;
  try {
    sb.channel('cindy-db')
      .on('postgres_changes', { event: '*', schema: 'public' }, scheduleReload)
      .subscribe();
  } catch (e){}
}

/* demo istorija u lokalnom režimu (prije uključenja servera) */
async function maybeSeedDemo(){
  if (sb) return;
  if (D.stays.length || D.clients.length) return;
  try {
    const res = await fetch('../seed/seed.json');
    if (!res.ok) return;
    const seed = await res.json();
    applySeed(seed);
  } catch (e){}
}
function applySeed(seed){
  D = defaultData();
  let s = D.boxes.length;
  (seed.adhocBoxes || []).forEach(b => D.boxes.push({ id: b.id, name: b.name, group: b.group, active: false, sort: s++ }));
  D.clients = seed.clients.map(c => ({ id: c.id, name: c.name, phone: c.phone || '', note: c.note || '' }));
  D.pets = seed.pets.map(p => ({ id: p.id, clientId: p.clientId, name: p.name, species: p.species, size: p.size, sex: p.sex || null, breed: p.breed || '', note: p.note || '' }));
