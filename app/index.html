const sortedBoxes = () => [...D.boxes].sort((a, b) => (a.sort || 0) - (b.sort || 0));

/* pomoćno mjesto (kavez, transporter) naspram pravog boksa - Vesni i Novici je
   jedino bitno kad se pravi boksevi popune, jer tada sljedeći ide u kavez */
function boxSpare(b){ return /kavez|transport/i.test((b && b.name) || ''); }
function boxShort(b){
  return b.name.replace('Boks ', 'B').replace('Kotilica 2', 'Kot 2').replace('Kotilica', 'Kot').replace('Mali kavez', 'M.kav').replace('Kavez', 'Kav');
}
/* PAŽNJA: isto ime („Boks 1") postoji i među malim i među velikim boksevima i kod mačaka -
   zato se svuda gdje se boks pominje sam za sebe mora reći i grupa. */
function boxFullName(b){
  if (!b) return '?';
  const g = b.group === 'm' ? 'Mačji' : (GROUPS_1[b.group] || '');
  return (g ? g + ' ' : '') + boxShort(b);
}
function petLabel(p){ return p ? (p.name || (p.species === 'macka' ? 'mačka' : 'pas')) : ''; }
function petMeta(p){
  const parts = [];
  parts.push(p.species === 'macka' ? 'mačka' : (p.size === 'veliki' ? 'veliki pas' : 'mali pas'));
  if (p.sex) parts.push(p.sex === 'zenka' ? 'ženka' : 'mužjak');
  if (p.breed) parts.push(p.breed);
  return parts.join(' · ');
}
function stayLabel(st){
  const pets = petsOfStay(st);
  if (pets.length) return pets.map(petLabel).join(', ');
  const c = clientById(st.clientId);
  return c ? c.name : '?';
}
function stayCovers(st, iso){ return st.from <= iso && iso <= st.to; }
function staysOnDate(iso){ return D.stays.filter(st => stayCovers(st, iso)); }
function overlap(st, from, to){ return st.from <= to && from <= st.to; }

/* ---- MJESTO (BOKS) ----
   Boravak NIJE vezan za jedan boks: st.boxes je niz perioda [{b,f,t}] pa se ljubimac
   može premjestiti usput. Stari zapisi imaju samo st.boxId - to je jedan period. */
function stayBoxes(st){
  let segs = (st.boxes && st.boxes.length ? st.boxes : (st.boxId ? [{ b: st.boxId, f: st.from, t: st.to }] : []))
    .filter(s => s && s.b)
    /* period boksa ne može van termina boravka (ako se boravak skrati, skraćuje se i boks) */
    .map(s => ({ b: s.b, f: (s.f || st.from) < st.from ? st.from : (s.f || st.from), t: (s.t || st.to) > st.to ? st.to : (s.t || st.to) }))
    .filter(s => s.f <= s.t)
    .sort((a, b) => a.f.localeCompare(b.f));
  if (!segs.length) return segs;
  /* uzastopni periodi ISTOG boksa su jedan period (stalni gost mjesecima u istom boksu) */
  const spojeni = [];
  for (const s of segs){
    const last = spojeni[spojeni.length - 1];
    if (last && last.b === s.b && addDays(last.t, 1) >= s.f){ if (s.t > last.t) last.t = s.t; }
    else spojeni.push(s);
  }
  segs = spojeni;
  /* period se prekida kad počne sljedeći (bez preklapanja); prazni ispadaju */
  for (let i = 0; i < segs.length - 1; i++){
    const nextF = segs[i + 1].f;
    if (segs[i].t >= nextF) segs[i].t = addDays(nextF, -1);
  }
  segs = segs.filter(s => s.f <= s.t);
  if (!segs.length) return segs;
  /* prvi počinje sa dolaskom, posljednji traje do odlaska (bez rupa na krajevima) */
  segs[0].f = st.from;
  segs[segs.length - 1].t = st.to;
  return segs;
}
function boxOn(st, iso){
  for (const s of stayBoxes(st)) if (s.f <= iso && iso <= s.t) return s.b;
  return null;
}
/* STVARNO držanje boksa: DAN ODLASKA JE ZAUZET, boks se nudi slobodan tek SJUTRADAN.
   Štrik „Otišao" skida ljubimca sa spiska prisutnih i pamti trenutak odlaska, ali NE prazni
   boks tog dana: pas je do 11. i štrikne se Otišao - boks je slobodan od 12.
   Isto i kad ode prije kraja termina: štrik 9. znači slobodan od 10.
   Zato se siječe ZAKLJUČNO sa leftAt, ne na leftAt-1.
   Traženje Vesne i Novice 5.8.2026. NE vraćati na staro bez njihove riječi. */
function stayBoxesLive(st){
  const segs = stayBoxes(st);
  if (!st.leftAt) return segs;
  const end = st.leftAt;
  return segs.map(s => ({ b: s.b, f: s.f, t: s.t > end ? end : s.t })).filter(s => s.f <= s.t);
}
function boxOnLive(st, iso){
  for (const s of stayBoxesLive(st)) if (s.f <= iso && iso <= s.t) return s.b;
  return null;
}
/* „glavni" boks boravka: onaj koji važi danas, inače prvi upisani */
function stayBoxId(st){
  const segs = stayBoxes(st);
  if (!segs.length) return null;
  return boxOn(st, todayISO()) || segs[0].b;
}
function stayHoldsBox(st, boxId, from, to){
  return stayBoxesLive(st).some(s => s.b === boxId && s.f <= to && from <= s.t);
}
function boxStays(boxId, from, to, exceptId){
  return D.stays.filter(st => st.id !== exceptId && stayHoldsBox(st, boxId, from, to));
}
/* zauzetost SVIH bokseva u periodu u jednom prolazu (za listu bokseva u formi) */
function boxUsage(from, to, exceptId){
  const map = {};
  D.stays.forEach(st => {
    if (st.id === exceptId || !overlap(st, from, to)) return;
    stayBoxesLive(st).forEach(seg => {
      const a = seg.f > from ? seg.f : from, b = seg.t < to ? seg.t : to;
      if (a > b) return;
      const m = map[seg.b] = map[seg.b] || { days: new Set(), first: null, who: '' };
      for (let iso = a; iso <= b; iso = addDays(iso, 1)) m.days.add(iso);
      if (!m.first || a < m.first){ m.first = a; m.who = stayLabel(st); }
    });
  });
  return map;
}
/* slobodni razmaci jednog boksa unutar termina (za padajući meni i za Provjeri datume) */
function boxFreeRanges(boxId, from, to, use){
  const busy = use && use[boxId] ? use[boxId].days : null;
  const out = [];
  for (let iso = from; iso <= to; iso = addDays(iso, 1)){
    if (busy && busy.has(iso)) continue;
    const last = out[out.length - 1];
    if (last && addDays(last.to, 1) === iso) last.to = iso;
    else out.push({ from: iso, to: iso });
  }
  return out;
}
/* „od tad do tad je slobodan" - kratko koliko može, a precizno */
function freeRangesLabel(ranges, from, to){
  if (!ranges.length) return 'zauzet';
  if (ranges.length === 1 && ranges[0].from === from && ranges[0].to === to) return '';
  /* uvijek pun raspon: „slobodan 06.05.-13.05." se ne može pročitati kao „slobodan od 06.05." */
  const dio = ranges.slice(0, 3).map(r => r.from === r.to ? fmtD(r.from) : fmtD(r.from) + '-' + fmtD(r.to)).join(', ');
  const samo = ranges.length === 1 && ranges[0].from === ranges[0].to ? 'samo ' : '';
  return 'slobodan ' + samo + dio + (ranges.length > 3 ? '…' : '');
}

/* ---- DOLAZAK / ODLAZAK ----
   Štrik u Danas upisuje arrivedAt/leftAt. Za ranije dane se podrazumijeva
   da je stigao/otišao (stara evidencija nema štrikove). */
function stayArrived(st, t){ t = t || todayISO(); return !!st.arrivedAt || st.from < t; }
function stayLeft(st, t){ t = t || todayISO(); return !!st.leftAt || st.to < t; }
function stayHere(st, t){ t = t || todayISO(); return stayCovers(st, t) && stayArrived(st, t) && !stayLeft(st, t); }
/* KO JE U PANSIONU NA DAN X - JEDINI račun, pitaju ga i Danas i kalendar i dan iz kalendara.
   Ranije je svaki ekran računao po svome (kalendar je brojao BORAVKE iz termina, Danas LJUBIMCE
   sa štrikovima) pa su za isti dan pokazivali različite brojeve.
   Danas vrijede štrikovi Došao/Otišao; za ostale dane vrijedi termin, a dan odlaska se broji. */
function stayHereOn(st, iso){
  if (!stayCovers(st, iso)) return false;
  if (iso === todayISO()) return stayHere(st, iso);
  if (st.arrivedAt && st.arrivedAt > iso) return false;
  if (st.leftAt && st.leftAt < iso) return false;
  return true;
}
/* broj LJUBIMACA u pansionu na dan X (boravak sa dva psa vrijedi dva) */
function petsHereOn(iso){ return staysOnDate(iso).reduce((n, st) => stayHereOn(st, iso) ? n + stayPets(st) : n, 0); }
/* broji SAMO ljubimce koji stvarno postoje u imeniku - u starim zapisima zna ostati
   upisan ljubimac koji je u međuvremenu obrisan, pa bi brojčanik pokazivao više nego što jeste */
function stayPets(st){ return Math.max(petsOfStay(st).length, 1); }
/* kojoj grupi boravak pripada danas: po boksu, a ako boks nije određen - po vrsti ljubimca */
function stayGroup(st, iso){
  const b = boxById(boxOn(st, iso));
  if (b) return b.group;
  const pets = petsOfStay(st);
  if (pets.length && pets.every(p => p.species === 'macka')) return 'm';
  if (pets.some(p => p.species !== 'macka' && p.size === 'veliki')) return 'vb';
  return 'mb';
}

function stayStatus(st){
  const t = todayISO();
  if (st.leftAt || t > st.to) return 'done';
  if (t < st.from || !stayArrived(st, t)) return 'rez';
  return 'in';
}
/* Plaća se NOĆENJE: 25. do 31. = 6 noćenja. Dolazak i odlazak istog dana = dnevno čuvanje. */
/* kraj boravka: prijevremeni odlazak (štrik Otišao prije rezervisanog dana) završava boravak tog dana.
   Rezervisani `to` ostaje sačuvan, pa „poništi" odlazak vraća sve kako je bilo. */
function stayKraj(st){ return st.leftAt && st.leftAt < st.to && st.leftAt >= st.from ? st.leftAt : st.to; }
function stayNights(st){ return st.type === 'dnevni' ? 0 : Math.max(0, diffDays(st.from, stayKraj(st))); }
function plural(n, a, b, c){ return n % 10 === 1 && n % 100 !== 11 ? a : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14) ? b : c); }
function nightsLabel(n){ return n ? n + ' ' + plural(n, 'noćenje', 'noćenja', 'noćenja') : 'bez noćenja'; }
function stayLenLabel(st){ return st.type === 'dnevni' ? 'dnevno čuvanje' : nightsLabel(stayNights(st)); }

/* ---- NAPLATE ----
   Niz naplata sa datumima (stalni gosti plaćaju mjesečno) - Zarada po mjesecima ostaje tačna.
   AVANS (od v1.19.0, ranije „depozit") je OBIČNA UPLATA sa oznakom `av: 1` i datumom kad je primljen:
   ulazi u Finansije tog dana i oduzima se od ukupnog kao svaka druga uplata. Ranije je stajao samo u
   koloni `deposit` i nigdje se nije brojao kao naplaćen novac (Novica, 25.10.2026). */
function stayPayments(st){
  if (st.payments && st.payments.length) return st.payments.map(p => p.av ? { a: Number(p.a) || 0, d: p.d || st.from, av: 1 }
    : p.z ? { a: Number(p.a) || 0, d: p.d || st.to, z: 1 } : { a: Number(p.a) || 0, d: p.d || st.to });
  if (st.paid && Number(st.price) > 0) return [{ a: Number(st.price), d: st.paidAt || st.to }];
  return [];
}
function stayPaidSum(st){ return stayPayments(st).reduce((s, p) => s + p.a, 0); }
function stayAvans(st){ return stayPayments(st).filter(p => p.av).reduce((s, p) => s + p.a, 0); }
function stayAvansDatum(st){ const p = stayPayments(st).find(x => x.av); return p ? p.d : null; }
/* stari zapis: avans u koloni `deposit` -> prebaci ga u uplate (pri učitavanju; upisuje se sa prvim čuvanjem).
   Duplikat: ako uplate VEĆ pokrivaju depozit, a depozit + uplate prelaze dogovorenu cijenu, isti novac je bio
   upisan i kao uplata (tako je rađeno dok se depozit nije brojao) - ne dodaje se drugi put.
   Stara verzija app-a (dok se drugi telefon ne ažurira) pri čuvanju briše oznaku `av` iz uplata: uplata
   primljena PRIJE dana dolaska je avans po definiciji, pa joj se oznaka vraća. Kolona `deposit` ostaje prazna. */
function stayIzDepozita(st){
  const dep = Number(st.deposit) || 0;
  st.deposit = null;
  let pays = (st.payments || []).map(p => ({ ...p }));
  const imaloAvans = pays.some(p => p.av);           // stanje KAKVO JE STIGLO, prije vraćanja oznake
  let vraceno = false;
  if (pays.length && !imaloAvans && st.from){
    pays = pays.map(p => p.d && p.d < st.from ? (vraceno = true, { ...p, av: 1, vr: 1 }) : p);
  }
  const zavrsi = () => { pays.forEach(p => delete p.vr); if (vraceno || pays.some(p => p.av)) st.payments = pays.length ? pays : null; return st; };
  if (dep <= 0) return zavrsi();
  /* stara verzija je upisala isti iznos i kao uplatu (bez oznake) - to JE avans, samo mu vrati oznaku */
  const isti = pays.find(p => (!p.av || p.vr) && Math.abs((Number(p.a) || 0) - dep) < 0.01 && p.d && p.d <= st.from);
  if (isti){ isti.av = 1; return zavrsi(); }
  if (imaloAvans) return zavrsi();
  const placeno = pays.reduce((s, p) => s + (Number(p.a) || 0), 0);
  if (st.price != null && placeno + 0.01 >= dep && dep + placeno > Number(st.price) + 0.01) return zavrsi();
  /* datum avansa = kad je boravak upisan (tada je avans i primljen); bez tog podatka - dan dolaska.
     Bez `pad`/`isoFromDate`: ovo se zove i iz loadLocal() dok se ostatak skripte još nije učitao. */
  let d = st.from;
  const dt = st.createdAt ? new Date(st.createdAt) : null;
  if (dt && !isNaN(dt)) d = dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
  pays = [{ a: dep, d: d || st.from, av: 1 }].concat(pays);
  return zavrsi();
}
/* dug iz stare evidencije: bez dogovorene cijene, bez ijedne uplate, završen prije više od 45 dana.
   Iznos bi bio samo predračun (Excel je bilježio samo dio naplata), pa se ne sabira u „Duguje ukupno". */
function stayStariDug(st){ return st.price == null && !stayPayments(st).length && stayKraj(st) < addDays(todayISO(), -45); }
/* stanje novca boravka - JEDAN račun za sve ekrane (Danas, kartice, Finansije) */
function stayNovac(st){
  const ukupno = stayAmount(st) || 0;
  const placeno = stayPaidSum(st);
  const ostalo = Math.max(0, Math.round((ukupno - placeno) * 100) / 100);
  const zavrsen = stayLeft(st);
  return { ukupno, placeno, avans: stayAvans(st), ostalo, zavrsen, naplaceno: !!st.paid || (zavrsen && ostalo <= 0 && (placeno > 0 || ukupno > 0)) };
}

/* cjenovnik kao na cindyland.me: po kategoriji, sa cijenom za dva u istom boksu, 10+ noći i mjesečnom.
   Mjesečna tarifa od 30 noćenja je ISPRAVNA - Vesna i Novica potvrdili 31.7.2026.
   (prvo prijavile kao grešku za Sanju Redzepagic pa se sjetile da mjesečna postoji - NE dirati). */
function petCat(p){ return p.species === 'macka' ? 'macka' : (p.size === 'veliki' ? 'veliki' : 'mali'); }
function catAmount(c, nights, pair){
  if (nights >= 30) return (pair ? c.parMj : c.mj) * nights / 30;
  if (nights >= 10) return nights * (pair ? c.par10 : c.dan10);
  return nights * (pair ? c.par : c.dan);
}
function estimateFor(petsArr, type, from, to){
  if (!petsArr.length) return 0;
  if (type === 'dnevni') return petsArr.length * D.prices.dnevni;
  if (!from || !to || to < from) return 0;
  const nights = diffDays(from, to);
  if (nights <= 0) return petsArr.length * D.prices.dnevni;   // došao i otišao istog dana
  const cnt = { mali: 0, veliki: 0, macka: 0 };
  petsArr.forEach(p => cnt[petCat(p)]++);
  let total = 0;
  for (const k of ['mali', 'veliki', 'macka']){
    const c = D.prices[k];
    total += Math.floor(cnt[k] / 2) * catAmount(c, nights, true) + (cnt[k] % 2) * catAmount(c, nights, false);
  }
  return Math.round(total);
}
function stayEstimate(st){ return estimateFor(petsOfStay(st), st.type, st.from, stayKraj(st)); }
function stayAmount(st){ return st.price != null ? st.price : stayEstimate(st); }
/* ===== slike ljubimaca: mala za avatare, velika za uvećan prikaz =====
   Velika (do 700 px, ~170 KB) se do v1.17 crtala i u kvadratu od 42 px - zato su se liste sporo punile.
   Od v1.18 svaki upload pravi i malu (240×240, ~12 KB) pod istim imenom + „_s"; za stare upise malu u
   pozadini dopuni `dopuniMaleSlike`. Ako male (još) nema, `data-velika` je zamjena: service worker sam
   podmetne veliku, a bez njega (prvo otvaranje, privatni režim) to uradi slušač `error` na dokumentu. */
const fotoMala = url => url ? String(url).replace(/\.jpg(\?|$)/, '_s.jpg$1') : url;
function fotoImg(url, extra){
  const m = fotoMala(url);
  return `<img src="${esc(m)}"${m !== url ? ` data-velika="${esc(url)}"` : ''} alt=""${extra ? ' ' + extra : ''}>`;
}
function groupAvatar(st){
  const pets = petsOfStay(st);
  const b = boxById(stayBoxId(st));
  const withPhoto = pets.find(p => p.photo);
  const isCat = pets.length ? pets.every(p => p.species === 'macka') : (b && b.group === 'm');
  const isBig = pets.length ? pets.some(p => p.species === 'pas' && p.size === 'veliki') : (b && b.group === 'vb');
  const cls = isCat ? 'av-m' : (isBig ? 'av-vb' : 'av-mb');
  return `<div class="row-av ${cls}">${withPhoto ? fotoImg(withPhoto.photo, 'loading="lazy"') : (isCat ? I.cat : I.dog)}</div>`;
}
function petAvatar(p){
  const cls = p.species === 'macka' ? 'av-m' : (p.size === 'veliki' ? 'av-vb' : 'av-mb');
  return `<div class="row-av ${cls}">${p.photo ? fotoImg(p.photo, 'loading="lazy"') : (p.species === 'macka' ? I.cat : I.dog)}</div>`;
}
function boxBadge(st, short){
  const segs = stayBoxes(st);
  if (!segs.length) return '<span class="badge b-warn">bez boksa</span>';
  const b = boxById(stayBoxId(st));
  if (!b) return '';
  const more = segs.length > 1 ? `<span class="badge b-line bdg-swap" title="mijenja boks tokom boravka">${I.swap}</span>` : '';
  const txt = short ? GROUPS_1[b.group] + ' ' + boxShort(b) : GROUPS_1[b.group] + ' · ' + b.name;
  return `<span class="badge b-${b.group}">${esc(txt)}</span>${more}`;
}
</script>
<script>
/* ============ render okvira ============ */
let TAB = 'danas';
let CAL_YM = todayISO().slice(0, 7);
let CAL_VIEW = localStorage.getItem('cindyland-calview') || 'mreza';
let ZAR_YM = todayISO().slice(0, 7);
let KL_Q = '', KL_ALL = false;
let KL_MERGE = null; // objedinjavanje klijenata: { baseId, sel: Set }
let OFFLINE = false;

const TABS = [
  { id: 'danas', lbl: 'Danas', ico: I.home },
  { id: 'kalendar', lbl: 'Kalendar', ico: I.cal },
  { id: 'klijenti', lbl: 'Klijenti', ico: I.people },
  { id: 'zarada', lbl: 'Finansije', ico: I.euro },
  { id: 'jos', lbl: 'Profil', ico: I.gear },
];

function setTab(t){ if (TAB !== t){ KL_ALL = false; KL_MERGE = null; if (t === 'kalendar') KAL_DANAS = true; } TAB = t; render(); window.scrollTo(0, 0); }

let KAL_DANAS = false;   // sljedeće crtanje tabele Boksevi skroluje na današnji red (ulazak u tab, promjena prikaza, „danas")
let NES_CRTANO = 0;   // koliko nesačuvanih upisa je pokazao posljednji render - loadAll po tome zna kad traka mora da ode
function render(){
  if (!APP_SHOWN) return; // dok je prijava/nova šifra na ekranu, ne diraj UI aplikacije
  renderTopbar();
  renderTabbar();
  const v = $('#view');
  /* ako se kuca u pretrazi dok stigne tuđa izmjena, fokus i kursor se vraćaju (inače tastatura padne) */
  const akt = document.activeElement;
  const fokus = akt && akt.id === 'klSearch' && v.contains(akt) ? [akt.selectionStart, akt.selectionEnd] : null;
  if (TAB === 'danas') v.innerHTML = vDanas();
  else if (TAB === 'kalendar'){
    const w0 = $('.bgrid-wrap'), sk = w0 && !KAL_DANAS ? [w0.scrollTop, w0.scrollLeft] : null;
    v.innerHTML = vKalendar();
    if (sk){ const w1 = $('.bgrid-wrap'); if (w1){ w1.scrollTop = sk[0]; w1.scrollLeft = sk[1]; } }
    if (KAL_DANAS && CAL_VIEW === 'grid'){
      requestAnimationFrame(() => {
        const w = $('.bgrid-wrap'), r = $('.today-row'), h = $('.bgrid thead');
        if (w && r) w.scrollTop = Math.max(0, r.offsetTop - (h ? h.offsetHeight : 0) - 4);
      });
    }
    KAL_DANAS = false;
  }
  else if (TAB === 'klijenti') v.innerHTML = vKlijenti();
  else if (TAB === 'zarada') v.innerHTML = vZarada();
  else v.innerHTML = vJos();
  /* upis koji nije stigao na server stoji na SVAKOM ekranu (upisuje se i sa Kalendara
     i iz kartice klijenta) - podatak je sačuvan na telefonu i šalje se ponovo */
  const nes = nesacuvanoBroj();
  NES_CRTANO = nes;
  if (nes) v.insertAdjacentHTML('afterbegin', `<div class="banner ban-warn">${I.warn}
    <span style="flex:1"><b class="num">${nes}</b> ${plural(nes, 'unos', 'unosa', 'unosa')} ${plural(nes, 'nije stigao', 'nisu stigla', 'nije stiglo')} na server. ${nes === 1 ? 'Čuvam ga' : 'Čuvam ih'} na telefonu i šaljem ponovo.</span>
    <button class="btn btn-primary btn-sm" data-act="sync-ponovi">Pošalji</button></div>`);
  if (fokus){ const el = $('#klSearch'); if (el){ el.focus({ preventScroll: true }); try { el.setSelectionRange(fokus[0], fokus[1]); } catch (e){} } }
  /* u Klijentima nema dugmeta - tu se pretražuje i sređuje spisak, ne upisuju boravci */
  const show = (TAB === 'danas' || TAB === 'kalendar') && !KL_MERGE;
  $('#fabWrap').style.display = show ? 'flex' : 'none';
  if (!show) fabClose();
}

/* dugme + : na dodir izlaze dvije radnje, ponovni dodir (ili klik pored) ih sklanja */
function fabSet(on){
  const w = $('#fabWrap'); if (!w) return;
  w.classList.toggle('open', on);
  $('#fabScrim').classList.toggle('on', on);
  $('#fab').setAttribute('aria-expanded', on ? 'true' : 'false');
}
function fabClose(){ fabSet(false); }
function fabToggle(){ fabSet(!$('#fabWrap').classList.contains('open')); }
let TOPBAR_KLJUC = '', TABBAR_KLJUC = '';   // šta je posljednji put nacrtano - isti sadržaj se ne crta ponovo (logo/ikonice ne trepću)
function renderTopbar(){
  const kljuc = TAB + '|' + todayISO();
  if (kljuc === TOPBAR_KLJUC) return;
  TOPBAR_KLJUC = kljuc;
  const titles = { kalendar: 'Kalendar', klijenti: 'Klijenti', zarada: 'Finansije', jos: 'Profil' };
  if (TAB === 'danas'){
    $('#topbar').innerHTML = `<div class="brand-top">
      <img src="logo.png" alt="Cindyland" width="560" height="380">
      <div class="brand-date" style="text-transform:capitalize">${DOWS[dowIdx(todayISO())]}, ${fmtDY(todayISO())}</div>
    </div>`;
    return;
  }
  $('#topbar').innerHTML = `<h1 class="topbar-title">${titles[TAB]}</h1>`;
}
function renderTabbar(){
  const kljuc = TAB + '|' + (PWA.needRefresh ? 1 : 0);
  if (kljuc === TABBAR_KLJUC) return;
  TABBAR_KLJUC = kljuc;
  $('#tabbar').innerHTML = `
    <div class="side-head"><span class="paw">${I.paw}</span>Cindyland</div>
    <button class="side-add" data-act="stay-new">${I.plus} Dodaj boravak</button>
    <button class="side-add alt" data-act="dates-check">${I.cal} Provjeri datume</button>` +
    TABS.map(t => `
    <button class="tab ${TAB === t.id ? 'active' : ''}" data-act="tab" data-id="${t.id}" aria-label="${t.lbl}">
      ${t.ico}<span class="tab-lbl">${t.lbl}</span>
      ${t.id === 'jos' && PWA.needRefresh ? '<span class="tab-dot"></span>' : ''}
    </button>`).join('') +
    `<div class="side-foot num">${APP_VERSION}</div>`;
}

/* ============ DANAS ============
   Redizajn 25.10.2026: brojčanik + tri pločice (ljubimaca u grupi i SLOBODNO boksova - Vesni i Novici broj
   boksa ne znači ništa, bitno je ima li mjesta), pa Dolaze / Odlaze / Ostaju. „Ostaju" su samo oni koji danas NE
   odlaze - ranije je „U pansionu" ponavljao sve iz „Danas napuštaju". Odlaze (neispraćeni) + Ostaju = brojčanik. */
function vDanas(){
  const t = todayISO();
  const all = staysOnDate(t);
  const arrivals = all.filter(st => st.from === t && !stayArrived(st, t));
  /* odlasci koji još nisu ispraćeni idu gore; ispraćeni koji duguju ostaju na dnu, prigušeni */
  const departures = all.filter(st => st.to === t && !stayLeft(st, t));
  /* ispraćen i naplaćen = nestaje sa početne (Novica 26.10.2026); ostaje samo ko je otišao a duguje, sa „Naplati X €"
     (i prijevremeni odlazak - rezervisan duže, otišao danas) */
  const ispraceni = all.filter(st => st.leftAt === t && !stayNovac(st).naplaceno);
  const here = all.filter(st => stayHere(st, t));
  const ostaju = here.filter(st => st.to > t);

  /* slobodno = boksovi bez ikoga (i onaj ko danas dolazi a nije štriknut, i onaj ko je danas otišao drže boks do kraja dana) */
  const use = boxUsage(t, t, null);
  const groups = ['mb', 'vb', 'm'].map(g => {
    const act = D.boxes.filter(b => b.active && b.group === g);
    const used = act.filter(b => use[b.id] && use[b.id].days.has(t)).length;
    const petsN = here.filter(st => stayGroup(st, t) === g).reduce((s, st) => s + stayPets(st), 0);
    return { g, slobodno: Math.max(0, act.length - used), petsN };
  });
  const petCount = petsHereOn(t);   // isti račun kao ćelija kalendara

  const tmr = addDays(t, 1);
  const tmrIn = D.stays.filter(st => st.from === tmr).length;
  const tmrOut = D.stays.filter(st => st.to === tmr).length;

  let html = '';
  if (OFFLINE) html += `<div class="banner ban-warn">${I.warn}<span>Nema veze sa serverom - prikazujem posljednje poznato stanje.</span></div>`;
  /* nova verzija se vidi i ovdje, ne samo u Profilu (u Profil rijetko ulaze) */
  if (PWA.needRefresh) html += `<div class="banner ban-upd">${I.refresh}
    <span style="flex:1">Nova verzija${PWA.newVer ? ' <b class="num">' + esc(PWA.newVer) + '</b>' : ''} je spremna.</span>
    <button class="btn btn-primary btn-sm" data-act="upd-apply">Osvježi</button></div>`;

  const GR_KRATKO = { mb: 'Mali', vb: 'Veliki', m: 'Mačke' };
  html += `<div class="card">
    <div class="hero-top">
      <div>
        <div class="hero-lbl">U pansionu danas</div>
        <div class="hero-num num">${petCount}<small>${' ' + plural(petCount, 'ljubimac', 'ljubimca', 'ljubimaca')}</small></div>
      </div>
      <span class="hero-paw">${I.paw}</span>
    </div>
    <div class="gtiles">
      ${groups.map(f => `<button class="gtile" data-act="group-open" data-id="${f.g}" aria-label="${GROUPS[f.g]}">
        <span class="gtile-ico" style="background:var(--${f.g}-soft);color:var(--${f.g})">${f.g === 'm' ? I.cat : I.dog}</span>
        <span class="gtile-n num" style="color:var(${f.petsN ? '--' + f.g : '--muted'})">${f.petsN}</span>
        <span class="gtile-ime">${GR_KRATKO[f.g]}</span>
        <span class="gtile-sl num">${f.slobodno ? 'slobodno ' + f.slobodno : 'puno'}</span>
      </button>`).join('')}
    </div>
    ${(tmrIn || tmrOut) ? `<button class="hero-sjutra" data-act="day-open" data-id="${tmr}">Sjutra: ${tmrIn ? tmrIn + ' ' + plural(tmrIn, 'dolazak', 'dolaska', 'dolazaka') : ''}${tmrIn && tmrOut ? ' · ' : ''}${tmrOut ? tmrOut + ' ' + plural(tmrOut, 'odlazak', 'odlaska', 'odlazaka') : ''}<span class="chev" style="width:16px;height:16px">${I.chev}</span></button>` : ''}
  </div>`;

  if (!all.length){
    html += `<div class="card"><div class="empty">${I.paw}Danas nema nikoga u pansionu.</div>
      <button class="btn btn-primary btn-block" data-act="stay-new" style="margin-top:4px">${I.plus} Dodaj boravak</button></div>`;
    return html;
  }
  /* svuda se broje LJUBIMCI (dva psa u jednom boksu su dva) da se brojevi slažu sa brojčanikom */
  const brojLj = arr => arr.reduce((s, st) => s + stayPets(st), 0);
  if (arrivals.length) html += `<div class="sec-title">Dolaze <span class="cnt num">${brojLj(arrivals)}</span></div>
    <div class="card">${arrivals.map(st => stayRowHTML(st, 'in')).join('')}</div>`;
  if (departures.length || ispraceni.length) html += `<div class="sec-title">Odlaze <span class="cnt num">${brojLj(departures)}</span></div>
    <div class="card">${departures.map(st => stayRowHTML(st, 'out')).join('')}${ispraceni.map(st => stayRowHTML(st, 'out')).join('')}</div>`;
  if (ostaju.length) html += `<div class="sec-title">Ostaju <span class="cnt num">${brojLj(ostaju)}</span></div>
    <div class="card">${ostaju.map(st => stayRowHTML(st)).join('')}</div>`;
  return html;
}

/* dugme pored reda: potvrda dolaska / odlaska (mora izgledati kao dugme, ne kao status) */
function tickHTML(act, id, label){
  const out = act === 'stay-left';
  return `<button class="tick ${out ? 'tick-out' : 'tick-in'}" data-act="${act}" data-id="${id}">
    <span class="tick-ico">${out ? I.out : I.in}</span><span class="tick-lbl">${label}</span></button>`;
}
function stayRowHTML(st, mode, iso){
  const c = clientById(st.clientId);
  const t = todayISO();
  const danas = !iso || iso === t;   // štrik Došao/Otišao samo za današnji dan
  let side = '';
  const novac = stayNovac(st);
  let gotov = false;
  /* desno uvijek JEDNA stvar (dugme ili jedna značka) - redovi iste visine; „plaćeno" ide u red ispod imena */
  let placenoMeta = false;
  if (mode === 'out' && danas){
    gotov = stayLeft(st, t);
    if (gotov) side = novac.naplaceno ? `<span class="badge b-ok">${I.check} naplaćeno</span>`
      : novac.ostalo > 0 ? `<button class="badge b-warn badge-btn" data-act="charge" data-id="${st.id}">Naplati ${money(novac.ostalo)}</button>` : '';
    else { side = tickHTML('stay-left', st.id, 'Otišao'); placenoMeta = novac.ostalo <= 0 && novac.placeno > 0; }
  } else if (mode === 'in' && danas){
    side = tickHTML('stay-arrived', st.id, 'Došao');
  } else if (mode === 'out'){
    side = novac.naplaceno ? `<span class="badge b-ok">${I.check} naplaćeno</span>` : `<span class="badge b-line">odlazak</span>`;
  } else if (mode === 'in'){
    side = `<span class="badge b-line">dolazak</span>`;
  } else {
    side = `<span class="badge b-line num">do ${fmtD(st.to)}</span>`;
  }
  /* boks ide prvi da se uvijek vidi; datum je kratak jer se drugi kraj vidi iz same liste */
  const who = c && c.name !== stayLabel(st) ? c.name : '';
  const dat = gotov ? 'otišao'
    : st.type === 'dnevni' ? 'dnevno čuvanje'
    : mode === 'in' ? 'do ' + fmtD(st.to)
    : mode === 'out' ? 'od ' + fmtD(st.from)
    : 'od ' + fmtD(st.from);
  /* plaćen a još nije ispraćen: umjesto „od 20.10." stoji zelena kvačica (desno je samo dugme Otišao) */
  const meta = [placenoMeta ? '' : dat, who].filter(Boolean).join(' · ');

function calMrezaHTML(){
  const t = todayISO();
  const dim = daysInMonth(CAL_YM);
  const startBlank = dowIdx(CAL_YM + '-01');
  let cells = '';
  for (let i = 0; i < startBlank; i++) cells += '<div class="cal-cell blank"></div>';
  for (let d = 1; d <= dim; d++){
    const iso = CAL_YM + '-' + pad(d);
    /* ko je otišao prije ovog dana ne stoji više na njemu */
    const stays = staysOnDate(iso).filter(st => !(st.leftAt && st.leftAt < iso));
    const hasIn = stays.some(st => st.from === iso);
    const hasOut = stays.some(st => st.to === iso);
    /* isti broj kao „U pansionu" na Danas - oba idu kroz petsHereOn */
    const koliko = petsHereOn(iso);
    cells += `<div class="cal-cell ${iso === t ? 'today' : ''} ${iso < t ? 'past' : ''}" data-act="day-open" data-id="${iso}">
      <span class="cal-num num">${d}</span>
      <span class="cal-cnt num ${koliko ? '' : 'zero'}">${koliko}</span>
      <span class="cal-dots">${hasIn ? '<i style="background:var(--ok)"></i>' : ''}${hasOut ? '<i style="background:var(--mb)"></i>' : ''}</span>
    </div>`;
  }
  const dows = DOWS_S.map((d, i) => `<div class="cal-dow ${i === 6 ? 'ned' : ''}">${d}</div>`).join('');
  return `<div class="cal-grid">${dows}${cells}</div>
    <div class="cal-legend"><span><i style="background:var(--ok)"></i>dolazak</span><span><i style="background:var(--mb)"></i>odlazak</span></div>`;
}

function gridBoxes(){
  // aktivni + neaktivni koji imaju boravke u prikazanom mjesecu
  const dim = daysInMonth(CAL_YM);
  const mFrom = CAL_YM + '-01', mTo = CAL_YM + '-' + pad(dim);
  const used = new Set();
  D.stays.filter(st => overlap(st, mFrom, mTo)).forEach(st => stayBoxes(st).forEach(s => used.add(s.b)));
  return sortedBoxes().filter(b => b.active || used.has(b.id));
}

function calGridHTML(){
  const t = todayISO();
  const dim = daysInMonth(CAL_YM);
  const boxes = gridBoxes();
  if (!boxes.length) return '<div class="card"><div class="empty">Nema aktivnih bokseva. Dodaj ih u Podešavanjima.</div></div>';

  const map = {};
  boxes.forEach(b => map[b.id] = {});
  const mFrom = CAL_YM + '-01', mTo = CAL_YM + '-' + pad(dim);
  D.stays.forEach(st => {
    if (!overlap(st, mFrom, mTo)) return;
    stayBoxesLive(st).forEach(seg => {
      if (!map[seg.b]) return;
      const a = seg.f > mFrom ? seg.f : mFrom;
      const b = seg.t < mTo ? seg.t : mTo;
      for (let iso = a; iso <= b; iso = addDays(iso, 1)){
        (map[seg.b][iso] = map[seg.b][iso] || []).push(st);
      }
    });
  });

  // grupni red (colspan po grupama, redoslijed mb-vb-m po sortiranju)
  let grpRow = '<tr class="grp-row"><th class="bg-date"></th>';
  let i = 0;
  while (i < boxes.length){
    const g = boxes[i].group;
    let span = 0;
    while (i + span < boxes.length && boxes[i + span].group === g) span++;
    grpRow += `<th class="g-${g}" colspan="${span}"><span class="grp-ime">${GROUPS[g]}</span></th>`;
    i += span;
  }
  grpRow += '</tr>';
  const boxRow = '<tr class="box-row"><th class="bg-date">Datum</th>' + boxes.map(b => `<th class="g-${b.group}">${esc(boxShort(b))}</th>`).join('') + '</tr>';

  let rows = '';
  for (let d = 1; d <= dim; d++){
    const iso = CAL_YM + '-' + pad(d);
    const di = dowIdx(iso);
    rows += `<tr class="${di === 6 ? 'ned' : ''} ${iso === t ? 'today-row' : ''}">`;
    rows += `<td class="bg-date" data-act="day-open" data-id="${iso}"><b class="num">${pad(d)}.</b> ${DOWS_S[di]}</td>`;
    for (const b of boxes){
      const sts = map[b.id][iso];
      if (sts && sts.length){
        const st = sts[0];
        const label = sts.length > 1 ? sts.map(stayLabel).join(' / ') : stayLabel(st);
        const prevSame = boxOn(st, addDays(iso, -1)) === b.id;
        const nextSame = boxOn(st, addDays(iso, 1)) === b.id;
        const cls = `occ-${b.group} ${prevSame ? '' : 'stay-first'} ${nextSame ? '' : 'stay-last'}`;
        const ime = !prevSame || d === 1;   // ime samo na početku trake - ostali dani su ista traka
        rows += `<td class="bg-cell ${cls}" data-act="stay-edit" data-id="${st.id}"><span class="bg-in${ime ? '' : ' bg-nastavak'}">${esc(label)}</span></td>`;
      } else {
        rows += `<td class="bg-cell free" data-act="grid-new" data-date="${iso}" data-box="${b.id}"></td>`;
      }
    }
    rows += '</tr>';
  }
  return `<div class="bgrid-wrap"><table class="bgrid"><thead>${grpRow}${boxRow}</thead><tbody>${rows}</tbody></table></div>`;
}

function groupSheet(g){
  const t = todayISO();
  const inGroup = staysOnDate(t).filter(st => stayHere(st, t) && stayGroup(st, t) === g)
    .sort((a, b) => ((boxById(boxOn(a, t)) || {}).sort || 0) - ((boxById(boxOn(b, t)) || {}).sort || 0));
  /* slobodno se računa po BOKSU, ne po spisku prisutnih - inače boravak koji danas počinje
     a nije još štriknut „Došao" ostavi svoj boks da piše slobodan, pa se klikom na taj čip
     u njega upiše drugi ljubimac (tako dva psa završe u istom boksu) */
  const occupied = new Set(staysOnDate(t).map(st => boxOnLive(st, t)).filter(Boolean));
  const freeBoxes = sortedBoxes().filter(b => b.active && b.group === g && !occupied.has(b.id));
  let html = '';
  if (inGroup.length){
    html += `<div class="card">${inGroup.map(st => stayRowHTML(st, st.to === t ? 'out' : undefined)).join('')}</div>`;
  } else {
    html += `<div class="card"><div class="empty">${g === 'm' ? I.cat : I.dog}Danas nema nikoga u ovoj grupi.</div></div>`;
  }
  if (freeBoxes.length){
    html += `<div class="sec-title">Slobodno danas <span class="cnt num">${freeBoxes.length}</span></div>
    <div class="card"><div class="chips">${freeBoxes.map(b =>
      `<button class="chip" data-act="grid-new" data-date="${t}" data-box="${b.id}">${esc(b.name.replace(/^Boks /, ''))}</button>`).join('')}</div></div>`;
  }
  openSheet(GROUPS[g] + ' - danas', html, null, { k: 'grupa', id: g });
}

function daySheet(iso){
  /* ko je otišao ranije ne stoji ni na spisku ni u zauzetosti tog dana */
  const stays = staysOnDate(iso).filter(st => !(st.leftAt && st.leftAt < iso));
  const arrivals = stays.filter(st => st.from === iso);
  /* ispraćeni na dno, kao na Danas; prijevremeni odlazak tog dana je takođe odlazak */
  const departures = stays.filter(st => st.to === iso || st.leftAt === iso).sort((a, b) => (!!a.leftAt) - (!!b.leftAt));
  const occupied = new Set(stays.map(st => boxOnLive(st, iso)).filter(Boolean));
  const freeBoxes = sortedBoxes().filter(b => b.active && !occupied.has(b.id));

  let html = '';
  if (!stays.length) html += `<div class="card"><div class="empty">${I.paw}Ovaj dan je prazan.</div></div>`;
  /* isti redoslijed kao na Danas: Dolaze, Odlaze, Ostaju */
  const brojLj = arr => arr.reduce((s, st) => s + stayPets(st), 0);
  if (arrivals.length) html += `<div class="sec-title">Dolaze <span class="cnt num">${brojLj(arrivals)}</span></div><div class="card">${arrivals.map(st => stayRowHTML(st, 'in', iso)).join('')}</div>`;
  if (departures.length) html += `<div class="sec-title">Odlaze <span class="cnt num">${brojLj(departures)}</span></div><div class="card">${departures.map(st => stayRowHTML(st, 'out', iso)).join('')}</div>`;
  const rest = stays.filter(st => st.from !== iso && st.to !== iso && st.leftAt !== iso);
  if (rest.length) html += `<div class="sec-title">Ostaju <span class="cnt num">${brojLj(rest)}</span></div><div class="card">${rest.map(st => stayRowHTML(st, undefined, iso)).join('')}</div>`;

  if (freeBoxes.length){
    /* slobodni boksovi po grupi: naziv grupe jednom, pa čipovi samo sa imenom boksa */
    html += `<div class="sec-title">Slobodni boksevi <span class="cnt num">${freeBoxes.length}</span></div>
    <div class="card">${['mb', 'vb', 'm'].map(g => {
      const bs = freeBoxes.filter(b => b.group === g);
      return bs.length ? `<div class="free-gr"><span class="free-gr-ime" style="color:var(--${g})">${esc(GROUPS[g])}</span>
        <div class="chips">${bs.map(b => `<button class="chip" data-act="grid-new" data-date="${iso}" data-box="${b.id}">${esc(b.name.replace(/^Boks /, ''))}</button>`).join('')}</div></div>` : '';
    }).join('')}</div>`;
  }
  html += `<button class="btn btn-primary btn-block" data-act="stay-new" data-date="${iso}" style="margin-top:6px">${I.plus} Novi boravak - ${fmtD(iso)}</button>`;
  openSheet(fmtDW(iso), html, null, { k: 'dan', id: iso });
}

function searchFieldHTML(id, placeholder, value, clearAct){

/* slova sa strane - skok na slovo (kao u imeniku telefona).
   Č/Ć idu pod C, Š pod S, Ž pod Z, Đ pod D - jer se imena u evidenciji pišu i sa i bez kvačica. */
const KL_FOLD = { 'Č': 'C', 'Ć': 'C', 'Š': 'S', 'Ž': 'Z', 'Đ': 'D', 'č': 'c', 'ć': 'c', 'š': 's', 'ž': 'z', 'đ': 'd' };
function klFold(s){ return (s || '').replace(/[ČĆŠŽĐčćšžđ]/g, ch => KL_FOLD[ch]); }
function klLetter(c){
  const ch = klFold((c.name || '?').trim()).charAt(0).toUpperCase();
  return /[A-Z]/.test(ch) ? ch : '#';
}
function klSorted(){
  let clients = [...D.clients].sort((a, b) => klFold(a.name).localeCompare(klFold(b.name), 'sr'));
  if (KL_MERGE) clients = clients.filter(c => c.id !== KL_MERGE.baseId);
  return clients;
}
function azRailHTML(){
  if (KL_Q.trim()) return '';
  const have = [...new Set(klSorted().map(klLetter))].sort((a, b) => a.localeCompare(b, 'sr'));
  if (have.length < 4) return '';
  return `<div class="az-rail">${have.map(l => `<button class="az" data-act="kl-jump" data-id="${l}">${l}</button>`).join('')}</div>`;
}
/* skok na slovo: trenutan (kao imenik u telefonu); drugi prolaz ispravlja pomjeranje poslije crtanja */
function klJump(letter){
  if (!KL_ALL){ KL_ALL = true; const l = $('#klList'); if (l) l.innerHTML = klListHTML(); }
  const jump = () => {
    const el = document.getElementById('kl-' + letter);
    if (el) window.scrollTo({ top: Math.max(0, el.getBoundingClientRect().top + window.scrollY - 68) });
  };
  jump();
  requestAnimationFrame(() => requestAnimationFrame(jump));
}
/* prevlačenje prstom po slovima: veliko slovo iskače i lista prati prst */
let AZ = { on: false, last: null };
function azLetterAt(y){
  const items = document.querySelectorAll('.az-rail .az');
  if (!items.length) return null;
  let best = null, bd = Infinity;
  items.forEach(it => {
    const r = it.getBoundingClientRect();
    const d = Math.abs(r.top + r.height / 2 - y);
    if (d < bd){ bd = d; best = it; }
  });
  return best ? { letter: best.dataset.id, y: best.getBoundingClientRect().top + best.getBoundingClientRect().height / 2 } : null;
}
function azBubble(letter, y){
  let b = $('#azBubble');
  if (!b){ b = document.createElement('div'); b.id = 'azBubble'; b.className = 'az-bubble'; document.body.appendChild(b); }
  b.textContent = letter;
  b.style.top = Math.round(y) + 'px';
  b.classList.add('on');
}
function azBubbleOff(){ const b = $('#azBubble'); if (b) b.classList.remove('on'); }
document.addEventListener('pointerdown', (e) => {
  const rail = e.target.closest && e.target.closest('.az-rail');
  if (!rail) return;
  e.preventDefault();
  AZ.on = true; AZ.last = null;
  try { rail.setPointerCapture(e.pointerId); } catch (err){}
  azDrag(e);
}, { passive: false });
function azDrag(e){
  if (!AZ.on) return;
  const hit = azLetterAt(e.clientY);
  if (!hit) return;
  azBubble(hit.letter, hit.y);
  if (hit.letter !== AZ.last){
    AZ.last = hit.letter;
    klJump(hit.letter);
    if (navigator.vibrate) navigator.vibrate(3);
  }
}
document.addEventListener('pointermove', (e) => { if (AZ.on){ e.preventDefault(); azDrag(e); } }, { passive: false });
['pointerup', 'pointercancel'].forEach(ev => document.addEventListener(ev, () => {
  if (!AZ.on) return;
  AZ.on = false;
  setTimeout(azBubbleOff, 380);
}));
function mergeBarHTML(){
  const n = KL_MERGE.sel.size;
  return `<div class="merge-bar" id="mergeBar">
    <button class="btn btn-ghost" data-act="kl-merge-cancel">Otkaži</button>

    }

    const n = D.stays.filter(st => st.clientId === c.id).length;
    const sel = KL_MERGE && KL_MERGE.sel.has(c.id);
    const side = KL_MERGE
      ? `${n ? `<span class="badge b-line num">${n}×</span>` : ''}<span class="kl-check ${sel ? 'on' : ''}">${I.check}</span>`
      : `${n ? `<span class="badge b-line num">${n}×</span>` : ''}<span class="chev" style="width:18px;height:18px">${I.chev}</span>`;
    return `${head}<div class="row tappable ${sel ? 'kl-sel' : ''}" data-act="${KL_MERGE ? 'kl-merge-toggle' : 'client-open'}" data-id="${c.id}" ${KL_MERGE ? '' : 'data-lp="client"'}>
      <div class="row-av av-p">${esc((c.name || '?')[0].toUpperCase())}</div>
      <div class="row-main">
        <div class="row-name">${esc(c.name)}${c.blacklist ? ' <span class="badge b-danger" style="vertical-align:1px">crna lista</span>' : ''}</div>
        <div class="row-meta">${esc([petStr && petStr !== c.name ? petStr : (petStr ? '' : 'bez ljubimaca'), c.phone || ''].filter(Boolean).join(' · ') || ' ')}</div>
      </div>
      <div class="row-side kl-side">${side}</div>
    </div>`;
  }).join('') + '</div>';
  if (!KL_ALL && !q && clients.length > LIMIT){
    html += `<button class="btn btn-ghost btn-block" data-act="kl-all">Prikaži sve (${clients.length})</button>`;

/* objedinjavanje: ljubimci, boravci i naplate selektovanih prelaze pod baznog klijenta */
async function mergeClients(baseId, ids){
  const base = clientById(baseId); if (!base) return false;
  /* spajanje pise pravo u bazu, mimo reda - zato prvo sačekaj da red bude prazan,
     inače bi upis koji je još u letu vaskrsao klijenta kojeg upravo brišemo */
  if (sb) await DB_RED.catch(() => {});
  for (const id of ids){
    if (id === baseId) continue;
    const c = clientById(id); if (!c) continue;
    if (sb){
      let r = await sb.from('pets').update({ client_id: baseId }).eq('client_id', id);
      if (r.error) return false;
      r = await sb.from('stays').update({ client_id: baseId }).eq('client_id', id);
      if (r.error) return false;
      r = await sb.from('clients').delete().eq('id', id);
      if (r.error) return false;
      cekaZaboravi(['clients:' + id]);   // spojeni klijent ne smije da vaskrsne iz nepotvrđenih upisa
    }
    D.pets.forEach(p => { if (p.clientId === id) p.clientId = baseId; });
    D.stays.forEach(s => { if (s.clientId === id) s.clientId = baseId; });
    if (!base.phone && c.phone) base.phone = c.phone;
    if (c.note && c.note !== base.note) base.note = base.note ? base.note + ' · ' + c.note : c.note;
    if (c.blacklist) base.blacklist = true;
    D.clients = D.clients.filter(x => x.id !== id);
  }
  save();
  dbSave('clients', base);
  return true;
}

async function klMergeDo(){
  if (!KL_MERGE || !KL_MERGE.sel.size) return;
  const base = clientById(KL_MERGE.baseId); if (!base) return;
  const ids = [...KL_MERGE.sel];
  closeModal();
  const ok = await mergeClients(KL_MERGE.baseId, ids);
  if (!ok){ toast('Nije uspjelo - provjeri internet pa pokušaj ponovo.'); render(); return; }
  KL_MERGE = null;
  render();
  toast('Objedinjeno pod: ' + base.name);
  openClientPop(base.id);
}

/* ============ ZARADA ============ */
/* svaka naplata nosi svoj datum - dug boravak plaćen u više navrata ulazi u mjesec kad je plaćen */
function allPayments(){
  const out = [];
  D.stays.forEach(st => stayPayments(st).forEach(p => out.push({ st, a: p.a, d: p.d, av: !!p.av })));
  return out;
}
/* završen = štriknut odlazak (odmah, isti dan) ILI prošao datum odlaska.
   Spisak gleda zadnjih 45 dana; starije (uglavnom stara evidencija iz Excela) je u posebnom, sklopljenom redu -
   ranije su nestajale bez traga, a kartica vlasnika ih je i dalje pokazivala kao dug. */
function unpaidStays(starije){
  const t = todayISO(), granica = addDays(t, -45);
  return D.stays.filter(st => {
    if (st.paid || chargeDue(st) <= 0) return false;
    const kraj = st.leftAt && st.leftAt < st.to ? st.leftAt : st.to;
    if (!(st.leftAt || kraj < t)) return false;
    return starije ? kraj < granica : kraj >= granica;
  });
}
function vZarada(){

</script>
<script>
/* ============ SHEET / MODAL okvir ============ */
let sheetOpen = false;
/* ===== „NAZAD" KROZ SHEET (Novica, 25.10.2026) =====
   Boravak otvoren sa spiska (Mali boksevi, dan iz kalendara, Nenaplaćeno), novi boravak otvoren iz drugog
   boravka i boravak otvoren iz kartice vlasnika/ljubimca vraćaju se TAMO GDJE SU BILI, na isto mjesto na spisku -
   ranije je svako zatvaranje bacalo na Danas, pa se do sljedećeg psa išlo iz početka.
   SHEET_STACK = nivoi ispod trenutnog: { k: 'grupa'|'dan'|'nenaplaceno'|'boravak'|'klijent'|'ljubimac', id, top, naslov, sf }.
   Svaki nivo sheet-a ima svoj korak u istoriji (sistemsko „nazad" = jedan nivo); kartica na dnu (klijent/ljubimac)
   nema svoj korak - sheet je preuzeo njen, pa ga pri povratku kartica preuzima nazad.
   Strelica „‹" u zaglavlju = jedan nivo; krstić i klik pored = zatvori sve. */
let SHEET_STACK = [];
let SHEET_CUR = null;
let SF_ZATVORI = null;   // dok stoji „Sačuvati izmjene?": kuda se išlo ('nazad' | 'sve')
/* boravak sa NESAČUVANIM izmjenama (npr. ukucan avans) se ne zatvara tiho - Novica je avans upisivao,
   zatvarao krstićem i poslije zaticao prazno polje */
function sfTrebaPitati(kako, viaPop, posle){
  if (!SHEET_CUR || SHEET_CUR.k !== 'boravak' || !SF || !sfDirty()) return false;
  if (viaPop) history.pushState({ sheet: sheetDubina() }, '');   // „nazad" je potrošio korak - vrati ga
  SF_ZATVORI = kako;
  SF.posle = posle || null;
  const novi = !SF.id;
  const sta = [...new Set(sfIzmjene(SF).map(k => SF_POLJA_IME[k]))].join(', ');
  showModal(`<div class="modal-title">${novi ? 'Boravak nije upisan' : 'Sačuvati izmjene?'}</div>
    ${!novi && sta ? `<div class="modal-text">Izmijenjeno: ${esc(sta)}.</div>` : ''}
    <div class="modal-actions modal-stack" style="margin-top:14px">
      <button class="btn btn-primary btn-block" data-act="sf-izlaz-sacuvaj">${novi ? 'Upiši boravak' : 'Sačuvaj'}</button>
      <button class="btn btn-ghost btn-block" data-act="sf-izlaz-odbaci">${novi ? 'Izađi bez upisa' : 'Odbaci izmjene'}</button>
      <button class="btn btn-ghost btn-block" data-act="sf-izlaz-otkazi">Nazad u boravak</button>
    </div>`);
  return true;
}
const SHEET_VRATI = { grupa: 1, dan: 1, nenaplaceno: 1, boravak: 1 };   // nivoi na koje se može vratiti
const sheetKartica = n => n.k === 'klijent' || n.k === 'ljubimac';
function sheetDubina(){ return 1 + SHEET_STACK.filter(n => !sheetKartica(n)).length; }
/* zapamti ono što je sada u sheet-u, pa otvori dublji nivo (zove openStayForm) */
function sheetGurni(preuzmiKorak){
  const nivo = { ...SHEET_CUR, top: $('#sheetBody').scrollTop, naslov: $('#sheetTitle').textContent };
  if (SHEET_CUR.k === 'boravak'){ if (!SF) return; sfSync(); nivo.sf = structuredClone(SF); }
  SHEET_STACK.push(nivo);
  if (preuzmiKorak) history.replaceState({ sheet: sheetDubina() }, '');
  else history.pushState({ sheet: sheetDubina() }, '');
}
function sheetBackHTML(){
  const n = SHEET_STACK[SHEET_STACK.length - 1];
  const b = $('#sheetBack'); if (!b) return;
  if (!n){ b.style.display = 'none'; return; }
  const stN = n.k === 'boravak' && n.sf && n.sf.id ? D.stays.find(s => s.id === n.sf.id) : null;
  const ime = n.k === 'klijent' ? ((clientById(n.id) || {}).name || 'Vlasnik')
    : n.k === 'ljubimac' ? (petById(n.id) ? petLabel(petById(n.id)) : 'Ljubimac')
    : stN ? 'Boravak · ' + stayLabel(stN)
    : String(n.naslov || 'Nazad').replace(/ - danas$/, '');
  b.innerHTML = I.chevL + '<span>' + esc(ime) + '</span>';
  b.style.display = 'flex';
}

function openSheet(title, html, fab, nivo){
  SHEET_CUR = nivo || { k: 'ostalo' };
  $('#sheetTitle').textContent = title;
  $('#sheetBody').innerHTML = html;
  const f = $('#sheetFab');
  if (fab){
    f.innerHTML = I.plus + ' ' + esc(fab.label);
    f.dataset.act = fab.act;
    f.style.display = 'flex';
    $('#sheet').classList.add('has-fab');
  } else {
    f.style.display = 'none';
    $('#sheet').classList.remove('has-fab');
  }
  sheetBackHTML();
  sheetFoot('');
  $('#sheet').classList.add('open');
  $('#sheetOverlay').classList.add('open');
  document.body.classList.add('noscroll');
  $('#sheetBody').scrollTop = 0;
  /* ako je korak u istoriji već zauzela kartica klijenta/ljubimca, sheet ga preuzme (bez dupliranja) */
  if (!sheetOpen){
    if (history.state && (history.state.cePop || history.state.pePop)) history.replaceState({ sheet: 1 }, '');
    else history.pushState({ sheet: 1 }, '');
    sheetOpen = true;
  }
}
/* samo skloni sheet sa ekrana - bez diranja istorije */
function sheetSkloni(){
  $('#sheet').classList.remove('open');
  $('#sheetOverlay').classList.remove('open');
  document.body.classList.remove('noscroll');
  sheetOpen = false;
  SF = null; SHEET_CUR = null; SHEET_STACK = []; SF_ZATVORI = null;
}
/* zatvori SVE nivoe (krstić, klik pored, posao završen) */
function sheetZatvoriSve(force){
  if (!sheetOpen) return;
  if (!force && sfTrebaPitati('sve', false)) return;
  if (!force){
    let i = SHEET_STACK.length - 1;
    while (i >= 0 && !(SHEET_STACK[i].k === 'boravak' && SHEET_STACK[i].sf && sfIzmjene(SHEET_STACK[i].sf).length)) i--;
    if (i >= 0){
      /* vrati se na taj boravak (nivoi iznad njega nemaju izmjena) i pitaj tamo */
      sheetNazad(true, false, SHEET_STACK.length - 1 - i);
      sfTrebaPitati('sve', false);
      return;
    }
  }
  const n = sheetDubina();
  sheetSkloni();
  if (history.state && history.state.sheet){ POP_SKIP = true; history.go(-n); }
}
/* jedan nivo nazad: strelica u zaglavlju, sistemsko „nazad", i poslije Sačuvaj / Naplati / Obriši */
/* `preko` = koliko nivoa ispod ovog se preskače bez otvaranja (krstić koji vraća na boravak sa nesačuvanim izmjenama) */
function sheetNazad(force, viaPop, preko){
  if (!sheetOpen) return;
  if (!force && sfTrebaPitati('nazad', viaPop)) return;
  let preskoceno = 0;
  for (let k = 0; k < (preko || 0) && SHEET_STACK.length; k++){ SHEET_STACK.pop(); preskoceno++; }
  let nivo = SHEET_STACK.pop();
  /* boravak sa nižeg nivoa je u međuvremenu obrisan (druga osoba) - preskoči ga, a njegov korak u istoriji vrati */
  while (nivo && nivo.k === 'boravak' && nivo.sf && nivo.sf.id && !D.stays.some(s => s.id === nivo.sf.id)){ nivo = SHEET_STACK.pop(); preskoceno++; }
  /* vrati n koraka u istoriji; `posle` se izvrši kad se istorija smiri (popstate koji app sam izazove se preskače) */
  const vratiKorake = (n, posle) => { if (n > 0){ POP_SKIP = posle || true; history.go(-n); } else if (posle) posle(); };
  if (nivo && sheetKartica(nivo)){
    /* nazad u karticu vlasnika/ljubimca: kartica preuzima korak koji je sheet uzeo od nje
       (a ako ga je sistemsko „nazad" već potrošilo, otvara svoj) */
    sheetSkloni();
    /* donji nivo sheet-a dijeli korak sa karticom; svaki viši ima svoj. Koraka viška: preskočeni nivoi + ovaj,
       manje onaj koji je kartica preuzela, manje onaj koji je sistemsko „nazad" već potrošilo */
    const r = preskoceno - (viaPop ? 1 : 0);
    const kart = nivo;
    const otvori = uzmi => {
      if (kart.k === 'klijent' && clientById(kart.id)) return openClientPop(kart.id, false, uzmi);
      if (kart.k === 'ljubimac' && petById(kart.id)){ if (uzmi) history.replaceState({ pePop: 1 }, ''); return openPetPop(kart.id, uzmi); }
      if (uzmi) popBack();
    };
    if (r < 0) otvori(false);
    else vratiKorake(r, () => otvori(true));
    return;
  }
  if (!nivo){
    const korak = !viaPop && history.state && history.state.sheet;
    sheetSkloni();
    vratiKorake(preskoceno + (korak ? 1 : 0));
    return;
  }
  vratiKorake(preskoceno + (viaPop ? 0 : 1));
  SF = null;
  if (nivo.k === 'boravak'){
    /* nedirana forma se gradi iznova iz svježih podataka (druga osoba je možda upisala avans ili cijenu);
       dirana se vraća kakva je bila, a čuvanje ionako upisuje samo dirana polja */
    if (nivo.sf.id && !sfIzmjene(nivo.sf).length){ sfIzBoravka(nivo.sf.id); }
    else SF = nivo.sf;
    renderStayForm();
  }
  else if (nivo.k === 'grupa') groupSheet(nivo.id);
  else if (nivo.k === 'dan') daySheet(nivo.id);
  else if (nivo.k === 'nenaplaceno') unpaidSheet();
  $('#sheetBody').scrollTop = nivo.top || 0;
}
/* otvoren spisak (Mali boksevi, dan, Nenaplaćeno) se precrtava sa svježim stanjem, na istom mjestu */
function osvjeziSheet(){
  if (!sheetOpen || !SHEET_CUR) return;
  const top = $('#sheetBody').scrollTop;
  if (SHEET_CUR.k === 'grupa') groupSheet(SHEET_CUR.id);
  else if (SHEET_CUR.k === 'dan') daySheet(SHEET_CUR.id);
  else if (SHEET_CUR.k === 'nenaplaceno') unpaidSheet();
  else return;
  $('#sheetBody').scrollTop = top;
}
function closeSheet(viaPop){ return viaPop ? sheetNazad(false, true) : sheetZatvoriSve(); }

/* kad app SAM vrati korak (zatvaranje kartice dugmetom), popstate koji stigne poslije
   nije korisnikov „nazad" - preskace se, inace bi zatvorio i sheet ispod kartice */
let POP_SKIP = false;   // true ili funkcija koja se izvrši kad stigne taj popstate
function popBack(){ POP_SKIP = true; history.back(); }
window.addEventListener('popstate', () => {
  if (POP_SKIP){ const f = POP_SKIP; POP_SKIP = false; if (typeof f === 'function') f(); return; }
  if (ZOOM){ zoomClose(true); return; }    // „nazad" prvo zatvara uvećanu sliku
  if (PE){ peDone(true); return; }         // pa karticu ljubimca
  if (CE){ ceDone(true, true); return; }   // pa karticu klijenta
  /* bilo koji prozor (naplata, „Sačuvati izmjene?", potvrda poništavanja/brisanja, premještanje boksa):
     „nazad" = Otkaži, a ono ispod ostaje. Ranije je sheet ispod išao nivo nazad, a potvrda ostajala na
     ekranu i radila nad DRUGIM boravkom. */
  if ($('#modalHost').firstChild){
    const imaKorak = NM && NM.korak;   // prozor naplate sa svojim korakom: „nazad" ga je upravo potrošio
    NM = null; SF_ZATVORI = null; sfOcistiNamjeru(); closeModal();
    if (sheetOpen && !imaKorak) history.pushState({ sheet: sheetDubina() }, '');
    return;
  }
  if (sheetOpen) sheetNazad(false, true);
});

/* Ako modal već stoji (kartica se precrtava zbog tuđe izmjene ili sopstvenog upisa), mijenja se samo sadržaj -
   inače bi se fade-in/pop-in animacija ponavljala i izgledalo bi da se kartica „sama otvara iznova", a polje u kom
   se kuca gubilo bi fokus (i tastaturu). Skrol se vraća na vrh kao kod novog elementa (kartice ga same vraćaju). */
function showModal(html, wide, cls){
  const host = $('#modalHost');
  const klasa = `modal ${wide ? 'modal-wide' : ''} ${cls || ''}`;
  const stari = host.querySelector('.modal-overlay > .modal');
  if (stari){
    const akt = document.activeElement;
    const id = akt && akt.id && stari.contains(akt) ? akt.id : '';
    const sel = id && akt.selectionStart != null ? [akt.selectionStart, akt.selectionEnd] : null;
    stari.className = klasa;
    stari.innerHTML = html;
    stari.scrollTop = 0;
    if (id){ const el = document.getElementById(id); if (el){ el.focus({ preventScroll: true }); if (sel){ try { el.setSelectionRange(sel[0], sel[1]); } catch (e){} } } }
    return;
  }
  host.innerHTML = `<div class="modal-overlay" data-act="modal-close"><div class="${klasa}">${html}</div></div>`;
}
function closeModal(){ $('#modalHost').innerHTML = ''; }
/* cancelAct = gdje se vraća na „Otkaži" (npr. nazad u karticu klijenta) */
function confirmModal(title, text, act, id, btnLabel, danger, cancelAct){
  showModal(`<div class="modal-title">${esc(title)}</div><div class="modal-text">${text}</div>
    <div class="modal-actions">
      <button class="btn btn-ghost" data-act="${cancelAct || 'modal-close'}">Otkaži</button>
      <button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-act="${act}" data-id="${id}">${esc(btnLabel)}</button>
    </div>`);
}

/* ============ NAPLATA I ODLAZAK ============
   JEDAN prozor za štrik „Otišao", za „Naplati" u boravku i za „Naplati" u Nenaplaćenom (Novica, 25.10.2026).
   Ništa se ne upisuje prije potvrde: „Otkaži" ostavlja boravak kakav je bio. Ranije je „Otišao" odmah skidao
   ljubimca sa spiska, a naplatu nudio samo kad je ostajalo nešto POSLIJE depozita - pa je boravak plaćen
   unaprijed ostajao „nenaplaćen" dok se depozit ne obriše i odlazak ne poništi. Avans je sada uplata. */
function chargeDue(st){ return stayNovac(st).ostalo; }

let NM = null;   // otvoren prozor: { id, odlazi, rano, ostatak: 'dug' | 'popust', iznos, stari }
const nmOtisk = st => JSON.stringify([stayPayments(st), !!st.paid, st.leftAt || null, st.price, st.to]);
function chargeStart(stayId, odlazak){
  const st = D.stays.find(s => s.id === stayId); if (!st) return;
  const t = todayISO();
  const otisao = stayLeft(st);
  /* „Otišao" = odlazi sada; „Naplati" na dan odlaska ili kasnije takođe zatvara boravak;
     prije dana odlaska bira se: uplata usput (ostaje u pansionu) ili prijevremeni odlazak */
  const rano = !otisao && !odlazak && st.to > t;
  NM = { id: stayId, odlazi: !otisao && (odlazak || st.to <= t), rano, ostatak: 'dug', iznos: null, stari: nmOtisk(st) };
  if (!sheetOpen && !CE && !PE){ history.pushState({ nm: 1 }, ''); NM.korak = true; }
  renderNaplata();
  setTimeout(() => { const i = $('#nmIznos'); if (i && !('ontouchstart' in window)){ i.focus(); i.select(); } }, 60);
}
/* prijevremeni odlazak: računa se do DANAS (bez dogovorene cijene predračun ide po stvarnim noćenjima) */
function nmBoravak(st){
  const t = todayISO();
  return NM && NM.odlazi && st.to > t && !st.leftAt ? { ...st, leftAt: t < st.from ? st.from : t } : st;
}
function nmIznos(){ const i = $('#nmIznos'); return i ? parseMoney(i.value) : null; }
/* zatvori prozor naplate; ako je imao svoj korak u istoriji, vrati ga */
function nmZatvori(){
  const korak = NM && NM.korak;
  NM = null; closeModal();
  if (korak && history.state && history.state.nm) popBack();
}
function nmOstatakHTML(st){
  const zatvara = NM.odlazi || stayLeft(st);
  const val = nmIznos();
  const ost = Math.max(0, Math.round((stayNovac(nmBoravak(st)).ostalo - (val || 0)) * 100) / 100);
  if (!zatvara || val == null || ost <= 0) return '';
  return `<div class="nm-ost">
    <div class="nm-ost-t">Ostaje još <b class="num">${money(ost)}</b></div>
    <div class="seg">
      <button class="seg-btn ${NM.ostatak === 'dug' ? 'active' : ''}" data-act="nm-ostatak" data-id="dug">Duguje</button>
      <button class="seg-btn ${NM.ostatak === 'popust' ? 'active' : ''}" data-act="nm-ostatak" data-id="popust">Popust</button>
    </div>
  </div>`;
}
function renderNaplata(){
  const st0 = NM && D.stays.find(s => s.id === NM.id);
  if (!st0){ NM = null; closeModal(); return; }
  const st = nmBoravak(st0);
  const n = stayNovac(st);
  const zatvara = NM.odlazi || stayLeft(st0);
  const ranije = Math.round((n.placeno - n.avans) * 100) / 100;
  const avD = stayAvansDatum(st);
  const predracun = st.price == null && n.ukupno > 0;
  const trazi = n.ostalo > 0 || (n.ukupno === 0 && n.placeno === 0);   // ima šta da se naplati (ili cijena nije poznata)
  const iznos = NM.iznos != null ? NM.iznos : (n.ostalo ? String(n.ostalo) : '');
  const kad = fmtRaspon(st.from, stayKraj(st));
  const sveAvansom = !trazi && n.avans > 0 && ranije <= 0;
  let akcije;
  if (trazi){
    akcije = `<button class="btn btn-ok btn-block" data-act="nm-ok">${I.check} ${!zatvara ? 'Upiši uplatu' : NM.odlazi ? 'Naplaćeno i otišao' : 'Naplaćeno'}</button>
      ${NM.odlazi ? `<button class="btn btn-ghost btn-block" data-act="nm-kasnije">Otišao, plaća kasnije</button>` : ''}`;
  } else if (zatvara){
    akcije = `<button class="btn btn-ok btn-block" data-act="nm-ok">${I.check} ${NM.odlazi ? 'Potvrdi odlazak' : 'Zatvori kao naplaćeno'}</button>`;
  } else akcije = '';
  showModal(`<div class="nm-head">
      <div class="modal-title">${NM.odlazi && !NM.rano ? 'Odlazak' : 'Naplata'}</div>
      <button class="sheet-x" data-act="nm-otkazi" aria-label="Otkaži">${I.x}</button>
    </div>
    <div class="nm-who">${groupAvatar(st)}
      <div class="row-main"><div class="row-name">${esc(stayLabel(st))}</div>
      <div class="row-meta num">${stayLenLabel(st)} · ${kad}</div></div></div>
    ${NM.rano ? `<div class="seg" style="margin:0 0 12px">
      <button class="seg-btn ${!NM.odlazi ? 'active' : ''}" data-act="nm-odlazi" data-id="0">Ostaje u pansionu</button>
      <button class="seg-btn ${NM.odlazi ? 'active' : ''}" data-act="nm-odlazi" data-id="1">Odlazi danas</button>
    </div>` : ''}
    <div class="pay-list" style="margin:0 0 14px">
      <div class="pay-row"><span>ukupno${predracun ? ' po cjenovniku' : ''}</span><b class="num">${money(n.ukupno)}</b></div>
      ${n.avans ? `<div class="pay-row"><span>avans${avD ? ' · ' + fmtD(avD) : ''}</span><b class="num">&minus; ${money(n.avans)}</b></div>` : ''}
      ${ranije > 0 ? `<div class="pay-row"><span>uplaćeno ranije</span><b class="num">&minus; ${money(ranije)}</b></div>` : ''}
      <div class="pay-row pay-sum">${n.ostalo > 0 || trazi
        ? `<span>za naplatu</span><b class="num" style="color:var(--warn)">${money(n.ostalo)}</b>`
        : `<span style="color:var(--ok)">${I.check} ${sveAvansom ? 'plaćeno avansom' : n.placeno > 0 ? 'sve je plaćeno' : 'nema iznosa'}</span>`}</div>
    </div>
    ${trazi ? `<div class="fld"><label class="lbl">${zatvara ? 'Naplaćujem sada (€)' : 'Uplata sada (€)'}</label>
        <input type="text" inputmode="decimal" id="nmIznos" value="${esc(iznos)}" class="nm-input"></div>
      <div id="nmOstatak">${nmOstatakHTML(st0)}</div>` : ''}
    ${akcije ? `<div class="modal-actions modal-stack">${akcije}</div>` : ''}`);
}
function naplataPotvrdi(kasnije){
  if (!NM) return;   // drugi dodir na isto dugme
  const st = D.stays.find(s => s.id === NM.id);
  if (!st){ nmZatvori(); toast('Boravak je u međuvremenu obrisan.'); return; }
  /* druga osoba je u međuvremenu naplatila / ispratila isti boravak - ne upisuj isti novac dva puta */
  if (nmOtisk(st) !== NM.stari){
    NM.stari = nmOtisk(st); NM.iznos = null;
    NM.odlazi = NM.odlazi && !stayLeft(st);
    renderNaplata();
    toast('Boravak je u međuvremenu promijenjen - provjeri iznos.');
    return;
  }
  const t = todayISO();
  const imaPolje = !!$('#nmIznos');
  const val = imaPolje ? nmIznos() : 0;
  if (!kasnije && imaPolje && val == null){ toast('Upiši iznos.'); return; }
  const zatvara = NM.odlazi || stayLeft(st);
  const pays = stayPayments(st).map(p => { delete p.z; return p; });
  const zatvaraSad = zatvara && !kasnije;
  /* uplata kojom se boravak ZATVARA nosi oznaku z - samo nju briše „poništi" naplatu */
  if (!kasnije && val > 0) pays.push(zatvaraSad ? { a: val, d: t, z: 1 } : { a: val, d: t });
  st.payments = pays.length ? pays : null;
  if (NM.odlazi){
    /* prijevremeni odlazak: boravak se računa do danas (stayKraj), boks je slobodan od sjutra */
    st.leftAt = t < st.from ? st.from : t;
    if (!st.arrivedAt) st.arrivedAt = st.from;
  }
  const placeno = stayPaidSum(st);
  const ost = Math.max(0, Math.round(((stayAmount(st) || 0) - placeno) * 100) / 100);
  let poruka;
  if (zatvaraSad && (ost <= 0 || NM.ostatak === 'popust')){
    /* zaključeno: ukupna cijena = sve što je primljeno (avans + uplate); popust spušta cijenu na to */
    st.paid = true; st.paidAt = t;
    st.price = placeno;
    poruka = val > 0 ? 'Naplaćeno ' + money(val) + '.' : 'Sve je plaćeno.';
  } else {
    st.paid = false; st.paidAt = null;
    if (st.payments) st.payments.forEach(p => delete p.z);   // nije zatvoren - nema „zatvarajuće" uplate
    poruka = zatvara ? 'Ostaje ' + money(ost) + ' za naplatu.' : 'Upisana uplata ' + money(val) + '.';
  }
  dbSave('stays', st);
  const odlazi = NM.odlazi;
  nmZatvori();
  /* naplata iz boravka vraća na spisak sa kog je boravak otvoren; otvoren spisak se osvježava */
  if (SF && SF.id === st.id) sheetNazad(true);
  else osvjeziSheet();
  render();
  toast((odlazi ? stayLabel(st) + ' je otišao. ' : '') + poruka);
}
</script>
<script>
/* ============ FORMA BORAVKA ============ */
let SF = null;

/* opts.preuzmiKorak = otvara se iz kartice koja stoji preko sheet-a (kartica se zatvorila, njen korak uzima novi nivo);
   opts.izKartice = { k: 'klijent'|'ljubimac', id } kad ispod nema sheet-a - „nazad" se vraća u tu karticu */
/* forma za upisan boravak, iz svježih podataka */
function sfIzBoravka(stayId, otv){
  const st = D.stays.find(s => s.id === stayId); if (!st) return;
  const av = stayAvans(st);
  SF = {
    id: st.id, clientId: st.clientId, clientQ: '', newClient: null,
    petIds: new Set(st.petIds || []), newPets: [], petForm: null,
    type: st.type, from: st.from, to: st.to, calCur: st.from.slice(0, 7),
    boxes: stayBoxes(st).map(s => ({ ...s })), price: st.price != null ? String(st.price) : '',
    avans: av ? String(av) : '',
    paid: !!st.paid, paidAt: st.paidAt || null, note: st.note || '', otv: otv || {},
  };
  sfBaza();
}
function openStayForm(opts){
  opts = opts || {};
  if (opts.stayId && !D.stays.some(s => s.id === opts.stayId)) return;
  if (opts.stayId && sheetOpen && ((SF && SF.id === opts.stayId) || SHEET_STACK.some(n => n.sf && n.sf.id === opts.stayId))){
    if (opts.preuzmiKorak) popBack();
    toast('Taj boravak je već otvoren - vrati se strelicom nazad.');
    return;
  }
  if (sheetOpen && SHEET_CUR && SHEET_VRATI[SHEET_CUR.k]) sheetGurni(opts.preuzmiKorak);
  else if (!sheetOpen) SHEET_STACK = opts.izKartice ? [opts.izKartice] : [];
  else if (opts.preuzmiKorak) popBack();   // sheet na koji se ne vraća: korak kartice nema ko da preuzme
  if (sheetOpen) $('#sheetBody').scrollTop = 0;   // novi nivo počinje od vrha, ne od skrola spiska ispod
  if (opts.stayId){
    sfIzBoravka(opts.stayId);
    renderStayForm();
    return;
  } else {
    const from = opts.from || opts.date || '';
    SF = {
      id: null, clientId: opts.clientId || null, clientQ: '', newClient: null,
      petIds: new Set(), newPets: [], petForm: null,
      type: 'pansion', from, to: opts.to || '', calCur: (from || todayISO()).slice(0, 7), vrsta: opts.vrsta || null,
      boxes: opts.boxId ? [{ b: opts.boxId, f: from, t: from }] : [],
      price: '', avans: '', paid: false, paidAt: null, note: '',
    };
    if (SF.clientId){
      const pets = petsOfClient(SF.clientId);
      /* iz kartice ljubimca: taj ljubimac je već izabran */
      if (opts.petId && pets.some(p => p.id === opts.petId)) SF.petIds.add(opts.petId);
      else if (pets.length === 1) SF.petIds.add(pets[0].id);
    }
  }
  sfBaza();
  renderStayForm();
}
/* boravak otvoren iz kartice vlasnika/ljubimca (kartica je zatvorena sa zadržanim korakom u istoriji):
   preko sheet-a -> novi nivo preuzima korak kartice; bez sheet-a -> „nazad" vraća u karticu */
function izKarticeBoravak(opts, kartica){
  openStayForm(sheetOpen ? { ...opts, preuzmiKorak: true } : { ...opts, izKartice: kartica });
}
/* „dirano" = razlikuje se od stanja u trenutku otvaranja (ili posljednjeg čuvanja), POLJE PO POLJE:
   upisuje se samo ono što je korisnik dirao, pa izmjena sa drugog telefona (npr. avans koji je upisao
   Novica dok je Vesna imala otvoren isti boravak) ne biva pregažena starim stanjem iz forme.
   Naplata i ljubimci na upisanom boravku se upisuju odmah (prozor naplate, kartica ljubimca) - zato
   „paid" nije polje forme, a ljubimci se poslije takvog upisa usklađuju sa sfBazaPolje. */
const SF_POLJA_IME = { c: 'vlasnik', nc: 'novi klijent', p: 'ljubimci', np: 'ljubimci', pf: 'ljubimci', t: 'vrsta boravka',
  f: 'termin', to: 'termin', b: 'boks', pr: 'cijena', av: 'avans', n: 'napomena' };
function sfPolja(f){
  return { c: f.clientId || null, nc: JSON.stringify(f.newClient || null), p: JSON.stringify([...f.petIds].sort()),
    np: JSON.stringify(f.newPets || []), pf: JSON.stringify(f.petForm || null), t: f.type, f: f.from || '',
    to: (f.type === 'dnevni' ? f.from : f.to) || '', b: JSON.stringify(f.boxes || []),
    pr: String(f.price || '').trim(), av: String(f.avans || '').trim(), n: String(f.note || '').trim() };
}
function sfBaza(){ if (SF) SF.base = sfPolja(SF); }
function sfBazaPolje(k, v){ if (SF && SF.base) SF.base[k] = v; }
function sfIzmjene(f){
  if (!f || !f.base) return [];
  const sad = sfPolja(f);
  return Object.keys(sad).filter(k => sad[k] !== f.base[k]);
}
function sfDirty(){ if (!SF) return false; sfSync(); return sfIzmjene(SF).length > 0; }

/* pokupi tekstualna polja iz DOM-a u draft (da re-render ne pojede unos) */
function sfSync(){
  if (!SF) return;
  const g = id => document.getElementById(id);
  if (g('sfPrice')) SF.price = g('sfPrice').value;
  if (g('sfAvans')) SF.avans = g('sfAvans').value;
  if (g('sfNote')) SF.note = g('sfNote').value;
  if (SF.newClient){
    if (g('sfNcName')) SF.newClient.name = g('sfNcName').value;
    if (g('sfNcPhone')) SF.newClient.phone = g('sfNcPhone').value;
  }
  if (SF.petForm){
    if (g('sfPfName')) SF.petForm.name = g('sfPfName').value;
    if (g('sfPfBreed')) SF.petForm.breed = g('sfPfBreed').value;
  }
}
function sfDraftPets(){
  return [...SF.petIds].map(petById).filter(Boolean).concat(SF.newPets);
}

/* birač termina - jedan kalendar, klik od pa do (kao K-Sport).
   S = stanje sa poljima {from, to, calCur, type} - forma boravka (SF) ili provjera datuma (PD). */
function drCalHTML(S, acts){
  S = S || SF;
  const aNav = (acts && acts.nav) || 'dr-nav', aPick = (acts && acts.pick) || 'dr-pick';
  const [cy, cm] = S.calCur.split('-').map(Number);
  const od = S.from || '';
  const doo = S.type === 'dnevni' ? od : (S.to || '');
  const t = todayISO();
  const first = new Date(cy, cm - 1, 1);
  const start = new Date(first);
  start.setDate(1 - ((first.getDay() + 6) % 7));
  let days = '';
  for (let i = 0; i < 42; i++){
    const d = new Date(start); d.setDate(start.getDate() + i);
    const iso = isoFromDate(d);
    const inMonth = d.getMonth() === cm - 1;
    const isStart = iso === od, isEnd = iso === doo;
    const single = od && doo && od === doo;
    const isIn = od && doo && iso > od && iso < doo;
    days += `<button type="button" class="dr-day ${inMonth ? '' : 'other'} ${iso === t ? 'today' : ''}
      ${isStart || isEnd ? 'r-edge' : ''} ${isStart && doo && !single ? 'r-start' : ''} ${isEnd && !single ? 'r-end' : ''} ${isIn ? 'r-in' : ''}"
      data-act="${aPick}" data-id="${iso}"><span class="dr-num num">${d.getDate()}</span></button>`;
  }
  const dows = DOWS_S.map((x, i) => `<span class="dr-dow ${i === 6 ? 'ned' : ''}">${x}</span>`).join('');
  let foot;
  if (S.type === 'dnevni'){
    foot = od ? `Dan: <strong>${fmtDY(od)}</strong>` : 'Izaberi dan';
  } else if (od && doo){
    const n = diffDays(od, doo);
    foot = `Trajanje: <strong>${nightsLabel(n)}</strong> · ${fmtDY(od)} - ${fmtDY(doo)}`;
  } else if (od){
    foot = `Dolazak: <strong>${fmtDY(od)}</strong> - sad izaberi dan odlaska`;
  } else {
    foot = 'Izaberi datum dolaska i odlaska';
  }
  return `<div class="dr">
    <div class="dr-head">
      <button type="button" class="dr-nav" data-act="${aNav}" data-id="-12">«</button>
      <button type="button" class="dr-nav" data-act="${aNav}" data-id="-1">‹</button>
      <span class="dr-title">${monthLabel(S.calCur)}</span>
      <button type="button" class="dr-nav" data-act="${aNav}" data-id="1">›</button>
      <button type="button" class="dr-nav" data-act="${aNav}" data-id="12">»</button>
    </div>
    <div class="dr-grid">${dows}${days}</div>
    <div class="dr-foot">${foot}</div>
  </div>`;
}
function drPick(iso, S){
  S = S || SF;
  if (S.type === 'dnevni'){ S.from = iso; S.to = iso; return; }
  const od = S.from, doo = S.to;
  if (!od || (od && doo)){ S.from = iso; S.to = ''; }
  else if (iso < od){ S.from = iso; S.to = ''; }
  else { S.to = iso; }
}

/* popunjenost kapaciteta za izabrani termin: dani bez ijednog slobodnog boksa */
/* STROGO pravilo (Vesna i Novica, 31.7.): mali pas SAMO u male bokseve,
   veliki pas SAMO u velike, mačka SAMO u mačje - vrste se ne miješaju. */
function vrstaGrupa(v){ return v === 'macka' ? 'm' : (v === 'veliki' ? 'vb' : 'mb'); }
function sfRelevantGroups(){
  const pets = sfDraftPets();
  const g = new Set();
  for (const p of pets){
    if (p.species === 'macka') g.add('m');
    else g.add(p.size === 'veliki' ? 'vb' : 'mb');
  }
  /* dok ljubimac nije izabran, važi vrsta sa koje se došlo iz „Provjeri datume" */
  if (!g.size && SF && SF.vrsta) g.add(vrstaGrupa(SF.vrsta));
  if (!g.size){ g.add('mb'); g.add('vb'); g.add('m'); }
  return g;
}
/* popunjenost po danu za izabrani termin:
   `kavezi` = nema više slobodnog PRAVOG boksa (sljedeći ide u kavez),
   `puni`   = nema slobodnog baš ničega. */
function sfLoadDays(){
  const from = SF.from, to = SF.type === 'dnevni' ? SF.from : SF.to;
  const prazno = { puni: [], kavezi: [] };
  if (!from || !to || to < from || diffDays(from, to) > 400) return prazno;
  const groups = sfRelevantGroups();
  const boxes = D.boxes.filter(b => b.active && groups.has(b.group));
  if (!boxes.length) return prazno;
  const pravi = boxes.filter(b => !boxSpare(b));
  const use = boxUsage(from, to, SF.id);
  const zauzet = (b, iso) => !!(use[b.id] && use[b.id].days.has(iso));
  const puni = [], kavezi = [];
  for (let iso = from; iso <= to; iso = addDays(iso, 1)){
    if (!boxes.some(b => !zauzet(b, iso))) puni.push(iso);
    else if (pravi.length && !pravi.some(b => !zauzet(b, iso))) kavezi.push(iso);
  }
  return { puni, kavezi };
}
function sfFullDays(){ return sfLoadDays().puni; }
function dayRanges(days){
  const out = [];
  for (const d of days){
    const last = out[out.length - 1];
    if (last && addDays(last.to, 1) === d) last.to = d;
    else out.push({ from: d, to: d });
  }
  return out;
}
function fullDaysLabel(days){
  return dayRanges(days).map(r => r.from === r.to ? fmtD(r.from) : fmtD(r.from) + ' - ' + fmtD(r.to)).join(', ');
}
function sfPetsSuffix(){
  const pets = sfDraftPets();
  const dog = pets.some(p => p.species !== 'macka'), cat = pets.some(p => p.species === 'macka');
  return cat && !dog ? ' za mačke' : (dog && !cat ? ' za pse' : '');
}
/* Popunjeno NIJE zabrana: pitamo i upisujemo ako Vesna/Novica tako odluče. */
function sfCapacityAsk(next){
  const days = sfFullDays();
  if (!days.length) return false;
  const from = SF.from, to = SF.type === 'dnevni' ? SF.from : SF.to;
  const uk = diffDays(from, to) + 1;
  showModal(`<div class="modal-title">Preko kapaciteta</div>
    <div class="modal-text"><b class="num">${days.length}</b> od <b class="num">${uk}</b> ${plural(uk, 'dana', 'dana', 'dana')} ovog boravka je preko predviđenog kapaciteta${sfPetsSuffix()}:
      <br><b class="num">${fullDaysLabel(days)}</b>
      <br><span class="hint" style="display:block;margin-top:8px">Boravak se svejedno može upisati.</span></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" data-act="modal-close">Odustani</button>
      <button class="btn btn-primary" data-act="${next}">Upiši</button>
    </div>`);
  return true;
}

/* živi obračun ispod Ukupno/Avans: (ukupno ili predračun) - avans - ostale uplate.
   Računa iz onoga što je UKUCANO u formu (SF), ne iz sačuvanog boravka - mijenja se dok kucaš. */
function sfDueHTML(){
  if (!SF || SF.paid) return '';
  const from = SF.from, to = SF.type === 'dnevni' ? SF.from : SF.to;
  const est = estimateFor(sfDraftPets(), SF.type, from, to);
  const p = parseMoney(SF.price);
  const ukupno = p != null ? p : (est || 0);
  const av = parseMoney(SF.avans) || 0;
  const st0 = SF.id ? D.stays.find(s => s.id === SF.id) : null;
  const ostale = st0 ? stayPayments(st0).filter(x => !x.av).reduce((s, x) => s + x.a, 0) : 0;
  if (!av && !ostale) return '';
  const due = Math.max(0, Math.round((ukupno - av - ostale) * 100) / 100);
  const avD = st0 ? stayAvansDatum(st0) : null;
  return `<div class="pay-list" style="margin:2px 0 14px">
    <div class="pay-row"><span>ukupno${p == null && est ? ' (predračun)' : ''}</span><b class="num">${money(ukupno)}</b></div>
    ${av ? `<div class="pay-row"><span>avans${avD ? ' · primljen ' + fmtD(avD) : ''}</span><b class="num">&minus; ${money(av)}</b></div>` : ''}
    ${ostale ? `<div class="pay-row"><span>uplaćeno do sada</span><b class="num">&minus; ${money(ostale)}</b></div>` : ''}
    <div class="pay-row pay-sum"><span>${due > 0 ? 'za naplatu' : 'sve je plaćeno'}</span><b class="num" style="color:var(${due > 0 ? '--primary' : '--ok'})">${money(due)}</b></div>
  </div>`;
}

  /* ================= UPISAN BORAVAK: prvo pregled, izmjena na dodir (Novica 25.10.) =================
     Gore stoji ono što treba sa povocem u ruci: stanje, napomene, novac i Došao/Otišao/Naplati.
     Termin, boks, cijena/avans i napomena su redovi koji se otvaraju dodirom - pun kalendar više ne stoji
     na putu do dugmadi (zalutao dodir je mijenjao termin). Sačuvaj se pojavljuje tek kad je nešto dirano. */

  else if (otisao) chip = `<span class="badge b-line">završen</span>`;
  else if (tu){ chip = `<span class="badge b-ok">u pansionu${st0.arrivedAt ? ' od ' + fmtD(st0.arrivedAt) : ''}</span>`; if (st0.arrivedAt) undo = `<button class="sf-undo" data-act="sf-undo-arrived">poništi dolazak</button>`; }
  else if (dolaziDanas) chip = `<span class="badge b-warn">dolazi danas</span>`;
  else chip = `<span class="badge b-line">rezervacija</span>`;
  const kraj = st0.leftAt && st0.leftAt < st0.to ? st0.leftAt : st0.to;
  const terminTxt = st0.from === kraj ? fmtD(st0.from) : fmtD(st0.from) + ' – ' + fmtD(kraj);
  const stanjeHTML = `<div class="card sf-stanje">
    <div class="sf-st-top">${chip}${undo}</div>
    <div class="sf-termin num">${terminTxt}<small> · ${stayLenLabel(st0)}</small></div>
    <div class="sf-boks">${boxBadge(st0, true)}</div>
    ${petsChipsHTML}
